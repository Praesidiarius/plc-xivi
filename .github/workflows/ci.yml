name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Checks
    runs-on: ubuntu-latest
    # **Raised from 20 because the run crossed it, and the number is a symptom
    # rather than a setting.** Measured on this workflow: 9 minutes on 2026-08-16,
    # 16 and 17 on the 18th and 19th, and 21 on the 20th, where it was killed at
    # 78% of the suite. The ceiling did not move; the run did.
    #
    # 35 buys room rather than fixing anything. What is actually growing is the
    # suite and the image build, and if this needs raising again the thing to
    # look at is which of the two, not this line.
    timeout-minutes: 35

    env:
      # The runner may already be using the default ports; nothing in the suite
      # talks to the app over HTTP, so where they land does not matter.
      HTTP_PORT: 8080
      HTTPS_PORT: 8443
      HTTP3_PORT: 8443

    steps:
      - uses: actions/checkout@v4

      # Deliberately the same script you run locally, not a re-listing of the
      # same checks in YAML. One definition, no drift. --coverage is the only
      # difference, because the report is only wanted where something reads it.
      - name: Run the CI suite
        run: bin/ci --coverage

      # Not gated on the run succeeding: coverage is most interesting on a build
      # that just broke. fail_ci_if_error defaults to false, so this stays quiet
      # until CODECOV_TOKEN exists rather than turning the build red for a
      # reporting step.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: coverage/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Container logs
        if: failure()
        # bin/compose rather than a bare `docker compose`: it derives the same
        # project bin/ci just used, so this cannot fetch another stack's logs
        # (XIV-55). The runner's checkout is the main one and the two agree
        # today — the point is that they still agree if that ever changes.
        run: bin/compose logs --no-color --tail 200
