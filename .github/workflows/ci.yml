name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # The runner may already be using the default ports; nothing in the suite
      # talks to the app over HTTP, so where they land does not matter.
      HTTP_PORT: 8080
      HTTPS_PORT: 8443
      HTTP3_PORT: 8443

    steps:
      - uses: actions/checkout@v4

      # Deliberately the same script you run locally, not a re-listing of the
      # same checks in YAML. One definition, no drift.
      - name: Run the CI suite
        run: bin/ci

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
