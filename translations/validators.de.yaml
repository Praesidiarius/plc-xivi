# Unsere eigenen Constraint-Meldungen (XIV-8), informell wie der Rest.
'Another record already uses this value.': Diesen Wert verwendet bereits ein anderer Datensatz.
'A code is made of A-Z, 0-9 and single hyphens, like GIVE-10. Lower case is fine — it is stored in capitals either way.': Ein Code besteht aus A-Z, 0-9 und einzelnen Bindestrichen, etwa GIVE-10. Kleinbuchstaben sind in Ordnung — gespeichert wird er ohnehin in Grossbuchstaben.
'{{ value }} is not a phone number.': '{{ value }} ist keine Telefonnummer.'
'{{ value }} has no country code, and this installation has not said which country it is in — so there is no way to tell which number it is. Type it in full, like +41 79 123 45 67, or set the country on the instance profile.': '{{ value }} hat keine Landesvorwahl, und diese Installation hat nicht hinterlegt, in welchem Land sie ist — also lässt sich nicht sagen, welche Nummer das ist. Schreib sie vollständig, etwa +41 79 123 45 67, oder trag das Land im Instanz-Profil ein.'
'{{ value }} is not a phone number that can be dialled in {{ country }}. Check the digits, or type it in full with its country code.': '{{ value }} ist keine Telefonnummer, die man in {{ country }} wählen kann. Prüf die Ziffern, oder schreib sie vollständig mit Landesvorwahl.'
'{{ value }} carries an extension. A number is stored without one, so the extension would be silently dropped — put it in a field of its own.': '{{ value }} enthält eine Durchwahl. Gespeichert wird eine Nummer ohne, die Durchwahl ginge also stillschweigend verloren — leg dafür ein eigenes Feld an.'
'{{ value }} is not a period.': '{{ value }} ist kein Zeitraum.'
'A period has to start somewhere. Fill in the first date.': 'Ein Zeitraum fängt irgendwo an. Trag das erste Datum ein.'
'Say when this period ends, or tick that it has no end date.': 'Sag, wann dieser Zeitraum endet — oder kreuz an, dass er kein Enddatum hat.'
'This period ends before it starts. The second date is the moment the period stops rather than its last day, so it has to come after the first one.': 'Dieser Zeitraum endet, bevor er beginnt. Das zweite Datum ist der Moment, an dem er aufhört, und nicht sein letzter Tag — es muss also nach dem ersten liegen.'

# Was ein Feld mit mehreren Datensätzen zu einem Eintrag sagt, den es nicht lesen kann (XIV-113).
'{{ value }} is not a record id. Several records are named by their ids separated by a comma, as in 12,34.': '{{ value }} ist keine Datensatz-ID. Mehrere Datensätze werden über ihre IDs benannt, durch Komma getrennt, etwa 12,34.'

# Was ein Dateifeld zu einer Tabellenzelle sagt, die keine Datei ist (XIV-115).
'{{ value }} is not a file kept by this installation. A file gets into a record by being uploaded to it, so a spreadsheet can move a record between shapes but cannot bring a file with it.': '{{ value }} ist keine Datei, die diese Installation verwahrt. Eine Datei kommt an einen Datensatz, indem sie hochgeladen wird: Eine Tabelle kann Datensätze verschieben, aber keine Datei mitbringen.'
