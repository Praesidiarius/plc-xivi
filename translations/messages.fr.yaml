group:
    tooltip_edit: Modifier le groupe
    tooltip_delete: Supprimer le groupe
    title: Groupes d’autorisations
    one: Groupe
    new: Nouveau groupe
    members: Membres
    permissions: Autorisations
    store: La boutique
    store_help: >-
        Ajouter des modules à cette installation, ce qui n’est une autorisation sur aucun module
        en particulier : parcourir ne porte sur aucun d’eux, et installer porte sur un que vous
        n’avez pas encore.
    intro: >-
        Un groupe est un ensemble d’autorisations données à une fonction plutôt qu’à une personne,
        qui survit donc à un départ. Tout s’additionne : un utilisateur a ce que l’ensemble de ses
        groupes lui donne, et rien ici ne peut retirer une autorisation.
    empty_title: Pas encore de groupes
    empty_body: >-
        Les administrateurs peuvent déjà tout faire. Tous les autres ne peuvent rien faire tant
        qu’un groupe n’en décide pas autrement.
    make_first: Créer le premier
    name_placeholder: Vente, Support, Lecture seule…
    name_help: Comment la fonction s’appelle. Vous pourrez la renommer.
    what_it_may_do: Ce que ce groupe peut faire
    matrix_help: >-
        Une ligne par module que ce client a, une colonne par action.
        <strong>Ses propres enregistrements</strong> signifie seulement ceux que la personne a
        créés ; cela vaut pour les actions qui nomment un enregistrement existant, ajouter et
        importer sont donc tout ou rien.
    no_modules: Aucun module n’est installé, il n’y a donc encore rien à accorder.
    instance: L’instance elle-même
    instance_help: >-
        Les parties de cette installation qui ne sont pas les enregistrements d’un module. Il y en
        a une de chaque ; la seule question est donc de savoir qui peut la consulter et qui peut
        la modifier.
    who_is_in_it: Qui en fait partie
    members_help: >-
        Les administrateurs ne sont pas listés : ils peuvent déjà tout faire, et en mettre un dans
        un groupe laisserait croire que cela pourrait lui être retiré.
    no_members_available: Tout le monde ici est administrateur ; il n’y a donc encore personne à ajouter.
    delete_title: 'Supprimer %group%'
    delete_heading: Supprimer «%group%» ?
    delete_warning: Ses membres perdent ce qu’il leur donnait, sauf si un autre groupe leur donne la même chose.
    delete_note: >-
        Personne n’est supprimé et rien de ce qui leur appartient n’est touché ; seulement le
        groupe et ce qu’il accordait. Cela ne peut pas être annulé, mais peut être refait.
    delete_confirm: Supprimer le groupe
    edit_aria: 'Modifier %group%'
    delete_aria: 'Supprimer %group%'

profile:
    region: Région
    region_none: Réglage par défaut de l’application
    region_help: Selon les conventions de quel pays cette installation écrit. Quelqu’un d’ailleurs peut choisir les siennes sur son compte.
    timezone: Fuseau horaire
    timezone_none: 'Selon la région (%zone%)'
    timezone_help: >-
        Sur quelle horloge les heures s’affichent ici. La région répond d’elle-même là où un pays
        n’a qu’un fuseau ; là où il en a plusieurs, choisissez, parce que rien à l’écran ne dit
        que les heures sont fausses. Les instants sont toujours stockés de la même manière.
    payment_terms: Délai de paiement (jours)
    payment_terms_help: >-
        Combien de temps un client a pour payer, compté depuis la date de la facture. Un contact
        peut recevoir un délai à lui. Laissez vide et les factures ne portent pas d’échéance,
        rien n’est donc jamais en retard.
    vat_mode: Prix
    vat_mode_none: 'Non réglé (prix hors TVA)'
    vat_mode_excluded: Prix hors TVA
    vat_mode_included: Prix TVA comprise
    vat_mode_help: >-
        Si les prix que vous tapez contiennent déjà la TVA. Un commerce affiche 19.95 TVA
        comprise parce que c’est le chiffre en rayon ; un bureau de conseil chiffre en net et
        ajoute la TVA sur la facture. Chaque nouvelle commande et facture en prend une copie et
        peut être réglée à part ; changer ceci ne modifie donc jamais un document déjà envoyé.
    title: Profil de l’entreprise
    intro: >-
        Comment cette installation s’appelle, et la monnaie dans laquelle elle travaille. Cela
        vaut pour tout le monde ici, pas seulement pour vous.
