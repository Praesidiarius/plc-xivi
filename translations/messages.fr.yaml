# Français, vouvoyé (XIV-153) : le registre naturel d'un logiciel de gestion en
# Suisse romande, là où l'allemand tutoie. Un registre se choisit une fois pour
# toutes, parce qu'en changer signifie réécrire chaque phrase (XIV-8).
#
# Les clés suivent messages.en.yaml exactement, dans les deux sens ;
# TranslationCatalogueTest fait échouer le build sinon. Une clé manquante
# retomberait sur l'anglais et deviendrait un paragraphe isolé dans la mauvaise
# langue sur l'écran de quelqu'un d'autre.

