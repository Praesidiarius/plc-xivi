email_template:
    templates: Modèles d’e-mail
    templates_intro: >-
        Ce que disent les e-mails de %module%. Rédigés ici plutôt que téléversés : un e-mail est
        du texte, il n’y a donc rien à mettre en page dans Word et rien à téléverser à nouveau
        pour corriger une coquille.
    none_yet: Pas encore de modèles d’e-mail. Rien ne peut être envoyé tant qu’il n’y en a pas.
    write: Rédiger un modèle
    form_intro: Un nom, un objet et le message lui-même. L’objet comme le message acceptent des espaces réservés.
    subject: Objet
    subject_placeholder: 'Facture [record_id] de [tenant.name]'
    subject_help: L’objet par défaut. Il accepte les espaces réservés comme le message, et peut être changé pour un envoi isolé.
    body: Message
    body_placeholder: |-
        Bonjour [first_name],

        merci pour votre commande.
    body_help: >-
        Markdown. Ligne vide entre les paragraphes, *accent* entre astérisques, - pour une puce.
        Tout ce qui ressemble à du HTML part tel que vous l’avez tapé.
    name_placeholder: Confirmation de commande, Rappel, Remerciement…
    name_help: Comment il s’appelle dans la liste et dans la fenêtre d’envoi. Personne dehors ne le voit.
    written_when: Rédigé
    placeholders_help: >-
        Tapez-les dans l’objet ou dans le message, crochets compris. Ils sont remplacés par les
        valeurs de cet enregistrement quand l’e-mail part. Ce que vous omettez reste dehors.
    collection_help: >-
        Celui-ci n’est pas une valeur : il devient un tableau entier, une ligne par entrée, dans
        leur ordre. Mettez-le sur une ligne à lui plutôt qu’au milieu d’une phrase. Dans l’objet,
        il ressort vide : un tableau n’est pas un objet de message.
    collection_columns_help: >-
        Chaque colonne est montrée, sauf indication contraire. Nommez celles que vous voulez, dans
        l’ordre voulu, écrivez [%example%] ; c’est en général ce qu’un e-mail demande, puisque le
        document joint énumère déjà tout.
    collection_kinds_help: >-
        Les entrées de tous types finissent dans le même tableau, dans leur ordre, et une colonne
        pour laquelle une entrée n’a rien reste vide. Ajoutez le type, [lines:article], pour un
        tableau de ce seul type.
    wrapper: Autour de votre message
    wrapper_help: >-
        Ce que vous rédigez ici est le message. Le cadre autour, la mise en page et le pied avec
        le nom de votre entreprise, fait partie de Xivi et est le même pour chaque e-mail ;
        personne ne peut donc le casser en modifiant un modèle.
    incomplete: Un modèle a besoin d’un nom, d’un objet et d’un message. Rien n’a été enregistré.
    too_long: 'Le nom et l’objet font au plus %max% caractères. Rien n’a été enregistré.'

