    company_name_help: Comment vous vous appelez. Une fois réglé, il remplace le nom dans la barre ci-dessus.
    logo: Logo
    logo_help: >-
        PNG ou JPEG, jusqu’à %size% Ko. Il apparaît dans la barre ci-dessus et sur la page de
        connexion de cette adresse ; quiconque atteint cette page peut donc le voir, et c’est à
        cela qu’un logo sert.
    logo_remove: Retirer le logo
    currency: Monnaie
    currency_help: Dans quoi les prix sont exprimés. Rien ne l’impose, et les modules qui en ont besoin la demanderont.
    currency_none: Pas encore choisie
    read_only: Vous pouvez consulter ceci, mais pas le modifier.
    mail: Courrier sortant
    mail_intro: >-
        D’où part le courrier que cette installation envoie. Laissez le serveur vide et il part
        par chez nous, avec votre adresse en réponse. Remplissez-le et il part par votre propre
        fournisseur, authentiquement de chez vous.
    mail_sender_address: Adresse d’expéditeur
    mail_sender_address_help: >-
        L’adresse que vos clients voient, et où vont leurs réponses. Nécessaire avant de pouvoir
        utiliser un serveur.
    mail_smtp_host: Votre serveur SMTP
    mail_smtp_host_help: Laissez vide pour envoyer par cette installation à la place.
    mail_smtp_port: Port
    mail_smtp_port_help: Vide pour le port par défaut. 465 pour TLS.
    mail_smtp_user: Utilisateur SMTP
    mail_smtp_password: Mot de passe SMTP
    mail_smtp_password_help: Stocké chiffré, et jamais montré à nouveau.
    mail_smtp_password_set: Un mot de passe est stocké. Laissez vide pour le conserver.
    payment: Être payé
    payment_intro: >-
        Ce que dit la section paiement QR d’une facture : le compte sur lequel elle se paie, et
        votre adresse comme bénéficiaire. Laissez l’IBAN vide et les factures partent sans
        section paiement.
    address_street: Rue
    address_building_number: 'N°'
    address_postal_code: NPA
    address_city: Localité
    payment_iban: IBAN
