        Comment un paiement retrouve sa facture sur votre relevé bancaire. La référence de
        créancier fonctionne avec tout IBAN et est le réglage par défaut. La référence QR exige
        le QR-IBAN que votre banque délivre pour elle. Sans référence, le numéro de facture ne
        voyage qu’en texte libre.
