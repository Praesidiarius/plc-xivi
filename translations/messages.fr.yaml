signup:
    mail:
        subject: Confirmez votre installation Xivi
        greeting: 'Bonjour %company%,'
        body: >-
            Quelqu’un a demandé une installation Xivi nommée %slug% avec cette adresse. Suivez le
            lien ci-dessous pour confirmer que c’était vous ; rien n’est créé avant.
        button: Confirmer cette adresse
        expiry: 'Le lien cesse de fonctionner après %hours% heures, et redemander en envoie un nouveau.'
        unexpected: >-
            Si vous ne vous y attendiez pas, rien n’est exigé de vous et rien n’a été créé. Vous
            pouvez ignorer ce message.
    confirmation:
        title: Confirmation d’inscription
        confirmed: 'Merci, %company% est confirmée.'
        already: '%company% était déjà confirmée. Rien de plus n’est nécessaire.'
        expired: Ce lien a expiré.
        slug_taken: 'Le nom %slug% a été pris pendant que ce lien attendait.'
        unknown: Ce lien n’appartient à aucune inscription encore en attente.
        next: 'Nous mettons %slug% en place et vous écrirons quand ce sera prêt.'
        sign_up_again: S’inscrire à nouveau depuis la même adresse en démarre une nouvelle.
    stalled:
        subject: 'Votre installation %slug% n’est pas encore prête'
        greeting: 'Bonjour %company%,'
        body: >-
            Vous avez confirmé cette adresse et nous avez demandé de mettre en place une installation
            nommée %slug%. Elle n’est pas prête, et nous sommes désolés de vous avoir laissé attendre
            sans un mot.
        hand: >-
            La mise en place a rencontré quelque chose qui ne se résoudra pas tout seul ; il faut donc
            que l’un de nous s’en occupe à la main. Quelqu’un ici l’a maintenant vu : ce message a été
            envoyé par une personne, pas par le système.
        next: >-
            Nous vous écrirons de nouveau à cette adresse, soit quand votre installation sera prête,
            soit si nous avons d’abord une question à vous poser.
        no_action: >-
            Il n’y a rien à faire de votre côté en attendant. Vous réinscrire n’aiderait pas non plus :
            cette adresse retient déjà votre demande, et le formulaire en refusera une seconde.
