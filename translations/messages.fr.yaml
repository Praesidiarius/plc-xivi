        intro: >-
            Des titres sur le formulaire. Une section groupe des champs sur le formulaire et sur
            la page de l’enregistrement et ne change rien d’autre : les valeurs sont stockées,
            validées, filtrées et mises sur les documents exactement comme avant.
        none_yet: Pas encore de sections ; chaque champ est donc dessiné d’une traite. Créez-en une ci-dessous et placez-y des champs depuis la page des champs.
        fields: Champs
        fields_none: encore aucun
        fields_count: '%count% champs'
        add_label: Ajouter une section
        add_placeholder: Facturation
        add_help: >-
            Le nom vous appartient et peut être changé à tout moment. Rien ne bouge quand vous en
            renommez une, parce que ce qu’un champ porte est un code court tiré du premier nom que
            vous lui donnez.
        note: >-
            L’ordre est à vous et ne se déduit pas des champs : laissez des écarts de dix et tapez
            15 pour intercaler quelque chose. Une section sans champs est conservée ici et n’est
            pas dessinée sur le formulaire tant que rien n’y est.
        remove_title: 'Retirer la section «%section%» ?'
        remove_body: >-
            Ceci retire le titre et rien d’autre. Une section n’est pas un contenant : elle ne
            détient rien, et aucun enregistrement n’a jamais dépendu d’une section.
        remove_none: Rien n’y est, donc rien ne bouge.
        remove_holding: >-
            %count% champs y sont. Ils gardent leurs valeurs, leur ordre, leurs largeurs et leurs
            règles, et reviennent en haut du formulaire. Les replacer ailleurs se fait en un
            choix de liste chacun.
        remove_note: >-
            Rien ici ne supprime de données, et rien ici ne change la façon dont un enregistrement
            est stocké ou retrouvé. Seulement l’allure du formulaire et de la page de
            l’enregistrement.
        remove_confirm: Retirer la section
    options:
        link: 'Options (%count%)'
        title: 'Options de «%field%»'
        intro: Ce que l’on choisit dans ce champ. En ajouter une prend effet immédiatement.
        back: Retour aux champs
        stored: Stocké comme
        held: Enregistrements
        held_none: aucun
        none: Ce champ n’a pas encore d’options ; il ne propose donc rien et accepte tout ce qu’on y tape. Ajoutez-en ci-dessous.
        add_label: Ajouter des options, une par ligne
        add_placeholder: |-
            Palette
            Caisse
        add_help: >-
            Un libellé par ligne. Ce que chaque enregistrement stocke est un code court tiré du
            premier libellé que vous donnez, <code>palette</code>, et il ne change plus jamais ;
            renommer une option plus tard ne coûte donc rien.
        removal_note: >-
            Une option qu’aucun enregistrement ne porte peut être retirée. Une que des
            enregistrements portent, non : ils garderaient une valeur absente de la liste et ne
            pourraient plus être enregistrés avant d’être corrigés.
        module_field: >-
            Ce champ est venu avec le module, et ses options font partie de ce que le module
            fait : les états entre lesquels il déplace les enregistrements, les types
            d’enregistrement qu’il connaît. Vous pouvez ajouter des options et les renommer ; en
            retirer une n’est pas proposé.
        on_a_list: >-
            Ce champ prend ses valeurs dans la liste partagée «%list%» ; les options ci-dessous
            sont donc les siennes propres et ne servent pas. C’est là-dessus qu’il retomberait si
            vous le retiriez de la liste.
        on_a_list_link: Ouvrir cette liste
    # Changer le type d’un champ sur un client qui a déjà des enregistrements
    # ([XIV-146], §7.2). Ces phrases pèsent plus lourd que toutes les autres de
    # ce fichier : ce qui est accepté réécrit chaque valeur d’une colonne, la
    # moitié ne se défait pas, et une partie est la proposition de jeter des
    # valeurs. Chaque chiffre y est compté et non deviné, et chaque valeur
    # nommée est une chaîne que l’on peut aller chercher.
    convert:
        link: Changer le type
        title: 'Quel type de champ est «%field%» ?'
        held: >-
            <strong>%count% enregistrements ont une valeur ici.</strong> Chacun est relu par le
            type choisi, et la page suivante dit ce que cela leur fait avant que quoi que ce soit
            soit écrit.
        held_none: >-
            Rien n’a encore de valeur dans ce champ, il n’y a donc rien à réécrire : choisir un
            type change seulement ce que le champ est.
        settings_note: >-
            Une conversion change le type de champ et rien d’autre. Ce que le nouveau type accepte
            qu’on lui dise, une longueur maximale, un pays pour lire les numéros, se règle ensuite
            sur la page du champ.
        none: Il n’y a pas d’autre type de champ que celui-ci pourrait devenir.
        not_offered: >-
            Une liste d’options et un lien vers un autre module ne sont pas proposés ici. Il faut
            d’abord dire aux deux ce que les valeurs veulent dire avant qu’ils puissent en lire
            une, et c’est une décision à part : ajoutez un champ de ce type et déplacez-y les
            valeurs.
        check_title: 'Convertir «%field%» ?'
        check_intro: 'Chaque valeur de ce champ est relue comme une valeur <code>%to%</code> et non <code>%from%</code>.'
        check_no_records: 'Aucun enregistrement n’a de valeur ici, rien n’est donc réécrit. Seul le champ change.'
        check_converts: '<strong>%count% enregistrements se convertissent</strong>, et %changes% d’entre eux finissent avec autre chose que ce qu’ils ont aujourd’hui.'
        check_refused: '<strong>%count% enregistrements ont quelque chose qu’un champ <code>%to%</code> ne sait pas lire.</strong>'
        check_held_by: 'sur %count% enregistrements'
        check_refused_choice: >-
            Rien ne change tant que vous n’avez pas dit ce qu’il advient de ceux-là. Allez les
            corriger d’abord, ou videz-les ici, ce qui jette ce qu’ils disent.
        check_shared: 'Lus comme des valeurs <code>%to%</code>, plusieurs enregistrements se révèlent avoir la même, et ce champ est marqué unique.'
        check_shared_fix: >-
            Cela ne peut pas passer : ces enregistrements briseraient une promesse que «%field%»
            tient. Réglez-les, ou retirez d’abord la règle d’unicité du champ.
        check_reversible: >-
            Reconvertir dans l’autre sens rendrait à chaque enregistrement exactement ce qu’il a
            aujourd’hui : cela peut donc se défaire.
        check_final: Cela ne peut pas se défaire.
        check_final_history: >-
            Ce que chaque enregistrement a aujourd’hui est écrit dans son historique avant d’être
            remplacé, l’ancienne valeur reste donc lisible sur l’enregistrement même quand rien ne
            peut la remettre.
        check_empty: 'Oui, vider les %count% enregistrements illisibles. Je comprends que ce qu’ils disent est jeté.'
        check_agree: 'Oui, convertir %count% enregistrements en %to%.'
        check_agree_final: 'Oui, convertir %count% enregistrements en %to%. Je comprends que cela ne se défait pas.'
        check_do: 'Convertir en %to%'
    numbering:
        title: Numérotation
        pattern: Motif
        pattern_help: >-
            <code>{number}</code> est le compteur, et <code>{number:4}</code> le complète à quatre
            chiffres pour que trier le texte trie les documents. <code>{year}</code> est l’année
            où le numéro est donné ; un motif qui le contient recompte depuis un chaque janvier,
            parce qu’il a un compteur à lui.
        numbers_nothing: >-
            Ceci ne contient pas de <code>{number}</code> ; cela ne numéroterait donc rien et le
            champ resterait à remplir à la main. Impossible à enregistrer.
        next_is: Le prochain numéro sera
        from_year: 'Du compteur de %period%, qui repart chaque janvier.'
        from_forever: D’un seul compteur, qui ne repart jamais.
        counter_switch: >-
            Ceci puise dans un autre compteur que le motif en service, et ce compteur est à %at%.
            Rien n’est renuméroté : le prochain numéro est simplement le prochain que ce compteur
            donne, qui peut être plus bas que le dernier que vous avez vu.
        counter_label: Faire démarrer le compteur à
        counter_help: 'Laissez vide pour continuer depuis %at%. Renseignez-le si vous venez d''un autre système et que votre prochain numéro doit dépasser ceux qu''il a déjà atteints.'
        counter_back: >-
            Le compteur est à %at% ; un numéro plus bas serait donc donné une seconde fois. Cela
            sera refusé : un numéro en double sur un document n’est pas quelque chose qui se
            corrige après coup.
        nothing_renumbered: >-
            Les numéros déjà donnés ne changent jamais. Ceci décide de quoi aura l’air le prochain
            et d’où il vient, et rien du tout des documents que quiconque détient déjà.
        start_title: Numéroter ce champ
        start_link: Le numéroter
        review: Voir ce que cela ferait
        on_blank: >-
            <strong>%count% enregistrements n’ont rien dans ce champ.</strong> Ils reçoivent des
            numéros maintenant, du plus ancien au plus récent, pour que le numéro dise quand
            l’enregistrement a été créé et non quand quelqu’un l’a ouvert pour la dernière fois.
        on_none_blank: >-
            Chaque enregistrement a déjà quelque chose dans ce champ ; rien n’est donc écrit dans
            aucun d’eux. La numérotation commence avec le prochain enregistrement créé.
        on_held: >-
            <strong>%count% enregistrements portent déjà une valeur</strong> et gardent exactement
            ce qu’ils ont. Tout ce qui parmi eux ressemble à un numéro que ce motif produirait est
            repéré d’abord, et le compteur démarre au-dessus du plus haut d’entre eux.
        on_derived: >-
            Une fois ce champ numéroté, le moteur le remplit et personne n’y tape ; c’est ce qui
            empêche quelqu’un de saisir un numéro que le compteur s’apprête à donner.
        start_confirm_title: 'Numéroter «%field%» ?'
        start_pattern: 'Le motif sera <code>%pattern%</code>.'
        start_writes: >-
            <strong>%count% enregistrements sans numéro en recevront un</strong>, dans l’ordre où
            ils ont été créés.
        start_writes_none: >-
            Aucun enregistrement n’est modifié : chacun d’eux porte déjà une valeur dans ce champ,
            et aucune de celles-ci ne change.
        start_range: 'Ils vont de <code>%first%</code> à <code>%last%</code>.'
        start_irreversible: >-
            Ceci ne peut pas être annulé. Un numéro qui a figuré sur un enregistrement est un
            numéro que quelqu’un a pu lire au téléphone ; rien ici n’en reprend donc un.
        start_found: >-
            %count% enregistrements portent déjà un numéro que ce motif aurait pu produire. Ils
            restent tels quels, et le compteur démarre à %from% pour qu’aucun d’eux ne puisse être
            donné une seconde fois.
        start_unrecognised: >-
            %count% autres portent quelque chose que ce motif ne pourrait jamais produire, une
            référence tapée sous une autre forme. Ceux-là ne peuvent entrer en collision avec
            rien et restent tels quels.
        start_next: 'Le prochain enregistrement créé après ceci sera <code>%next%</code>.'
        start_unique: >-
            <strong>Ce champ devient aussi unique.</strong> Un numéro que deux enregistrements ne
            peuvent pas partager, c’est ce qu’un numéro de document <em>est</em> ; la promesse
            cesse donc d’être de l’arithmétique et devient un index dans la base de données : rien
            ne peut écrire un second enregistrement portant un numéro déjà donné. Si deux
            enregistrements partagent déjà une valeur ici, cela ne peut pas être promis et rien
            n’est changé ; on vous dira quelles valeurs ils partagent.
        start_note: >-
            Le compteur pourra être avancé après coup, sur la page de numérotation de ce champ, si
            votre ancien système est allé plus loin que les numéros déjà présents ici.
        start_agree: 'Oui, écrire des numéros dans %count% enregistrements existants. Je comprends que cela ne peut pas être annulé.'
        start_agree_none: 'Oui, numéroter ce champ à partir de maintenant.'
        start_do: Lancer la numérotation
        stop_link: Arrêter de numéroter ce champ
        stop_title: 'Arrêter la numérotation de «%field%» ?'
        stop_keeps: >-
            <strong>Les numéros restent.</strong> Les %count% enregistrements gardent exactement ce
            qu’ils portent ; ils figurent sur des documents que des clients détiennent, et rien
            ici ne les atteint.
        stop_typeable: >-
            Le champ redevient une zone de texte ordinaire : il apparaît dans le formulaire,
            chacun peut y taper, et rien ne vérifie ce qui s’y tape. Les nouveaux enregistrements
            n’y reçoivent rien, sauf si quelqu’un le remplit.
        stop_counter: >-
            Le compteur est conservé là où il est ; réactiver la numérotation plus tard continue
            donc à partir de là, au lieu de repartir sur des numéros déjà sortis.

value_list:
    title: Listes
    intro: >-
        Une liste que vous tenez une fois et utilisez depuis plusieurs champs. «Région» sur un
        contact et «Région» sur une commande peuvent être la même liste, qui ne peut alors pas se
        désaccorder.
    none: Pas encore de listes. Créez-en une ci-dessous, puis faites-y pointer un champ à choix dans l’éditeur de champs.
    name: Nom
    stored: Stockée comme
    entries: Entrées
    used_by: Utilisée par
    used_by_nothing: rien pour l’instant
    back: Retour aux listes
    new_label: Nom de la nouvelle liste
    new_placeholder: Régions
    new_help: >-
        Ce que chaque enregistrement stocke est un code court tiré du nom que vous donnez,
        <code>regions</code>, et il ne change plus jamais ; renommer la liste plus tard ne coûte
        donc rien.
    no_entries: Cette liste est vide. Ajoutez des entrées ci-dessous, une par ligne.
    colour: Couleur
    icon: Icône
    under: Sous
    no_colour: aucune
    no_icon: aucune
    no_parent: '—'
    add_label: Ajouter des entrées, une par ligne
    removal_note: >-
        Une entrée qu’aucun enregistrement ne porte peut être retirée. Une que des enregistrements
        portent, non, où que ce soit dans l’installation et pas seulement dans le module que vous
        regardez : ces enregistrements garderaient une valeur que la liste n’a plus.
    merge:
        title: Fusionner deux entrées
        intro: >-
            Deux entrées qui se sont révélées vouloir dire la même chose : «Zurich» et «Zürich».
            Chaque enregistrement qui porte l’une est réécrit pour porter l’autre, et la première
            disparaît.
        from: Fusionner cette entrée
        into: dans celle-ci
        review: Vérifier la fusion
        confirm_title: 'Fusionner «%from%» dans «%into%» ?'
        what: >-
            Chaque enregistrement portant <strong>%from%</strong> portera <strong>%into%</strong>
            à la place, partout dans cette installation, et <strong>%from%</strong> sera retirée
            de «%list%».
        irreversible: Ceci ne peut pas être annulé. Ensuite, rien ne consigne laquelle des deux un enregistrement portait.
        writes_none: Aucun enregistrement ne porte cette entrée aujourd’hui ; rien n’est donc réécrit, l’entrée est simplement retirée de la liste.
        where: Où
        records: Enregistrements
        no_fields: Aucun champ ne prend encore ses valeurs dans cette liste ; rien n’est donc réécrit.
        note: >-
            Rien n’est écrit dans l’historique des enregistrements : c’est un changement sur une
            liste, pas une modification de chaque enregistrement, et les dates de ces
            enregistrements restent ce qu’elles étaient.
        agree_none: 'Oui : retirer cette entrée de la liste.'
        do: Les fusionner
    delete:
        title: Supprimer «%list%» ?
        in_use: >-
            Cette liste ne peut pas être supprimée tant que des champs y prennent leurs valeurs :
            %fields%. Faites d’abord pointer ces champs ailleurs.
        records_keep: >-
            <strong>Rien dans vos enregistrements n’est supprimé.</strong> Un enregistrement garde
            le code avec lequel il a été sauvegardé et montrera ce code au lieu du libellé.
        do: Supprimer la liste

upgrade:
    title: Ce que ce module a gagné
    subtitle: '%module% : les parties du module que votre exemplaire n’a pas.'
    back_to_fields: Retour aux champs
    nothing: 'Votre exemplaire de %module% a tout ce que le module déclare. Il n’y a rien à prendre.'
    nothing_outstanding: 'Votre exemplaire de %module% a tout ce que le module déclare, hormis ce que vous avez écarté ci-dessous.'
    intro: >-
        Un module peut grandir entre deux versions, et installer ne revient jamais toucher une
        installation qui existe déjà : depuis le jour où vous l’avez installé, vos définitions
        font foi. Rien de tout cela ne vous est donc arrivé. C’est proposé, et vous décidez
        élément par élément.
    keeps_yours: >-
        Seules des nouveautés sont ajoutées. Un champ que vous avez déjà n’est jamais proposé à
        nouveau, quoi que vous en ayez fait depuis, renommé, restreint ou réordonné, et rien de ce
        que vous avez déjà n’est changé. Aucun champ n’est retiré et aucun ne change de type.
    what: Quoi
    where: Va sur
    derived: rempli par le moteur
    dismiss: Pas celui-ci
    review: Voir ce que cela ferait
    review_note: Rien n’est écrit avant que vous ayez lu la page suivante.
    dismissed_title: Écartés
    dismissed_help: >-
        Vous avez dit non à ceux-ci ; ils ne sont donc plus proposés. Retirer un champ compte
        comme lui dire non : c’est ainsi qu’un champ supprimé exprès cesse de revenir. En proposer
        un à nouveau le remet sur la liste au-dessus.
    restore: Le proposer à nouveau
    banner_link: Voir de quoi il s’agit
    review_title: 'Ajouter ceci à %module% ?'
    review_adds: 'Ceci ajoute ce qui suit à votre exemplaire de <strong>%module%</strong> :'
    review_keeps: 'Ce que cela ne fait pas :'
    review_keeps_fields: >-
        Rien de ce que vous avez déjà n’est touché : pas un libellé, pas une largeur, pas une
        règle, pas leur ordre.
    review_keeps_values: >-
        Aucune valeur n’est écrite dans aucun enregistrement. Un champ que le moteur remplit
        arrive vide et se remplit à la prochaine sauvegarde de chaque enregistrement.
    review_keeps_removal: >-
        Aucun champ n’est retiré et aucun ne change de type. Ce sont deux questions à part, et
        ceci ne répond à aucune des deux.
    review_do: Les ajouter

import:
    file: Tableur
    file_help: 'Un export de ce module a exactement la forme attendue, avec une feuille par forme : %sheets%.'
    check: Vérifier
    back_to_list: Retour à la liste
    dry_run: Rien n’a été changé ; voici ce qu’importer ferait.
    how_title: Comment un fichier est lu
    how_columns: Une colonne peut être nommée par la clé d’un champ ou par son libellé.
    how_missing: Un champ sans colonne garde la valeur qu’il avait ; une colonne laissée vide l’efface.
    how_id: Une ligne avec un <code>id</code> met à jour cet enregistrement. Un <code>id</code> vide en ajoute un.
    how_names: >-
        Toute autre chose dans <code>id</code>, <code>ada</code> par exemple, nomme un
        enregistrement que ce fichier crée. C’est ainsi que de nouveaux enregistrements arrivent
        avec leurs lignes filles : donnez à chaque nouvel enregistrement un nom à vous dans
        <code>id</code>, et mettez le même nom dans le <code>parent_id</code> de la ligne fille.
        Un enregistrement dont l’<code>id</code> est vide est créé aussi, mais rien dans le
        fichier ne peut pointer vers lui.
    how_collections: >-
        Une feuille fille parle pour toute la collection : une ligne qu’elle n’énumère pas est
        retirée de l’enregistrement. Omettez la feuille pour n’y pas toucher.
    how_atomic: Un problème n’importe où refuse le fichier entier. Il n’y a pas d’état à moitié importé.

