    stalled:
        subject: 'La tua installazione %slug% non è ancora pronta'
        greeting: 'Buongiorno %company%,'
        body: >-
            Hai confermato questo indirizzo e ci hai chiesto di preparare un’installazione chiamata
            %slug%. Non è pronta, e ci dispiace averti lasciato aspettare senza dire nulla.
        hand: >-
            La preparazione ha incontrato qualcosa che non si risolve da sé, quindi serve che uno di
            noi se ne occupi a mano. Qualcuno qui ora l’ha visto: questo messaggio l’ha mandato una
            persona, non il sistema.
        next: >-
            Ti scriveremo di nuovo a questo indirizzo, o quando la tua installazione sarà pronta o se
            prima abbiamo bisogno di chiederti qualcosa.
        no_action: >-
            Nel frattempo non devi fare nulla. Iscriverti di nuovo non aiuta: questo indirizzo tiene
