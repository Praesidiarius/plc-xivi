# Italiano, informale («tu») come il tedesco (XIV-153): è il registro abituale
# del software in italiano, e un registro si sceglie una volta sola, perché
# cambiarlo dopo significa riscrivere ogni frase (XIV-8).
#
# Le chiavi seguono messages.en.yaml esattamente, in entrambe le direzioni;
# altrimenti TranslationCatalogueTest fa fallire il build. Una chiave mancante
# ricadrebbe sull'inglese e diventerebbe un paragrafo isolato nella lingua
# sbagliata sullo schermo di qualcun altro.

