        add_help: >-
            Un’etichetta per riga. Ciò che ogni record salva è un codice breve ricavato dalla
            prima etichetta che dai, <code>pallet</code>, e non cambia mai più; rinominare
            un’opzione più tardi non costa quindi nulla.
        removal_note: >-
            Un’opzione che nessun record porta si può togliere. Una che dei record portano no:
            resterebbero con un valore che non è più in lista e non si potrebbero più salvare
            finché qualcuno non li sistema.
        module_field: >-
            Questo campo è arrivato con il modulo, e le sue opzioni sono parte di ciò che il
            modulo fa: gli stati tra cui sposta i record, i tipi di record che conosce. Puoi
            aggiungere opzioni e rinominarle; toglierne una non è previsto.
        on_a_list: >-
            Questo campo prende i valori dalla lista condivisa “%list%”, quindi le opzioni qui
            sotto sono le sue proprie e non sono in uso. Sono ciò su cui ricadrebbe se lo
            togliessi dalla lista.
        on_a_list_link: Apri quella lista
    # Cambiare il tipo di un campo su un cliente che ha già dei record
    # ([XIV-146], §7.2). Queste frasi pesano più di ogni altra in questo file:
    # quel che si accetta riscrive ogni valore di una colonna, metà non si torna
    # indietro, e una parte è la proposta di buttare via dei valori. Ogni
    # numero qui è contato e non stimato, e ogni valore nominato è una stringa
    # che si può andare a cercare.
    convert:
        link: Cambia il tipo
        title: 'Che tipo di campo è “%field%”?'
        held: >-
            <strong>%count% record hanno un valore qui.</strong> Ognuno viene riletto dal tipo che
            sceglie, e la pagina successiva dice che cosa comporta per loro prima che venga scritto
            qualcosa.
        held_none: >-
            In questo campo non c’è ancora nessun valore, quindi non c’è niente da riscrivere:
            scegliere un tipo cambia solo che cosa è il campo.
        settings_note: >-
            Una conversione cambia il tipo di campo e nient’altro. Quel che si può dire al nuovo
            tipo, una lunghezza massima, un paese con cui leggere i numeri, si imposta dopo sulla
            pagina del campo.
        none: Non c’è nessun altro tipo di campo che questo possa diventare.
        not_offered: >-
            Un elenco di opzioni e un collegamento a un altro modulo non sono offerti qui. A
            entrambi va prima detto che cosa significano i valori prima che possano leggerne uno, e
            questa è una decisione a sé: aggiunga un campo di quel tipo e ci sposti i valori.
        check_title: 'Convertire “%field%”?'
        check_intro: 'Ogni valore di questo campo viene riletto come valore <code>%to%</code> invece che <code>%from%</code>.'
        check_no_records: 'Nessun record ha un valore qui, quindi non si riscrive nulla. Cambia solo il campo.'
        check_converts: '<strong>%count% record si convertono</strong>, e %changes% di loro finiscono con qualcosa di diverso da quel che hanno adesso.'
        check_refused: '<strong>%count% record hanno qualcosa che un campo <code>%to%</code> non sa leggere.</strong>'
        check_held_by: 'su %count% record'
        check_refused_choice: >-
            Non cambia nulla finché non dice che cosa deve succedere a quelli. Vada a sistemarli
            prima, oppure li svuoti qui, il che butta via quel che dicono.
        check_shared: 'Letti come valori <code>%to%</code>, più record risultano avere lo stesso, e questo campo è marcato univoco.'
        check_shared_fix: >-
            Così non può andare avanti: quei record romperebbero una promessa che “%field%” sta
            facendo. Li sistemi, oppure tolga prima la regola di univocità dal campo.
        check_reversible: >-
            Riconvertire all’indietro darebbe a ogni record esattamente quel che ha oggi, quindi si
            può tornare indietro.
        check_final: Questo non si può annullare.
        check_final_history: >-
            Quel che ogni record ha adesso viene scritto nella sua cronologia prima di essere
            sostituito, così il vecchio valore resta leggibile sul record anche quando nulla può
            rimetterlo.
        check_empty: 'Sì, svuota i %count% record che non si possono leggere. Capisco che quel che dicono viene buttato via.'
        check_agree: 'Sì, converti %count% record in %to%.'
        check_agree_final: 'Sì, converti %count% record in %to%. Capisco che questo non si può annullare.'
        check_do: 'Converti in %to%'
    numbering:
        title: Numerazione
        pattern: Schema
        pattern_help: >-
            <code>{number}</code> è il contatore, e <code>{number:4}</code> lo riempie a quattro
            cifre, così ordinare il testo ordina i documenti. <code>{year}</code> è l’anno in cui
            il numero viene dato; uno schema che lo contiene riconta da uno ogni gennaio, perché
            ha un contatore tutto suo.
        numbers_nothing: >-
            Questo non contiene <code>{number}</code>, quindi non numererebbe nulla e il campo
            resterebbe da riempire a mano. Non si può salvare.
        next_is: Il prossimo numero sarà
        from_year: 'Dal contatore di %period%, che riparte ogni gennaio.'
        from_forever: Da un unico contatore, che non riparte mai.
        counter_switch: >-
            Questo attinge a un contatore diverso da quello dello schema in uso, e quel contatore
            è a %at%. Nulla viene rinumerato: il prossimo numero è semplicemente il prossimo che
            quel contatore dà, e può essere più basso dell’ultimo che hai visto.
        counter_label: Fai partire il contatore da
        counter_help: 'Lascia vuoto per continuare da %at%. Impostalo se arrivi da un altro sistema e il tuo prossimo numero deve superare quelli che quello ha già raggiunto.'
        counter_back: >-
            Il contatore è a %at%, quindi un numero più basso verrebbe dato una seconda volta.
            Verrà rifiutato: un numero doppio su un documento non è qualcosa che si possa
            correggere dopo.
        nothing_renumbered: >-
            I numeri già dati non cambiano mai. Questo decide che aspetto avrà il prossimo e da
            dove viene, e proprio nulla dei documenti che qualcuno ha già in mano.
        start_title: Numera questo campo
        start_link: Numeralo
        review: Guarda che cosa farebbe
        on_blank: >-
            <strong>%count% record non hanno nulla in questo campo.</strong> Ricevono i numeri
            adesso, dal più vecchio, così il numero dice quando il record è nato e non quando
            qualcuno l’ha aperto l’ultima volta.
        on_none_blank: >-
            Ogni record ha già qualcosa in questo campo, quindi non viene scritto nulla in nessuno
            di loro. La numerazione comincia con il prossimo record creato.
        on_held: >-
            <strong>%count% record portano già un valore</strong> e tengono esattamente quello che
            hanno. Tra loro, tutto ciò che somiglia a un numero che questo schema produrrebbe
            viene individuato prima, e il contatore parte sopra il più alto.
        on_derived: >-
            Una volta numerato questo campo, il motore lo riempie e nessuno ci scrive; è ciò che
            impedisce a qualcuno di inserire un numero che il contatore sta per dare.
        start_confirm_title: 'Numerare “%field%”?'
        start_pattern: 'Lo schema sarà <code>%pattern%</code>.'
        start_writes: >-
            <strong>%count% record senza numero ne riceveranno uno</strong>, nell’ordine in cui
            sono stati creati.
        start_writes_none: >-
            Nessun record viene toccato: ognuno di loro porta già un valore in questo campo, e
            nessuno di quelli cambia.
        start_range: 'Vanno da <code>%first%</code> a <code>%last%</code>.'
        start_irreversible: >-
            Questo non si può annullare. Un numero che è stato su un record è un numero che
            qualcuno può aver letto al telefono, quindi nulla qui ne riprende uno.
        start_found: >-
            %count% record portano già un numero che questo schema avrebbe potuto produrre.
            Restano come sono, e il contatore parte da %from%, così nessuno di quei numeri può
            uscire una seconda volta.
        start_unrecognised: >-
            Altri %count% portano qualcosa che questo schema non potrebbe mai produrre, un
            riferimento scritto in un’altra forma. Quelli non possono scontrarsi con nulla e
            restano come sono.
        start_next: 'Il prossimo record creato dopo questo sarà <code>%next%</code>.'
        start_unique: >-
            <strong>Questo campo diventa anche univoco.</strong> Un numero che due record non
            possono condividere è ciò che un numero di documento <em>è</em>; la promessa smette
            quindi di essere aritmetica e diventa un indice nella banca dati: nulla può scrivere
            un secondo record con un numero già dato. Se due record condividono già un valore
            qui, questo non si può promettere e nulla viene cambiato; ti verrà detto quali valori
            condividono.
        start_note: >-
            Il contatore si potrà spostare in avanti dopo, sulla pagina di numerazione di questo
            campo, se il tuo vecchio sistema è arrivato più in là dei numeri già presenti qui.
        start_agree: 'Sì, scrivi numeri in %count% record esistenti. Capisco che non si può annullare.'
        start_agree_none: 'Sì, numera questo campo d’ora in poi.'
        start_do: Avvia la numerazione
        stop_link: Smetti di numerare questo campo
        stop_title: 'Smettere di numerare “%field%”?'
        stop_keeps: >-
            <strong>I numeri restano.</strong> Tutti i %count% record tengono esattamente ciò che
            portano; stanno su documenti che i clienti hanno in mano, e nulla qui li raggiunge.
        stop_typeable: >-
            Il campo torna a essere una normale casella di testo: compare nel modulo di
            inserimento, chiunque può scriverci, e nulla controlla che cosa. I nuovi record non
            ci ricevono nulla, a meno che qualcuno non lo compili.
        stop_counter: >-
            Il contatore resta dov’è, quindi riaccendere la numerazione più avanti continua da
            lì, invece di ripartire sopra numeri già usciti.

value_list:
    title: Liste
    intro: >-
        Una lista che tieni una volta sola e usi da più campi. “Regione” su un contatto e
        “Regione” su un ordine possono essere la stessa lista, che così non può andare per conto
        suo.
    none: Ancora nessuna lista. Creane una qui sotto, poi punta un campo a scelta su di lei nell’editor dei campi.
    name: Nome
    stored: Salvata come
    entries: Voci
    used_by: Usata da
    used_by_nothing: ancora nulla
    back: Torna alle liste
    new_label: Nome della nuova lista
    new_placeholder: Regioni
    new_help: >-
        Ciò che ogni record salva è un codice breve ricavato dal nome che dai,
        <code>regioni</code>, e non cambia mai più; rinominare la lista più tardi non costa
        quindi nulla.
    no_entries: Questa lista è vuota. Aggiungi voci qui sotto, una per riga.
    colour: Colore
    icon: Icona
    under: Sotto
    no_colour: nessuno
    no_icon: nessuna
    no_parent: '—'
    add_label: Aggiungi voci, una per riga
    removal_note: >-
        Una voce che nessun record porta si può togliere. Una che dei record portano no, ovunque
        nell’installazione e non solo nel modulo che stai guardando: quei record resterebbero con
        un valore che la lista non ha più.
    merge:
        title: Fondi due voci
        intro: >-
            Due voci che si sono rivelate voler dire la stessa cosa: “Zurigo” e “Zürich”. Ogni
            record che porta l’una viene riscritto per portare l’altra, e la prima se ne va.
        from: Fondi questa voce
        into: in questa
        review: Rivedi la fusione
        confirm_title: 'Fondere “%from%” in “%into%”?'
        what: >-
            Ogni record che porta <strong>%from%</strong> porterà invece <strong>%into%</strong>,
            ovunque in questa installazione, e <strong>%from%</strong> verrà tolta da “%list%”.
        irreversible: Questo non si può annullare. Dopo, nulla ricorda quale delle due un record portasse.
        writes_none: Nessun record porta oggi quella voce, quindi nulla viene riscritto; la voce viene semplicemente tolta dalla lista.
        where: Dove
        records: Record
        no_fields: Nessun campo prende ancora i valori da questa lista, quindi nulla viene riscritto.
        note: >-
            Nulla viene scritto nella cronologia dei record: è un cambiamento a una lista, non una
            modifica a ogni record, e le date su quei record restano quelle che erano.
        agree_none: 'Sì: togli quella voce dalla lista.'
        do: Fondile
    delete:
        title: Eliminare “%list%”?
        in_use: >-
            Questa lista non si può eliminare finché dei campi ne prendono i valori: %fields%.
            Punta prima quei campi altrove.
        records_keep: >-
            <strong>Nulla nei tuoi record viene eliminato.</strong> Un record tiene il codice con
            cui è stato salvato e mostrerà quel codice al posto dell’etichetta.
        do: Elimina la lista

upgrade:
    title: Che cosa ha guadagnato questo modulo
    subtitle: '%module%: le parti del modulo che la tua copia non ha.'
    back_to_fields: Torna ai campi
    nothing: 'La tua copia di %module% ha tutto ciò che il modulo dichiara. Non c’è nulla da prendere.'
    nothing_outstanding: 'La tua copia di %module% ha tutto ciò che il modulo dichiara, a parte ciò che hai scartato qui sotto.'
    intro: >-
        Un modulo può crescere tra una versione e l’altra, e installare non torna mai a toccare
        un’installazione che già esiste: dal giorno in cui l’hai installato, le tue definizioni
        fanno fede. Quindi nulla di tutto questo ti è successo. Viene offerto, e decidi tu, voce
        per voce.
    keeps_yours: >-
        Si aggiungono solo novità. Un campo che hai già non viene mai offerto di nuovo, qualunque
        cosa tu ne abbia fatto nel frattempo, rinominato, ristretto o riordinato, e nulla di ciò
        che hai già viene cambiato. Nessun campo viene tolto e nessuno cambia tipo.
    what: Che cosa
    where: Va su
    derived: riempito dal motore
    dismiss: Questo no
    review: Guarda che cosa farebbe
    review_note: Nulla viene scritto prima che tu abbia letto la pagina seguente.
    dismissed_title: Scartati
    dismissed_help: >-
        A questi hai detto di no, quindi non vengono più offerti. Togliere un campo conta come
        dirgli di no: è così che un campo eliminato apposta smette di tornare. Offrirne uno di
        nuovo lo rimette nell’elenco qui sopra.
    restore: Offrilo di nuovo
    banner_link: Guarda di che si tratta
    review_title: 'Aggiungere questi a %module%?'
    review_adds: 'Questo aggiunge alla tua copia di <strong>%module%</strong> quanto segue:'
    review_keeps: 'Che cosa questo non fa:'
    review_keeps_fields: >-
        Nulla di ciò che hai già viene toccato: non un’etichetta, non una larghezza, non una
        regola, non il loro ordine.
    review_keeps_values: >-
        Nessun valore viene scritto in alcun record. Un campo che il motore riempie arriva vuoto
        e si riempie al prossimo salvataggio di ogni record.
    review_keeps_removal: >-
        Nessun campo viene tolto e nessuno cambia tipo. Sono due domande a parte, e questa non è
        la risposta a nessuna delle due.
    review_do: Aggiungili

import:
    file: Foglio di calcolo
    file_help: 'Un export di questo modulo ha esattamente la forma attesa, con un foglio per forma: %sheets%.'
    check: Controlla
    back_to_list: Torna all’elenco
    dry_run: Nulla è stato cambiato; ecco che cosa farebbe l’importazione.
    how_title: Come viene letto un file
    how_columns: Una colonna può chiamarsi come la chiave di un campo o come la sua etichetta.
    how_missing: Un campo senza colonna tiene il valore che aveva; una colonna lasciata vuota lo cancella.
    how_id: Una riga con un <code>id</code> aggiorna quel record. Un <code>id</code> vuoto ne aggiunge uno.
    how_names: >-
        Qualsiasi altra cosa in <code>id</code>, per esempio <code>ada</code>, dà un nome a un
        record che questo file sta creando. È così che i nuovi record arrivano con le loro righe
        figlie: dai a ogni nuovo record un nome tuo in <code>id</code>, e metti lo stesso nome
        nel <code>parent_id</code> della riga figlia. Anche un record con l’<code>id</code>
        vuoto viene creato, ma nulla nel file può puntare a lui.
    how_collections: >-
        Un foglio figlio parla per l’intera collezione: una riga che non elenca viene tolta dal
        record. Lascia fuori il foglio per non toccarle.
    how_atomic: Un problema in un punto qualsiasi rifiuta l’intero file. Non esiste uno stato importato a metà.

