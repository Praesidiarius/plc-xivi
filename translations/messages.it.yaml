    reactivate_aria: 'Riattiva %email%'

group:
    tooltip_edit: Modifica il gruppo
    tooltip_delete: Elimina il gruppo
    title: Gruppi di autorizzazioni
    one: Gruppo
    new: Nuovo gruppo
    members: Membri
    permissions: Autorizzazioni
