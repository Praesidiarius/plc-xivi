        Aggiungere moduli a questa installazione, che non è un’autorizzazione su un modulo in
        particolare: sfogliare non riguarda nessuno di loro, e installare riguarda uno che ancora
        non hai.
    intro: >-
        Un gruppo è un insieme di autorizzazioni date a una funzione anziché a una persona, e
        così sopravvive a chi la lascia. Tutto si somma: un utente ha ciò che l’insieme dei suoi
        gruppi gli dà, e nulla qui può togliere un’autorizzazione.
    empty_title: Ancora nessun gruppo
    empty_body: >-
        Chi amministra può già fare tutto. Tutti gli altri non possono fare nulla finché un
        gruppo non dice altrimenti.
    make_first: Crea il primo
    name_placeholder: Vendite, Supporto, Sola lettura…
    name_help: Come si chiama la funzione. Potrai rinominarla.
    what_it_may_do: Che cosa può fare questo gruppo
    matrix_help: >-
        Una riga per ogni modulo che questo cliente ha, una colonna per azione.
        <strong>I propri record</strong> significa solo quelli che quella persona ha creato;
        vale per le azioni che nominano un record già esistente, quindi aggiungere e importare
        sono tutto o niente.
    no_modules: Nessun modulo è installato, quindi non c’è ancora nulla da concedere.
    instance: L’istanza stessa
    instance_help: >-
        Le parti di questa installazione che non sono i record di un modulo. Ce n’è una per tipo,
        quindi l’unica domanda è chi può vederla e chi può cambiarla.
    who_is_in_it: Chi ne fa parte
    members_help: >-
        Chi amministra non è in elenco: può già fare tutto, e metterlo in un gruppo farebbe
        pensare che glielo si possa togliere.
    no_members_available: Qui amministrano tutti, quindi non c’è ancora nessuno da aggiungere.
    delete_title: 'Elimina %group%'
    delete_heading: Eliminare “%group%”?
    delete_warning: I membri perdono ciò che dava loro, a meno che un altro gruppo non dia loro lo stesso.
    delete_note: >-
        Nessuno viene eliminato e nulla di loro viene toccato; solo il gruppo e ciò che
        concedeva. Non si può annullare, ma si può rifare.
    delete_confirm: Elimina il gruppo
    edit_aria: 'Modifica %group%'
    delete_aria: 'Elimina %group%'

profile:
    region: Regione
    region_none: Impostazione predefinita dell’applicazione
    region_help: Con le convenzioni di quale paese scrive questa installazione. Chi sta altrove può scegliere le proprie sul suo account.
    timezone: Fuso orario
    timezone_none: 'Dalla regione (%zone%)'
    timezone_help: >-
        Su quale orologio si mostrano qui le ore. La regione risponde da sola dove un paese ha un
        solo fuso; dove ne ha diversi, scegli, perché nulla sullo schermo dice che le ore sono
        sbagliate. Gli istanti vengono sempre salvati allo stesso modo.
    payment_terms: Termini di pagamento (giorni)
    payment_terms_help: >-
        Quanto tempo ha un cliente per pagare, contato dalla data della fattura. A un contatto si
        possono dare termini suoi. Lascia vuoto e le fatture non portano scadenza, quindi nulla è
        mai in ritardo.
    vat_mode: Prezzi
    vat_mode_none: 'Non impostato (prezzi IVA esclusa)'
    vat_mode_excluded: Prezzi IVA esclusa
    vat_mode_included: Prezzi IVA inclusa
    vat_mode_help: >-
        Se i prezzi che scrivi contengono già l’IVA. Un negozio indica 19.95 IVA inclusa perché è
        la cifra sullo scaffale; una consulenza quota al netto e aggiunge l’IVA in fattura. Ogni
        nuovo ordine e ogni nuova fattura ne prende una copia e si può regolare a parte, quindi
        cambiare qui non altera mai un documento già inviato.
    title: Profilo aziendale
    intro: >-
        Come si chiama questa installazione, e la valuta in cui lavora. Vale per tutti qui, non
        solo per te.
    company_name: Nome dell’azienda
    company_name_help: Come vi chiamate. Una volta impostato, sostituisce il nome nella barra qui sopra.
    logo: Logo
