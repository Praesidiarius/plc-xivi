# Our own constraint messages (XIV-8).
#
# Symfony translates a constraint's message through the `validators` domain,
# keyed by the English text itself — which is why these keys are sentences. The
# framework ships its own catalogue for every built-in constraint; this file is
# only the ones this application added.
'Another record already uses this value.': Another record already uses this value.

# The voucher module's own (XIV-103). It names the character set, shows the
# example the whole feature exists for, and answers the question a refusal about
# capitals immediately provokes.
'A code is made of A-Z, 0-9 and single hyphens, like GIVE-10. Lower case is fine — it is stored in capitals either way.': A code is made of A-Z, 0-9 and single hyphens, like GIVE-10. Lower case is fine — it is stored in capitals either way.

# What a phone field says when it cannot read what was typed (XIV-114). Four
# sentences rather than one, because what somebody has to do next is different in
# every case: a typo, a setting nobody filled in, digits that are the right shape
# for nowhere, and a number that is fine except for the part E.164 cannot keep.
# `{{ country }}` is the country the value was read against, named rather than
# left implicit — being refused for `079 123 45 67` is bewildering until you are
# told it was read as a German number.
'{{ value }} is not a phone number.': '{{ value }} is not a phone number.'
'{{ value }} has no country code, and this installation has not said which country it is in — so there is no way to tell which number it is. Type it in full, like +41 79 123 45 67, or set the country on the instance profile.': '{{ value }} has no country code, and this installation has not said which country it is in — so there is no way to tell which number it is. Type it in full, like +41 79 123 45 67, or set the country on the instance profile.'
'{{ value }} is not a phone number that can be dialled in {{ country }}. Check the digits, or type it in full with its country code.': '{{ value }} is not a phone number that can be dialled in {{ country }}. Check the digits, or type it in full with its country code.'
'{{ value }} carries an extension. A number is stored without one, so the extension would be silently dropped — put it in a field of its own.': '{{ value }} carries an extension. A number is stored without one, so the extension would be silently dropped — put it in a field of its own.'
