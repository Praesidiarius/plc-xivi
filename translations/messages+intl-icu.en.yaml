# Strings that count something (XIV-8).
#
# ICU rather than a ternary in the template, because "one" and "other" are not
# the only two answers every language has — and building the sentence in Twig
# would bake English grammar into a file that is supposed to be language-neutral.
# German needs no more forms than English does; the next language might.
#
# `#` renders the number. Parameters arrive as %count% and are matched by name.

dashboard:
    field_count: '{count, plural, one {# field} other {# fields}}'

account:
    password_minimum: '{count, plural, one {At least # character.} other {At least # characters.}}'

store:
    # "no choices to make" is a real state — a module that ships no presets —
    # and reads better than "0 presets", which sounds like something is missing.
    preset_count: '{count, plural, =0 {No choices to make} one {# way to install it} other {# ways to install it}}'
    no_presets: '{count, plural, one {This module has no choices to make: it installs its one field.} other {This module has no choices to make: it installs all # of its fields.}}'
    will_create: '{count, plural, one {Creates # field:} other {Creates # fields:}}'

follow_up:
    # What the dashboard widget cut off (XIV-81). The cap is the widget's, and
    # saying how much was left out is what stops it from being a summary somebody
    # trusts to be complete.
    more_due: '{count, plural, one {And # more.} other {And # more.}}'
    # The archive counter on the record page (XIV-82). A number and a word,
    # because "3" on its own beside a panel of open work reads as three more of
    # them.
    show_done: '{count, plural, one {# done} other {# done}}'
    hide_done: '{count, plural, one {Hide the one that is done} other {Hide the # that are done}}'

module:
    history_all: '{count, plural, one {One entry} other {All # entries}}'
    history_changes: '{count, plural, one {# change} other {# changes}}'
    record_count: '{count, plural, one {# record.} other {# records.}}'
    record_count_matching: '{count, plural, one {# record matching.} other {# records matching.}}'
    # No plural: neither number decides the grammar, and both are formatted
    # because a customer with 1,207 orders should read like one.
    linked_shown: 'Showing {shown, number} of {total, number}.'

mail:
    # Sizes rather than counts, and here for the same reason the totals are
    # (XIV-47): a refusal quoting "9.6 MB" at a reader whose country writes
    # "9,6 MB" is the small wrongness that ticket was about. No plural — a
    # megabyte does not decide the grammar.
    attachment_size: '({size, number, ::.0} MB)'
    attachment_too_large: '"{file}" is {size, number, ::.0} MB, and this installation sends at most {limit, number, ::.0} MB.'

field:
    remove_holding: '{count, plural, one {<strong>#</strong> record currently holds a value for it.} other {<strong>#</strong> records currently hold a value for it.}}'

document:
    # A placeholder nothing will fill in (XIV-25). Counted rather than worded
    # around the number, because this is read once with one token in it and once
    # with five, and "will be printed just as it is" is the sentence that makes
    # the point — the reader has to picture the bracket in the finished letter.
    #
    # It says what will *happen* and never that anything is wrong: the template
    # is accepted, square brackets are legal prose, and an unknown token may well
    # be one somebody meant. The tokens lead, because they are what somebody has
    # to go and find in Word.
    unknown_placeholders: '{count, plural, one {{placeholders} will be printed just as it is — there is no placeholder by that name.} other {{placeholders} will be printed just as they are — there are no placeholders by those names.}}'

import:
    written: '{added, plural, one {# added} other {# added}}, {updated, plural, one {# updated} other {# updated}}'
    rows_written: '{count, plural, one {# written} other {# written}}'
    rows_removed: '{count, plural, one {# <strong>removed</strong>, because the file does not list it} other {# <strong>removed</strong>, because the file does not list them}}'
    rows_removed_none: '{count, plural, other {# removed}}'
    problems: '{count, plural, one {Nothing was changed. # problem to fix first:} other {Nothing was changed. # problems to fix first:}}'

group:
    delete_members: '{count, plural, =0 {Nobody is in this group,} one {# person is in this group,} other {# people are in this group,}}'
    delete_grants: '{count, plural, one {and it grants # permission.} other {and it grants # permissions.}}'

control_plane:
    # The headline of the tenant list (XIV-58), and the one sentence an operator
    # is meant to read before anything else on the page. It is drawn only when the
    # number is not zero, so there is no `=0` case: "0 customers are not being
    # served" is a banner the eye learns to skip, and skipping it is the failure
    # this line exists to prevent.
    #
    # "not being served" rather than "broken" or "need attention", because it is
    # the fact rather than a judgement — a suspended customer is deliberately not
    # being served and belongs in the same count as a provisioning run that died.
    not_serving: '{count, plural, one {# customer is not being served.} other {# customers are not being served.}}'
    # The two figures on the usage cell (XIV-59). `=0` is spelled out for both,
    # because zero is a real and interesting answer here — a customer with no
    # records is the one somebody is looking for — and "0 records" reads like a
    # missing value where "no records" reads like a finding. It is only ever
    # drawn for a collection that succeeded; a failed one says so instead, and
    # never as a zero.
    usage_users: '{count, plural, =0 {no users} one {# user} other {# users}}'
    usage_records: '{count, plural, =0 {no records} one {# record} other {# records}}'
    # The modules cell's headline, when the registry and the customer's own
    # database do not describe the same set (XIV-95). Drawn only when the number
    # is not zero — for the same reason `not_serving` above is: a line that is
    # always there saying "0 differ" is furniture, and furniture is what the eye
    # learns to skip.
    #
    # "differ from the registry" and nothing stronger. §6.1 makes the two lists
    # able to disagree by design, and one of the ways they get there — a module
    # installed from the console — is an operator doing their job. The list under
    # this line names which modules and in which direction; this line only says
    # there is something to read.
    modules_differ: '{count, plural, one {# module differs from the registry} other {# modules differ from the registry}}'
    # The tail of a long list, folded into a disclosure so that a customer with a
    # dozen modules does not make the row unreadable. Phrased as a count of what
    # is hidden rather than as "show all", because the number is the part worth
    # knowing before deciding to open it.
    modules_more: '{count, plural, one {# more module} other {# more modules}}'
    # The pricing screen's headline (XIV-101), and the one line an operator is
    # meant to read before anything else on it.
    #
    # No `=0` case, for the reason `not_serving` above has none: it is drawn only
    # when the number is not zero, and a banner permanently reading "0 modules are
    # published with no price" is furniture the eye learns to skip — which is the
    # exact failure this line exists to prevent, since the consequence it reports
    # is otherwise invisible. The customer sees an absence in their store; nothing
    # on their screen says why.
    #
    # "with no price" rather than "free" or "misconfigured": the module is not
    # free, and nothing is broken. Nobody has decided yet, which is a state a
    # deployment may sit in on purpose.
    modules_unpriced: '{count, plural, one {# published module has no price, so nobody is offered it.} other {# published modules have no price, so nobody is offered them.}}'

# Taking what a module grew (XIV-70). Every one of these counts something the
# customer cannot see for themselves — how many records are in scope, how many
# tables appear — which is exactly the part of the confirmation that decides
# whether somebody does this now or on a quiet afternoon.
upgrade:
    a_collection: '{count, plural, one {a collection, # field} other {a collection, # fields}}'
    banner: '{count, plural, one {Your copy of {module} is missing # thing this module now declares.} other {Your copy of {module} is missing # things this module now declares.}}'
    review_records: '{count, plural, one {<strong>The # record</strong> in {module} gains these fields, empty. Nothing is written into it — the fields simply exist from now on.} other {<strong>All # records</strong> in {module} gain these fields, empty. Nothing is written into any of them — the fields simply exist from now on.}}'
    review_rows: '{count, plural, one {# row inside those records gains the new fields, empty as well.} other {# rows inside those records gain the new fields, empty as well.}}'
    review_tables: '{count, plural, one {<strong>One table is created</strong> in your database for the new collection. It starts empty.} other {<strong># tables are created</strong> in your database, one per new collection. They start empty.}}'
    review_derived: '{count, plural, one {# of these is filled in by the engine rather than typed, so it arrives empty on records that already exist and is filled the next time each one is saved:} other {# of these are filled in by the engine rather than typed, so they arrive empty on records that already exist and are filled the next time each one is saved:}}'
    review_relaxed: '{count, plural, one {# of these is required in the module and arrives optional here, because records that already exist could not satisfy it. Make it required in the field editor once they are filled in:} other {# of these are required in the module and arrive optional here, because records that already exist could not satisfy them. Make them required in the field editor once they are filled in:}}'
    review_agree: '{count, plural, one {Yes, add it to {module}.} other {Yes, add all # of them to {module}.}}'

flash:
    upgrade_taken: '{count, plural, one {Added # thing to {module}. It is in the field list now, and is yours to rename and reorder like any other.} other {Added # things to {module}. They are in the field list now, and are yours to rename and reorder like any other.}}'
    password_too_short: '{count, plural, one {Use at least # character.} other {Use at least # characters.}}'
    imported: 'Imported. {module}: {added, plural, other {# added}}, {updated, plural, other {# updated}}.'
