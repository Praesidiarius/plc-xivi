# Counted strings in German (XIV-8), informal ("du") like the rest.
#
# German needs the same two plural forms English does, so these read like their
# counterparts — the point of ICU is that the *next* language does not have to.

dashboard:
    field_count: '{count, plural, one {# Feld} other {# Felder}}'

account:
    password_minimum: '{count, plural, one {Mindestens # Zeichen.} other {Mindestens # Zeichen.}}'

store:
    preset_count: '{count, plural, =0 {Nichts zu entscheiden} one {# Art, es zu installieren} other {# Arten, es zu installieren}}'
    no_presets: '{count, plural, one {Bei diesem Modul gibt es nichts zu entscheiden: es installiert sein eines Feld.} other {Bei diesem Modul gibt es nichts zu entscheiden: es installiert alle # Felder.}}'
    will_create: '{count, plural, one {Legt # Feld an:} other {Legt # Felder an:}}'

follow_up:
    more_due: '{count, plural, one {Und # weitere.} other {Und # weitere.}}'
    # Der Zähler für das Archiv am Datensatz (XIV-82). Zahl und Wort, weil eine
    # „3“ allein neben offenen Wiedervorlagen wie drei weitere davon aussieht.
    show_done: '{count, plural, one {# erledigt} other {# erledigt}}'
    hide_done: '{count, plural, one {Die erledigte ausblenden} other {Die # erledigten ausblenden}}'

module:
    history_all: '{count, plural, one {Ein Eintrag} other {Alle # Einträge}}'
    history_changes: '{count, plural, one {# Änderung} other {# Änderungen}}'
    record_count: '{count, plural, one {# Datensatz.} other {# Datensätze.}}'
    record_count_matching: '{count, plural, one {# passender Datensatz.} other {# passende Datensätze.}}'
    card_shown: '{shown, number} von {total, number} werden angezeigt.'

mail:
    attachment_size: '({size, number, ::.0} MB)'
    attachment_too_large: '„{file}“ ist {size, number, ::.0} MB groß, und diese Installation sendet höchstens {limit, number, ::.0} MB.'

field:
    remove_holding: '{count, plural, one {<strong>#</strong> Datensatz hat zurzeit einen Wert dafür.} other {<strong>#</strong> Datensätze haben zurzeit einen Wert dafür.}}'
    options:
        held_count: '{count, plural, one {# Datensatz} other {# Datensätze}}'

document:
    unknown_placeholders: '{count, plural, one {{placeholders} wird genau so gedruckt, wie es dasteht — einen Platzhalter mit diesem Namen gibt es nicht.} other {{placeholders} werden genau so gedruckt, wie sie dastehen — Platzhalter mit diesen Namen gibt es nicht.}}'

import:
    written: '{added, plural, one {# hinzugefügt} other {# hinzugefügt}}, {updated, plural, one {# geändert} other {# geändert}}'
    rows_written: '{count, plural, one {# geschrieben} other {# geschrieben}}'
    rows_removed: '{count, plural, one {# <strong>entfernt</strong>, weil die Datei ihn nicht aufführt} other {# <strong>entfernt</strong>, weil die Datei sie nicht aufführt}}'
    rows_removed_none: '{count, plural, other {# entfernt}}'
    problems: '{count, plural, one {Es wurde nichts geändert. # Problem ist zuerst zu beheben:} other {Es wurde nichts geändert. # Probleme sind zuerst zu beheben:}}'

group:
    delete_members: '{count, plural, =0 {Niemand ist in dieser Gruppe,} one {# Person ist in dieser Gruppe,} other {# Personen sind in dieser Gruppe,}}'
    delete_grants: '{count, plural, one {und sie vergibt # Berechtigung.} other {und sie vergibt # Berechtigungen.}}'

control_plane:
    not_serving: '{count, plural, one {# Kunde wird nicht bedient.} other {# Kunden werden nicht bedient.}}'
    usage_users: '{count, plural, =0 {keine Benutzer} one {# Benutzer} other {# Benutzer}}'
    usage_records: '{count, plural, =0 {keine Datensätze} one {# Datensatz} other {# Datensätze}}'
    modules_differ: '{count, plural, one {# Modul weicht von der Registrierung ab} other {# Module weichen von der Registrierung ab}}'
    modules_more: '{count, plural, one {# weiteres Modul} other {# weitere Module}}'
    modules_unpriced: '{count, plural, one {# veröffentlichtes Modul hat keinen Preis und wird deshalb niemandem angeboten.} other {# veröffentlichte Module haben keinen Preis und werden deshalb niemandem angeboten.}}'
    stalled: '{count, plural, one {# bestätigte Anmeldung wartet auf jemanden hier.} other {# bestätigte Anmeldungen warten auf jemanden hier.}}'
    stalled_attempts: '{count, plural, one {# Versuch} other {# Versuche}}'

# Übernehmen, was ein Modul dazubekommen hat (XIV-70). Jeder dieser Sätze zählt
# etwas, das der Kunde selbst nicht sehen kann — wie viele Datensätze betroffen
# sind, wie viele Tabellen entstehen — und genau das entscheidet, ob jemand das
# jetzt macht oder an einem ruhigen Nachmittag.
upgrade:
    a_collection: '{count, plural, one {eine Sammlung, # Feld} other {eine Sammlung, # Felder}}'
    banner: '{count, plural, one {Deiner Kopie von {module} fehlt # Teil, den dieses Modul inzwischen deklariert.} other {Deiner Kopie von {module} fehlen # Teile, die dieses Modul inzwischen deklariert.}}'
    review_records: '{count, plural, one {<strong>Der # Datensatz</strong> in {module} bekommt diese Felder — leer. Es wird nichts hineingeschrieben, die Felder sind ab jetzt einfach da.} other {<strong>Alle # Datensätze</strong> in {module} bekommen diese Felder — leer. Es wird in keinen davon etwas hineingeschrieben, die Felder sind ab jetzt einfach da.}}'
    review_rows: '{count, plural, one {# Zeile innerhalb dieser Datensätze bekommt die neuen Felder, ebenfalls leer.} other {# Zeilen innerhalb dieser Datensätze bekommen die neuen Felder, ebenfalls leer.}}'
    review_tables: '{count, plural, one {<strong>Eine Tabelle wird angelegt</strong> in deiner Datenbank, für die neue Sammlung. Sie beginnt leer.} other {<strong># Tabellen werden angelegt</strong> in deiner Datenbank, eine je neuer Sammlung. Sie beginnen leer.}}'
    review_derived: '{count, plural, one {# davon wird von der Anwendung ausgefüllt statt eingetippt: es kommt bei vorhandenen Datensätzen leer an und wird beim nächsten Speichern gefüllt:} other {# davon werden von der Anwendung ausgefüllt statt eingetippt: sie kommen bei vorhandenen Datensätzen leer an und werden beim nächsten Speichern gefüllt:}}'
    review_relaxed: '{count, plural, one {# davon ist im Modul ein Pflichtfeld und kommt hier optional an, weil die vorhandenen Datensätze das nicht erfüllen könnten. Mach es im Feldeditor zur Pflicht, sobald sie ausgefüllt sind:} other {# davon sind im Modul Pflichtfelder und kommen hier optional an, weil die vorhandenen Datensätze das nicht erfüllen könnten. Mach sie im Feldeditor zur Pflicht, sobald sie ausgefüllt sind:}}'
    review_agree: '{count, plural, one {Ja, das zu {module} hinzufügen.} other {Ja, alle # zu {module} hinzufügen.}}'

flash:
    list_merged: '{count, plural, =0 {Zusammengeführt. Kein Datensatz trug ihn.} one {Zusammengeführt, # Datensatz wurde umgeschrieben.} other {Zusammengeführt, # Datensätze wurden umgeschrieben.}}'
    upgrade_taken: '{count, plural, one {# Teil zu {module} hinzugefügt. Es steht jetzt in der Feldliste und lässt sich umbenennen und umsortieren wie jedes andere.} other {# Teile zu {module} hinzugefügt. Sie stehen jetzt in der Feldliste und lassen sich umbenennen und umsortieren wie alle anderen.}}'
    password_too_short: '{count, plural, one {Verwende mindestens # Zeichen.} other {Verwende mindestens # Zeichen.}}'
    imported: 'Importiert. {module}: {added, plural, other {# hinzugefügt}}, {updated, plural, other {# geändert}}.'

value_list:
    merge:
        writes: '{count, plural, one {<strong>#</strong> Datensatz wird umgeschrieben.} other {<strong>#</strong> Datensätze werden umgeschrieben.}}'
        children: '{count, plural, one {# Eintrag darunter rückt unter den Eintrag, der bleibt.} other {# Einträge darunter rücken unter den Eintrag, der bleibt.}}'
        agree: '{count, plural, one {Ja: diesen # Datensatz umschreiben und den Eintrag aus der Liste nehmen.} other {Ja: diese # Datensätze umschreiben und den Eintrag aus der Liste nehmen.}}'
    delete:
        what: '{count, plural, =0 {Die Liste hat keine Einträge — verloren geht nur die Liste selbst.} one {Die Liste und ihr # Eintrag verschwinden, samt Farben und Reihenfolge.} other {Die Liste und alle # Einträge verschwinden, samt Farben und Reihenfolge.}}'
        orphans: '{count, plural, one {# Datensatz trägt noch einen ihrer Einträge und zeigt künftig den gespeicherten Code statt einer Beschriftung.} other {# Datensätze tragen noch Einträge daraus und zeigen künftig die gespeicherten Codes statt Beschriftungen.}}'
