        expiry: 'Der Link funktioniert nach %hours% Stunden nicht mehr; eine erneute Anfrage schickt einen neuen.'
        unexpected: >-
            Wenn du damit nicht gerechnet hast, ist nichts zu tun und es wurde nichts
            angelegt. Du kannst die Nachricht ignorieren.
    confirmation:
        title: Bestätigung der Anmeldung
        confirmed: 'Danke — %company% ist bestätigt.'
        already: '%company% war bereits bestätigt. Mehr ist nicht nötig.'
        expired: Dieser Link ist abgelaufen.
