    intro: >-
        Eine Gruppe ist ein Satz Berechtigungen für eine Aufgabe statt für eine Person und
        überdauert deshalb, wenn jemand sie verlässt. Alles ist additiv: eine Person hat,
        was all ihre Gruppen ihr geben, und nichts hier kann eine Berechtigung wegnehmen.
    empty_title: Noch keine Gruppen
    empty_body: >-
        Die Administration darf ohnehin alles. Alle anderen dürfen nichts, bis eine Gruppe
        etwas anderes sagt.
