# Wiedervorlagen (XIV-80). Die Wörter gehören der Anwendung und keinem Modul:
# alle Module teilen sich ein Tabellenpaar, es gibt also niemanden sonst, dem sie
# gehören könnten.
follow_up:
    priority:
        info: Zur Information
        warning: Braucht Aufmerksamkeit
        important: Wichtig
    # Die drei Blickweiten des Dashboard-Widgets (XIV-81). Es sind Obergrenzen und
    # sie schachteln sich, also sagen die Wörter, wie weit nach vorne geschaut
    # wird — «fällig heute» und nicht «heute», denn alles Überfällige steht
    # ebenfalls darin.
    lens:
        today: Heute fällig
        week: Diese Woche fällig
        all: Alle
    lens_group: Wie weit nach vorne
    lens_empty:
        today: Heute ist nichts fällig.
        week: Diese Woche ist nichts fällig.
        all: Auf deiner Liste steht nichts.
    # Die Anzeige am Datensatz (XIV-82). „Fällig“ und „Erledigt“ statt nackter
    # Zeitangaben: eine Zeitangabe allein sagt in einer Liste davon nicht mehr,
    # welcher der beiden Momente sie ist.
    due: 'Fällig %when%'
    assigned_to: 'für %who%'
    opened_by: 'Eröffnet von %who%, %when%'
    done_at: 'Erledigt %when%'
    mark_done: Erledigt
    reopen: Wieder öffnen
    add: Wiedervorlage anlegen
    # Steht nur da, wo jemand auch eine anlegen kann — also als Einladung und
    # nicht als Bericht über eine leere Tabelle.
    none: Auf diesem Datensatz steht nichts offen.
    open_it: Anlegen
    due_label: Wann
    priority_label: Wie laut
    assignee_label: Für wen
    # Nicht „nicht zugewiesen“, das klingt nach etwas Unfertigem. Eine
    # Wiedervorlage ohne Namen ist eine Notiz des Büros, und das ist eine
    # vollwertige Antwort.
    nobody: Niemanden im Besonderen
    what_label: Was zu tun ist
    what_placeholder: 'Zurückrufen — es ging um die zweite Rechnung'
    note_placeholder: Notiz hinzufügen
    add_note: Hinzufügen
    edited: (bearbeitet)

# Die Einladungs-E-Mail selbst (XIV-1). Hier statt in einer E-Mail-Vorlage aus
# XIV-38: die sind pro Modul, an Kundschaft gerichtet und vom Mandanten
# bearbeitbar, und das trifft hier auf nichts davon zu. Sie gehört zu keinem
# Modul, sie geht an Kolleginnen und Kollegen, und wer den Link herausredigieren
# könnte, sperrt jemanden aus einem Konto aus, das anders nicht erreichbar ist.
#
# In der Sprache der Person verfasst, die auf den Knopf gedrückt hat: wer
# eingeladen wird, hat noch kein Konto geöffnet und damit keine hinterlegte
# Sprache.
invitation:
    subject: 'Du wurdest zu %instance% eingeladen'
    greeting: 'Hallo %name%,'
    body: >-
        Jemand bei %instance% hat ein Konto für dich eingerichtet. Folge dem Link unten,
        um hereinzukommen — dort wirst du gebeten, ein Passwort zu wählen.
    button: Einladung annehmen
    expiry: 'Der Link funktioniert nach %hours% Stunden nicht mehr.'
    once: Er funktioniert ausserdem nur einmal, wähle dein Passwort also am besten gleich.
    unexpected: Wenn du damit nicht gerechnet hast, ist nichts zu tun und du kannst die Nachricht ignorieren.

# Eine dieser Vorlagen aus einem Datensatz heraus senden (XIV-39). „Empfänger“
# statt „An“, weil dieses Feld das eine auf dem Bildschirm ist, das geprüft und
# nicht ausgefüllt werden soll.
mail:
