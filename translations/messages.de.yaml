# German, informal ("du") — the register was chosen deliberately (XIV-8), because
# changing it later means rewriting every string rather than editing a few.
#
# Keys match messages.en.yaml exactly, in both directions; TranslationCatalogueTest
# fails the build otherwise. A missing one would fall back to English and show up
# as a single odd paragraph on somebody else's screen, which is the quietest kind
# of bug this project can ship.

