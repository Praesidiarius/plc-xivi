        # Eine eigene Berechtigung und nicht Teil von „installieren“ (XIV-102):
        # das eine ist die Hoheit darüber, woraus diese Installation besteht, das
        # andere die über das Geld der Firma. Der Hilfetext sagt ausdrücklich,
        # dass nichts installiert und nichts bezahlt wird — das ist die
        # überraschende Hälfte.
        buy: Module anfragen
        buy_help: Ein Modul anfragen, das etwas kostet. Dabei wird nichts installiert und nichts bezahlt — die Anfrage wird notiert, und jemand meldet sich.

store:
    title: Store
    intro: Module, die diese Installation haben kann. Ein installiertes Modul landet in deiner eigenen Datenbank; niemand sonst ist davon betroffen.
    empty: In diesem Build wird noch nichts angeboten.
    details: Details
    installed: Installiert
    not_installed: Nicht installiert
    already_yours: Dieses Modul hast du bereits. Es erneut zu installieren würde nichts ändern — die damals gewählten Felder gehören jetzt dir und du kannst sie bearbeiten.
    needs_first: 'Braucht zuerst %missing%.'
    requirements: Was es braucht
    requirements_help: Ohne diese Module funktioniert es nicht. Installiere sie zuerst — jedes hat eigene Entscheidungen, deshalb werden sie nicht für dich mitinstalliert.
    presets: Wie es installiert werden kann
    presets_help: Ein benannter Satz Felder als Ausgangspunkt. Weitere Felder kannst du danach in den Einstellungen des Moduls hinzufügen.
    preset_default: Vorschlag
    install: Installieren
    install_title: '%module% installieren'
    choose_preset: Wähle, womit du anfängst
    # Nicht mehr „lässt sich nicht ändern“ (XIV-70). Ändern ließ sich die Wahl nie
    # — es wird nie etwas weggenommen —, aber der kleinere Satz lässt sich
    # nachträglich zum größeren ausbauen, und ein Satz, der das Gegenteil sagt,
    # ist jetzt schlicht falsch. Das Versprechen, das bleibt, ist das über das
    # Überschreiben: Was hier installiert wird, gehört ab sofort dir.
    preset_permanent: Daran rührt später nichts mehr.
    preset_permanent_help: >-
        Beim Installieren werden diese Felder in deine Datenbank geschrieben, und danach überschreibt sie
        nichts mehr — genau das erlaubt dir, sie frei umzubenennen und umzusortieren. Felder des anderen
        Satzes lassen sich später einzeln in den Einstellungen des Moduls übernehmen; weggenommen wird
        nie etwas von dem, was du jetzt installierst.
    confirm_install: Dieses Modul installieren
    follow_ups: Wiedervorlagen auf den Datensätzen dieses Moduls
    follow_ups_help: >-
        Eine Notiz mit Datum und Namen, die am Datensatz hängt: am Freitag zurückrufen, nächste
        Woche der Rechnung nachgehen. Anders als bei den Feldern oben ist das nicht endgültig — du
        kannst es jederzeit aus- und wieder einschalten.
    collections_always: 'Was du auch wählst, es entsteht außerdem: %collections%. Das sind Listen von Zeilen, die zu einem Datensatz gehören, und sie kommen immer mit.'
    # **Was ein Modul kostet, und wie man es anfragt** (XIV-102). Für ein
    # kostenloses Modul wird nichts davon gezeichnet: kein Preis ist der
    # Normalfall in diesem Store und soll auch normal aussehen.
    #
    # Das Vokabular ist bewusst nicht das eines Shops. Kein „Kasse“, kein
    # „Bestellung“, kein „Warenkorb“, keine „Summe“ — diese Seite nimmt kein Geld
    # entgegen, und die Wörter darauf dürfen nichts anderes andeuten. „Anfragen“
    # und „jemand meldet sich“ ist, was tatsächlich passiert.
    price: Preis
    price_one_off: Ein einmaliger Preis für dieses Modul. Kein Abonnement, nichts Wiederkehrendes, nichts zu kündigen.
    ask_to_buy: Anfragen
    buy_title: '%module% anfragen'
    buy_what_happens: Was beim Anfragen passiert
    buy_records_request: Deine Anfrage wird mit dem Preis oben notiert und denjenigen gezeigt, die diese Installation betreiben.
    buy_no_charge: Es wird nichts abgebucht und es werden keine Zahlungsdaten erfasst. Auf dieser Seite gibt es kein Kartenformular, und es wird auch keines geben.
    buy_someone_replies: Jemand meldet sich dazu. Installiert ist das Modul erst, wenn diese Person es installiert.
    buy_confirm: Dieses Modul anfragen
    requested: Angefragt
    requested_on: 'Du hast das am %date% angefragt.'
    requested_next: Abgebucht wurde nichts. Jemand meldet sich, und das Modul erscheint hier, sobald es installiert ist.
