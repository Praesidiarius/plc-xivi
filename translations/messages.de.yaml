        Eine Zeile pro Modul dieses Kunden, eine Spalte pro Aktion.
        <strong>Eigene Datensätze</strong> heißt nur die, die diese Person angelegt hat —
        das gilt für Aktionen, die einen bereits vorhandenen Datensatz benennen, weshalb
        Hinzufügen und Importieren nur ganz oder gar nicht gehen.
    no_modules: Es sind keine Module installiert, also gibt es noch nichts zu vergeben.
    instance: Die Instanz selbst
