    name_placeholder: Brief, Rechnung, Datenblatt…
    name_help: Wie sie am Datensatz heißt. Wird aus dem Dateinamen übernommen, wenn du das Feld leer lässt.
    applies_to: Gilt für
    applies_to_help: Eine Vorlage für eine Art von Datensatz wird auch nur dort angeboten.
    every_record: Jeden Datensatz
    uploaded_when: Hochgeladen
    template: Vorlage
    format: Format
    format_pdf: PDF — zum Verschicken
    format_docx: Word — zum vorher Bearbeiten
    download: Herunterladen
    none_for_record: Für diesen Datensatz passt noch keine Vorlage.
    marker:
        tenant_name: Diese Firma
        tenant_logo: Das Logo dieser Firma
        user_name: Wer es erzeugt
        user_email: Deren E-Mail
    marker_draws_a_picture: Bild
    general: Allgemein
    general_help: In jeder Vorlage verfügbar, worum es auch geht.
    for_variant: 'Für %variant%'
    placeholders: Platzhalter
    placeholders_help: >-
        Schreibe diese samt Klammern ins Word-Dokument. Beim Erzeugen werden sie durch die
        Werte dieses Datensatzes ersetzt. Was du weglässt, bleibt weg.
    collection_help: >-
        Setze einen davon in eine Zelle, und die ganze Tabellenzeile wiederholt sich — einmal
        pro Zeile dieser Liste, in ihrer Reihenfolge. Summen und alles andere zum Datensatz
        gehören ausserhalb der Tabelle, wo sie einmal stehen.
    collection_kinds_help: >-
        Eine Zeile, deren Platzhalter eine Art nennen, wird nur für diese Art gezeichnet — so
        kannst du pro Art eine Tabellenzeile anlegen und ihr genau die Spalten geben, die sie
        braucht. Lässt du die Art weg — schreibst also [%example%] —, wird die Zeile für jede
        gezeichnet.

# Hier geschrieben statt hochgeladen (XIV-38).
email_template:
    templates: E-Mail-Vorlagen
    templates_intro: >-
        Was die E-Mails für %module% sagen. Hier geschrieben statt hochgeladen: eine E-Mail
        ist Text, es gibt also nichts in Word zu gestalten und nichts nochmals hochzuladen,
        nur weil ein Tippfehler drin war.
    none_yet: Noch keine E-Mail-Vorlagen. Ohne eine lässt sich nichts verschicken.
    write: Vorlage schreiben
    form_intro: Ein Name, ein Betreff und die Nachricht selbst. Betreff und Text nehmen beide Platzhalter.
    subject: Betreff
    subject_placeholder: 'Rechnung [record_id] von [tenant.name]'
    subject_help: Der Standardbetreff. Er nimmt Platzhalter wie die Nachricht und lässt sich für einen einzelnen Versand ändern.
    body: Nachricht
    body_placeholder: |-
        Guten Tag [first_name]

        vielen Dank für Ihre Bestellung.
    body_help: >-
        Markdown. Leerzeile zwischen Absätzen, *Betonung* zwischen Sternen, - für einen
        Aufzählungspunkt. Was nach HTML aussieht, wird als die Zeichen verschickt, die du
        getippt hast.
    name_placeholder: Auftragsbestätigung, Mahnung, Danke…
    name_help: Wie sie in der Liste und im Versandfenster heisst. Nach aussen sieht das niemand.
    written_when: Geschrieben
    placeholders_help: >-
        Schreibe diese samt Klammern in den Betreff oder die Nachricht. Beim Verschicken werden
        sie durch die Werte dieses Datensatzes ersetzt. Was du weglässt, bleibt weg.
    collection_help: >-
        Dieser hier ist kein Wert — daraus wird eine ganze Tabelle, eine Zeile pro Eintrag, in
        der Reihenfolge, in der sie stehen. Setze ihn auf eine eigene Zeile und nicht mitten in
        einen Satz. Im Betreff bleibt er leer: eine Tabelle ist keine Betreffzeile.
    collection_columns_help: >-
        Ohne weitere Angabe kommen alle Spalten. Nenne die, die du willst, in der Reihenfolge,
        in der du sie willst — schreibe [%example%] — was für eine E-Mail meist das Richtige
        ist, denn das angehängte Dokument listet ohnehin alles auf.
    collection_kinds_help: >-
        Einträge jeder Art landen in derselben Tabelle, in ihrer eigenen Reihenfolge, und eine
        Spalte, zu der ein Eintrag nichts hat, bleibt leer. Hänge die Art an — [lines:article] —
        für eine Tabelle nur dieser Art.
    wrapper: Rund um deine Nachricht
    wrapper_help: >-
        Was du hier schreibst, ist die Nachricht. Der Rahmen darum — das Layout und die
        Fusszeile mit deinem Firmennamen — gehört zu Xivi und ist für jede E-Mail gleich,
        damit ihn niemand über eine einzelne Vorlage kaputt machen kann.
    incomplete: Eine Vorlage braucht einen Namen, einen Betreff und eine Nachricht. Es wurde nichts gespeichert.
    too_long: 'Name und Betreff dürfen höchstens %max% Zeichen lang sein. Es wurde nichts gespeichert.'

