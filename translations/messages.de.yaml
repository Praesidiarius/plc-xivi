    rule_unique: eindeutig
    rule_unique_note: 'Eindeutig wird von der Datenbank durchgesetzt und nicht nur beim Speichern geprüft: kein zweiter Datensatz darf denselben Wert tragen, ein leeres Feld ist kein Duplikat eines anderen leeren, und ein gelöschter Datensatz steht nicht im Weg. Ein Feld, dessen Datensätze sich schon einen Wert teilen, lässt sich erst eindeutig machen, wenn diese Datensätze in Ordnung sind — welche Werte das sind, erfährst du dann.'
    rule_filterable: filterbar
    rule_listed: in der Liste
    rule_title: benennt ihn
    remove_title: „%field%“ entfernen?
    remove_body: >-
        Das Feld verschwindet aus dem Formular, der Liste, den Filtern und der
        Validierung. <strong>Die Werte bleiben gespeichert.</strong> Legst du wieder ein
        Feld namens <code>%key%</code> an, sind sie zurück.
    remove_none_hold: Zurzeit hat kein Datensatz einen Wert dafür.
    remove_note: >-
        Hier wird nichts gelöscht. Die Werte endgültig zu entfernen ist ein eigener
        Vorgang und existiert noch nicht — siehe docs/architecture/open-questions.md §7.2.
    remove_confirm: Feld entfernen
    # Abschnitte (XIV-119). Ein Formular mit fünfundzwanzig Feldern in einer
    # Spalte ist ein Formular, in dem niemand etwas findet. Diese Sätze tragen
    # die zwei Tatsachen, die man sonst durch Überraschung lernt: Ein Abschnitt
    # ist eine Überschrift und sonst nichts, und ihn zu entfernen entfernt nichts.
    sections:
        link: 'Abschnitte (%count%)'
        column: Abschnitt
        none: '— keiner —'
        title: 'Abschnitte von „%module%“'
        intro: >-
            Überschriften im Formular. Ein Abschnitt gruppiert Felder im Datensatzformular und
            auf der Datensatzseite und ändert sonst nichts — die Werte werden gespeichert,
            geprüft, gefiltert und auf Dokumente geschrieben wie zuvor.
        none_yet: Noch keine Abschnitte, alle Felder stehen also in einem Zug. Lege unten einen an und stelle auf der Felderseite Felder hinein.
        fields: Felder
        fields_none: noch keine
        fields_count: '%count% Felder'
        add_label: Abschnitt anlegen
        add_placeholder: Rechnungsdaten
        add_help: >-
            Der Name gehört dir und lässt sich jederzeit ändern. Beim Umbenennen verschiebt
            sich nichts, denn was ein Feld trägt, ist ein kurzer Code aus dem zuerst
            vergebenen Namen.
        note: >-
            Die Reihenfolge setzt du selbst, sie wird nicht aus den Feldern abgeleitet: Lass
            Zehnerschritte und tippe 15, um etwas dazwischenzuschieben. Ein Abschnitt ohne
            Felder bleibt hier stehen und wird im Formular erst gezeichnet, wenn etwas darin ist.
        remove_title: 'Abschnitt „%section%“ entfernen?'
        remove_body: >-
            Das entfernt die Überschrift und sonst nichts. Ein Abschnitt ist kein Behälter — er
            enthält nichts, und kein Datensatz hat je von einem abgehangen.
        remove_none: Es ist nichts darin, es verschiebt sich also nichts.
        remove_holding: >-
            %count% Felder sind darin. Sie behalten ihre Werte, ihre Reihenfolge, ihre Breiten
            und ihre Regeln und werden wieder oben im Formular gezeichnet. Sie woanders
            hinzustellen kostet je ein Auswahlfeld.
        remove_note: >-
            Hier wird nichts gelöscht, und hier ändert sich nichts daran, wie ein Datensatz
            gespeichert oder gefunden wird. Nur, wie Formular und Datensatzseite aussehen.
        remove_confirm: Abschnitt entfernen
    # Die Optionsseite (XIV-144). Ihre Sätze tragen die beiden Tatsachen, die man
    # sonst durch eine Überraschung lernt: Gespeichert wird der Code und nicht das
    # Wort, und eine Option, die Datensätze tragen, lässt sich nicht entfernen —
    # mit der Anzahl daneben, damit das lesbar ist, bevor es abgelehnt wird.
    options:
        link: 'Optionen (%count%)'
        title: 'Optionen von „%field%“'
        intro: Woraus in diesem Feld ausgewählt wird. Eine Ergänzung wirkt sofort.
        back: Zurück zu den Feldern
        stored: Gespeichert als
        held: Datensätze
        held_none: keine
        none: Dieses Feld hat noch keine Optionen — es bietet nichts zur Auswahl und nimmt alles an, was daran vorbeikommt. Ergänze unten welche.
        add_label: Optionen ergänzen, eine pro Zeile
        add_placeholder: |-
            Palette
            Kiste
        add_help: >-
            Eine Bezeichnung pro Zeile. Gespeichert wird in jedem Datensatz ein kurzer Code aus
            der ersten Bezeichnung — <code>palette</code> — und der ändert sich nie wieder.
            Eine Option später umzubenennen kostet deshalb nichts.
        removal_note: >-
            Eine Option, die kein Datensatz trägt, lässt sich entfernen. Eine, die Datensätze
            tragen, nicht: Sie stünden mit einem Wert da, den es in der Liste nicht mehr gibt,
            und ließen sich erst wieder speichern, wenn jemand sie in Ordnung bringt.
        module_field: >-
            Dieses Feld kam mit dem Modul, und seine Optionen gehören zu dem, was das Modul tut —
            die Zustände, zwischen denen es Datensätze bewegt, die Arten von Datensatz, die es
            kennt. Ergänzen und umbenennen kannst du sie; entfernen wird nicht angeboten.
        on_a_list: >-
            Dieses Feld bezieht seine Werte aus der gemeinsamen Liste „%list%“ — die Optionen unten
            gehören dem Feld selbst und sind gerade nicht in Gebrauch. Sie sind das, worauf es
            zurückfällt, wenn du es von der Liste nimmst.
        on_a_list_link: Diese Liste öffnen
    # Die Nummerierungsseite (XIV-27). Diese Sätze leisten mehr als die üblichen
    # Beschriftungen: Der Hilfetext muss die Syntax beibringen, und die beiden
    # Hinweise müssen das sagen, was niemand errät — dass ein Muster nichts
    # umnummeriert und dass {year} auf einen eigenen Zähler wechselt.
    # Die Feldart ändern, auf einem Mandanten, der schon Datensätze hat
    # ([XIV-146], §7.2). Diese Sätze wiegen schwerer als alle anderen in dieser
    # Datei: zugestimmt wird dem Neuschreiben jedes Werts einer Spalte, die
    # Hälfte davon lässt sich nicht rückgängig machen, und ein Teil ist das
    # Angebot, Werte wegzuwerfen. Jede Zahl darin ist gezählt und nicht
    # geschätzt, und jeder genannte Wert ist eine Zeichenfolge, nach der man
    # suchen kann.
    convert:
        link: Feldart ändern
        title: 'Welche Art Feld ist „%field%“?'
        held: >-
            <strong>%count% Datensätze halten hier einen Wert.</strong> Jeder davon wird von der
            gewählten Art neu gelesen, und die nächste Seite sagt, was das mit ihnen macht, bevor
            irgendetwas geschrieben wird.
        held_none: >-
            In diesem Feld hält noch nichts einen Wert, also gibt es nichts neu zu schreiben: eine
            Art zu wählen ändert nur, was das Feld ist.
        settings_note: >-
            Eine Umwandlung ändert die Feldart und sonst nichts. Was der neuen Art gesagt werden
            kann, eine Höchstlänge, ein Land, gegen das Nummern gelesen werden, wird danach auf der
            Seite des Feldes eingestellt.
        none: Es gibt keine andere Feldart, die dieses Feld werden könnte.
        not_offered: >-
            Eine Optionsliste und ein Verweis auf ein anderes Modul werden hier nicht angeboten.
            Beiden muss erst gesagt werden, was die Werte bedeuten, bevor sie einen lesen können,
            und das ist eine eigene Entscheidung: legen Sie ein Feld dieser Art an und schieben Sie
            die Werte hinüber.
        check_title: '„%field%“ umwandeln?'
        check_intro: 'Jeder Wert in diesem Feld wird neu gelesen, als <code>%to%</code>-Wert statt als <code>%from%</code>-Wert.'
        check_no_records: 'Kein Datensatz hält hier einen Wert, also wird nichts neu geschrieben. Nur das Feld ändert sich.'
        check_converts: '<strong>%count% Datensätze werden umgewandelt</strong>, und %changes% davon halten danach etwas anderes als jetzt.'
        check_refused: '<strong>%count% Datensätze halten etwas, das ein <code>%to%</code>-Feld nicht lesen kann.</strong>'
        check_held_by: 'auf %count% Datensätzen'
        check_refused_choice: >-
            Es ändert sich gar nichts, solange Sie nicht sagen, was mit diesen geschehen soll.
            Bringen Sie sie vorher in Ordnung, oder leeren Sie sie hier, was das Gesagte wegwirft.
        check_shared: 'Als <code>%to%</code>-Werte gelesen halten mehrere Datensätze denselben, und dieses Feld ist als eindeutig markiert.'
        check_shared_fix: >-
            Das geht so nicht: diese Datensätze würden ein Versprechen brechen, das „%field%“ gibt.
            Bringen Sie sie in Ordnung, oder nehmen Sie die Eindeutigkeit vorher vom Feld.
        check_reversible: >-
            Ein Zurückwandeln gäbe jedem Datensatz genau das, was er heute hält, also lässt sich
            das rückgängig machen.
        check_final: Das lässt sich nicht rückgängig machen.
        check_final_history: >-
            Was jeder Datensatz jetzt hält, wird vor dem Ersetzen in seine Historie geschrieben, so
            bleibt der alte Wert am Datensatz lesbar, auch wenn nichts ihn zurückholen kann.
        check_empty: 'Ja, die %count% nicht lesbaren Datensätze leeren. Mir ist klar, dass das Gesagte weggeworfen wird.'
        check_agree: 'Ja, %count% Datensätze nach %to% umwandeln.'
        check_agree_final: 'Ja, %count% Datensätze nach %to% umwandeln. Mir ist klar, dass sich das nicht rückgängig machen lässt.'
        check_do: 'Nach %to% umwandeln'
    numbering:
        title: Nummerierung
        pattern: Muster
        pattern_help: >-
            <code>{number}</code> ist der Zähler, <code>{number:4}</code> füllt ihn auf vier
            Stellen auf — damit die Sortierung nach Text die Belege richtig sortiert.
            <code>{year}</code> ist das Jahr, in dem die Nummer vergeben wird; ein Muster mit
            <code>{year}</code> beginnt jeden Januar wieder bei eins, weil es einen eigenen
            Zähler hat.
        numbers_nothing: >-
            Hier fehlt <code>{number}</code>. Das Feld würde gar nichts nummerieren und müsste
            von Hand ausgefüllt werden. So lässt es sich nicht speichern.
        next_is: Die nächste Nummer lautet
        from_year: 'Aus dem Zähler für %period%, der jeden Januar neu beginnt.'
        from_forever: Aus einem einzigen Zähler, der nie neu beginnt.
        counter_switch: >-
            Das ist ein anderer Zähler als beim aktuellen Muster, und dieser Zähler steht auf
            %at%. Es wird nichts umnummeriert — die nächste Nummer ist schlicht die nächste
            aus diesem Zähler und kann niedriger sein als die zuletzt vergebene.
        counter_label: Zähler setzen auf
        counter_help: 'Leer lassen, um bei %at% weiterzuzählen. Setze ihn, wenn du aus einem anderen System kommst und deine nächste Nummer eine ist, die dort schon erreicht war.'
        counter_back: >-
            Der Zähler steht auf %at%; eine kleinere Nummer würde ein zweites Mal vergeben.
            Das wird abgelehnt — eine doppelte Nummer auf einem Beleg lässt sich nachträglich
            nicht mehr korrigieren.
        nothing_renumbered: >-
            Bereits vergebene Nummern ändern sich nie. Hier wird nur entschieden, wie die
            nächste aussieht und woher sie kommt — an den Belegen, die jemand in Händen hält,
            ändert das nichts.
        # Ein Feld nummerieren, das bisher keine Nummerierung hat (XIV-91). Diese
        # Sätze wiegen schwerer als alle anderen auf der Seite: Was hier zugesagt
        # wird, schreibt einmalig Nummern in bereits vorhandene Datensätze — und
        # der einzig ehrliche Zeitpunkt dafür ist vorher. Jede Zahl darin ist
        # gezählt und nicht umschrieben.
        start_title: Dieses Feld nummerieren
        start_link: Nummerieren
        review: Zeigen, was das bewirkt
        on_blank: >-
            <strong>%count% Datensätze haben in diesem Feld nichts stehen.</strong> Sie bekommen
            jetzt Nummern, die ältesten zuerst — damit die Nummer sagt, wann der Datensatz
            entstanden ist, und nicht, wann ihn zuletzt jemand geöffnet hat.
        on_none_blank: >-
            Jeder Datensatz hat in diesem Feld bereits etwas stehen, es wird also in keinen
            geschrieben. Die Nummerierung beginnt mit dem nächsten neuen Datensatz.
        on_held: >-
            <strong>%count% Datensätze haben bereits einen Wert</strong> und behalten ihn genau
            so. Was davon aussieht wie eine Nummer, die dieses Muster erzeugen würde, wird
            zuerst gesucht — der Zähler startet oberhalb der höchsten davon.
        on_derived: >-
            Sobald dieses Feld nummeriert ist, füllt es die Engine und niemand tippt mehr hinein
            — genau das verhindert, dass jemand eine Nummer einträgt, die der Zähler gleich
            vergeben will.
        start_confirm_title: '„%field%“ nummerieren?'
        start_pattern: 'Das Muster wird <code>%pattern%</code> sein.'
        start_writes: >-
            <strong>%count% Datensätze ohne Nummer bekommen eine</strong>, in der Reihenfolge
            ihrer Entstehung.
        start_range: 'Sie laufen von <code>%first%</code> bis <code>%last%</code>.'
        start_writes_none: >-
            Es wird in keinen Datensatz geschrieben: Alle haben in diesem Feld bereits einen
            Wert, und keiner davon wird geändert.
        start_irreversible: >-
            Das lässt sich nicht rückgängig machen. Eine Nummer, die auf einem Datensatz stand,
            hat jemand womöglich am Telefon vorgelesen — hier wird keine wieder eingezogen.
        start_found: >-
            %count% Datensätze tragen bereits eine Nummer, die dieses Muster erzeugt haben
            könnte. Sie bleiben, wie sie sind, und der Zähler startet bei %from%, damit keine
            davon ein zweites Mal vergeben wird.
        start_unrecognised: >-
            %count% weitere enthalten etwas, das dieses Muster nie erzeugen könnte — eine
            Referenz in anderer Form. Damit kann nichts kollidieren, sie bleiben unberührt.
        start_next: 'Der nächste neu angelegte Datensatz heißt <code>%next%</code>.'
        start_unique: >-
            <strong>Dieses Feld wird dabei auch eindeutig.</strong> Eine Nummer, die kein zweiter
            Datensatz tragen darf, <em>ist</em> genau das, was eine Belegnummer ausmacht — deshalb
            ist das Versprechen nicht mehr nur Rechnerei, sondern ein Index in der Datenbank:
            niemand kann eine zweite Nummer schreiben, die schon einmal vergeben wurde. Teilen sich
            hier bereits zwei Datensätze einen Wert, lässt sich das nicht versprechen und es ändert
            sich nichts — welche Werte das sind, erfährst du dann.
        start_note: >-
            Der Zähler lässt sich danach auf der Nummerierungsseite dieses Feldes vorstellen,
            falls das alte System weiter gekommen ist als die Nummern, die hier schon stehen.
        start_agree: 'Ja, in %count% vorhandene Datensätze Nummern schreiben. Mir ist klar, dass das nicht rückgängig zu machen ist.'
        start_agree_none: 'Ja, dieses Feld ab jetzt nummerieren.'
        start_do: Nummerierung starten
        # Und wieder abschalten (XIV-91). Es wird nichts gelöscht — und genau das
        # würde in beide Richtungen falsch angenommen, deshalb sagen alle drei
        # Sätze, was *nicht* passiert.
        stop_link: Nummerierung dieses Feldes beenden
        stop_title: 'Nummerierung von „%field%“ beenden?'
        stop_keeps: >-
            <strong>Die Nummern bleiben.</strong> Alle %count% Datensätze behalten genau das, was
            sie tragen — sie stehen auf Belegen, die Kunden in Händen halten, und hier greift
            nichts danach.
        stop_typeable: >-
            Das Feld wird wieder ein gewöhnliches Textfeld: Es erscheint im Formular, jeder darf
            hineinschreiben, und niemand prüft, was dort steht. Neue Datensätze bleiben darin
            leer, sofern es niemand ausfüllt.
        stop_counter: >-
            Der Zähler bleibt stehen, wo er ist. Wird die Nummerierung später wieder
            eingeschaltet, läuft sie dort weiter, statt erneut über bereits vergebene Nummern zu
            laufen.

# Was ein Modul seit der Installation dazubekommen hat (XIV-70,
# docs/architecture/open-questions.md §7.2.1). Die Sätze hier tragen ungewöhnlich viel: angeboten
# wird eine Änderung an der Form jedes Datensatzes eines Moduls, und das
# Wichtigste ist nicht, was passiert, sondern was *nicht* — eigene Änderungen
# werden nicht überschrieben, nichts wird entfernt, kein Feldtyp ändert sich.
value_list:
    title: Listen
    intro: >-
        Eine Liste, die du einmal pflegst und aus mehreren Feldern verwendest. „Region“ am
        Kontakt und „Region“ am Auftrag können dieselbe Liste sein und laufen so nicht
        auseinander.
    none: Noch keine Listen. Lege unten eine an und zeige dann im Feldeditor ein Auswahlfeld darauf.
    name: Name
    stored: Gespeichert als
    entries: Einträge
    used_by: Verwendet von
    used_by_nothing: noch nichts
    back: Zurück zu den Listen
    new_label: Name der neuen Liste
    new_placeholder: Regionen
    new_help: >-
        Gespeichert wird in jedem Datensatz ein kurzer Code, der aus dem ersten Namen entsteht —
        <code>regionen</code> — und der ändert sich nie wieder. Die Liste später umzubenennen
        kostet also nichts.
    no_entries: Diese Liste ist leer. Füge unten Einträge hinzu, einen pro Zeile.
    colour: Farbe
    icon: Symbol
    under: Unter
    no_colour: keine
    no_icon: keins
    no_parent: '—'
    add_label: Einträge hinzufügen, einen pro Zeile
    removal_note: >-
        Ein Eintrag, den kein Datensatz trägt, lässt sich entfernen. Einer, den Datensätze
        tragen, nicht — irgendwo in der Installation, nicht nur im gerade geöffneten Modul —
        denn diese Datensätze stünden mit einem Wert da, den es in der Liste nicht mehr gibt.
    merge:
        title: Zwei Einträge zusammenführen
        intro: >-
            Zwei Einträge, die dasselbe meinen — „Zurich“ und „Zürich“. Jeder Datensatz mit dem
            einen wird auf den anderen umgeschrieben, und der erste Eintrag verschwindet.
        from: Diesen Eintrag
        into: in diesen
        review: Zusammenführung prüfen
        confirm_title: '„%from%“ in „%into%“ zusammenführen?'
        what: >-
            Jeder Datensatz mit <strong>%from%</strong> trägt danach <strong>%into%</strong> —
            überall in dieser Installation — und <strong>%from%</strong> wird aus „%list%“
            entfernt.
        irreversible: Das lässt sich nicht rückgängig machen. Danach hält nichts mehr fest, welchen der beiden ein Datensatz vorher trug.
        writes_none: Kein Datensatz trägt diesen Eintrag heute, es wird also nichts umgeschrieben — der Eintrag wird nur aus der Liste genommen.
        where: Wo
        records: Datensätze
        no_fields: Noch kein Feld bezieht seine Werte aus dieser Liste, es wird also nichts umgeschrieben.
        note: >-
            In die Datensatz-Historie wird nichts geschrieben: Dies ist eine Änderung an einer
            Liste und keine Bearbeitung jedes einzelnen Datensatzes — deren Datumsangaben
            bleiben, wie sie waren.
        agree_none: 'Ja: diesen Eintrag aus der Liste nehmen.'
        do: Zusammenführen
    delete:
        title: „%list%“ löschen?
        in_use: >-
            Diese Liste lässt sich nicht löschen, solange Felder ihre Werte daraus beziehen:
            %fields%. Zeige diese Felder zuerst woanders hin.
        records_keep: >-
            <strong>In deinen Datensätzen wird nichts gelöscht.</strong> Ein Datensatz behält den
            Code, mit dem er gespeichert wurde, und zeigt dann diesen Code statt der
            Beschriftung.
        do: Liste löschen

upgrade:
    title: Was dieses Modul dazubekommen hat
    subtitle: '%module% — Teile des Moduls, die deine Kopie nicht hat.'
    back_to_fields: Zurück zu den Feldern
    nothing: 'Deine Kopie von %module% hat alles, was das Modul deklariert. Es gibt nichts zu übernehmen.'
    nothing_outstanding: 'Deine Kopie von %module% hat alles, was das Modul deklariert — bis auf das, was du unten abgelehnt hast.'
    intro: >-
        Ein Modul kann zwischen zwei Releases wachsen, und eine Installation wird
        dabei nie nachträglich verändert: ab dem Tag der Installation gelten deine
        Definitionen. Nichts davon ist dir also passiert. Es wird angeboten, und du
        entscheidest Stück für Stück.
    keeps_yours: >-
        Es wird ausschließlich Neues hinzugefügt. Ein Feld, das du bereits hast, wird
        nie erneut angeboten — egal, wie du es inzwischen umbenannt, verkleinert oder
        umsortiert hast — und nichts Vorhandenes wird geändert. Kein Feld wird
        entfernt, und kein Feldtyp ändert sich.
    what: Was
    where: Gehört zu
    derived: von der Anwendung ausgefüllt
    dismiss: Das nicht
    review: Ansehen, was das täte
    review_note: Es wird nichts geschrieben, bevor du die nächste Seite gelesen hast.
    dismissed_title: Abgelehnt
    dismissed_help: >-
        Dazu hast du Nein gesagt, deshalb wird es nicht wieder angeboten. Ein Feld zu
        entfernen zählt als Nein — so hört ein absichtlich gelöschtes Feld auf,
        wiederzukommen. Wieder anbieten stellt es zurück in die Liste oben.
    restore: Wieder anbieten
    banner_link: Ansehen
    review_title: 'Das zu %module% hinzufügen?'
    review_adds: 'Das fügt deiner Kopie von <strong>%module%</strong> Folgendes hinzu:'
    review_keeps: 'Was dabei nicht passiert:'
    review_keeps_fields: >-
        Nichts Vorhandenes wird angefasst — keine Beschriftung, keine Breite, keine
        Regel, auch nicht die Reihenfolge.
    review_keeps_values: >-
        In keinen Datensatz wird ein Wert geschrieben. Ein Feld, das die Anwendung
        füllt, kommt leer an und wird beim nächsten Speichern des Datensatzes gefüllt.
    review_keeps_removal: >-
        Kein Feld wird entfernt, und kein Feldtyp ändert sich. Beides sind eigene
        Fragen, und das hier ist die Antwort auf keine davon.
    review_do: Hinzufügen

import:
    file: Tabelle
    file_help: 'Ein Export dieses Moduls hat genau die erwartete Form, mit einem Blatt pro Form: %sheets%.'
    check: Prüfen
    back_to_list: Zurück zur Liste
    dry_run: Es wurde nichts geändert — so würde der Import aussehen.
    how_title: Wie eine Datei gelesen wird
    how_columns: Eine Spalte darf nach dem Schlüssel eines Feldes oder nach seiner Bezeichnung benannt sein.
    how_missing: Ein Feld ohne Spalte behält seinen Wert; eine leere Spalte löscht ihn.
    how_id: Eine Zeile mit <code>id</code> aktualisiert diesen Datensatz. Eine leere <code>id</code> legt einen neuen an.
    how_names: >-
        Alles andere in <code>id</code> — etwa <code>ada</code> — benennt einen Datensatz,
        den diese Datei anlegt. So kommen neue Datensätze mit Unterzeilen herein: gib jedem
        neuen Datensatz in <code>id</code> einen eigenen Namen und trage denselben Namen in
        <code>parent_id</code> der Unterzeile ein. Ein Datensatz mit leerer <code>id</code>
        wird ebenfalls angelegt, aber nichts in der Datei kann auf ihn zeigen.
    how_collections: >-
        Ein Unterblatt spricht für die ganze Sammlung: eine Zeile, die es nicht aufführt,
        wird vom Datensatz entfernt. Lass das Blatt weg, um sie unangetastet zu lassen.
    how_atomic: Ein einziges Problem lehnt die ganze Datei ab. Einen halb importierten Zustand gibt es nicht.

user:
    tooltip_edit: Benutzer bearbeiten
    tooltip_reset: Passwort zurücksetzen
    tooltip_deactivate: Benutzer deaktivieren
    tooltip_reactivate: Benutzer reaktivieren
    tooltip_invite: Einladung erneut senden
    add: Benutzer hinzufügen
    edit_title: '%email% bearbeiten'
    role: Rolle
    administrator: Administration
    member: Mitglied
    last_signed_in: Zuletzt angemeldet
    never: nie
    you: du
    deactivated: deaktiviert
    password_not_set: Passwort noch nicht gesetzt
    invitation_pending: Einladung ausstehend
    email_help: Das ist die Anmeldung. Sie muss hier eindeutig sein, nicht überall.
    name_help: Wird auf eigenen Datensätzen und im Verlauf angezeigt. Standard ist die E-Mail-Adresse.
    first_sign_in: Wie die Person das erste Mal hereinkommt
    method_invite: Einladung per E-Mail senden
    method_invite_help: >-
        Ein Link zu dieser Installation, 24 Stunden lang und einmal gültig. Es wird kein
        Passwort erzeugt, also gibt es auch keines, das jemand anderes kennt; die Person
        wählt ihr eigenes, wenn sie ankommt.
    method_password: Passwort erzeugen und selbst weitergeben
    administrator_help: >-
        Die Administration darf alles und verwaltet Benutzer, Gruppen und die Felder eines
        Moduls. Die Berechtigungen unten haben darauf keinen Einfluss.
    generated_password_note: Beim Speichern wird ein Passwort erzeugt und dir einmalig angezeigt, damit du es weitergeben kannst.
    groups: Gruppen
    groups_help: >-
        Von hier kommen Berechtigungen normalerweise: eine Berechtigung für eine Aufgabe
        überdauert die Person, die sie verlässt. <a href="%link%">Gruppen verwalten</a>.
    no_groups: 'Es gibt noch keine Gruppen. <a href="%link%">Lege eine an</a>.'
    extra_permissions: Zusätzliche Berechtigungen für diese Person
    extra_permissions_help: >-
        Nur für das, was die Gruppen noch nicht abdecken. Diese kommen zu dem
        <strong>hinzu</strong>, was die Gruppen geben — nichts hier kann eine Berechtigung
        wegnehmen, weshalb sich nicht auswählen lässt, was die Gruppen bereits abdecken.
    admin_permissions_note: >-
        Diese Person gehört zur Administration und darf ohnehin alles. Was hier gesetzt
        wird, greift erst, wenn ihr das genommen würde.
    from_groups: 'aus Gruppen: %scope%'
    permissions_note: >-
        Die Administration darf alles. Alle anderen starten ohne Rechte und bekommen das,
        was ihre <a href="%link%">Berechtigungsgruppen</a> ihnen geben, pro Modul und pro
        Aktion.
    edit_aria: '%email% bearbeiten'
    reset_aria: 'Passwort von %email% zurücksetzen'
    invite_aria: '%email% eine neue Einladung senden'
    deactivate_aria: '%email% deaktivieren'
    reactivate_aria: '%email% reaktivieren'

group:
    tooltip_edit: Gruppe bearbeiten
    tooltip_delete: Gruppe löschen
    title: Berechtigungsgruppen
    one: Gruppe
    new: Neue Gruppe
    members: Mitglieder
    permissions: Berechtigungen
    store: Der Store
    store_help: >-
        Module zu dieser Installation hinzufügen. Das ist keine Berechtigung auf ein einzelnes Modul —
        Ansehen betrifft gar keines, und Installieren betrifft eines, das du noch nicht hast.
    intro: >-
        Eine Gruppe ist ein Satz Berechtigungen für eine Aufgabe statt für eine Person und
        überdauert deshalb, wenn jemand sie verlässt. Alles ist additiv: eine Person hat,
        was all ihre Gruppen ihr geben, und nichts hier kann eine Berechtigung wegnehmen.
    empty_title: Noch keine Gruppen
    empty_body: >-
        Die Administration darf ohnehin alles. Alle anderen dürfen nichts, bis eine Gruppe
        etwas anderes sagt.
    make_first: Die erste anlegen
    name_placeholder: Vertrieb, Support, Nur lesen…
    name_help: Wie die Aufgabe heißt. Du kannst sie später umbenennen.
    what_it_may_do: Was diese Gruppe darf
    matrix_help: >-
        Eine Zeile pro Modul dieses Kunden, eine Spalte pro Aktion.
        <strong>Eigene Datensätze</strong> heißt nur die, die diese Person angelegt hat —
        das gilt für Aktionen, die einen bereits vorhandenen Datensatz benennen, weshalb
        Hinzufügen und Importieren nur ganz oder gar nicht gehen.
    no_modules: Es sind keine Module installiert, also gibt es noch nichts zu vergeben.
    instance: Die Instanz selbst
    instance_help: >-
        Die Teile dieser Installation, die keine Datensätze eines Moduls sind. Es gibt
        jeden nur einmal, also bleibt nur die Frage, wer ihn sehen und wer ihn ändern darf.
    who_is_in_it: Wer darin ist
    members_help: >-
        Die Administration steht nicht in der Liste: sie darf ohnehin alles, und sie in
        eine Gruppe zu stecken würde nahelegen, dass man ihr das wieder nehmen könnte.
    no_members_available: Hier gehören alle zur Administration, es gibt also noch niemanden hinzuzufügen.
    delete_title: '%group% löschen'
    delete_heading: „%group%“ löschen?
    delete_warning: Sie verlieren, was die Gruppe ihnen gab — es sei denn, eine andere Gruppe gibt ihnen dasselbe.
    delete_note: >-
        Es wird niemand gelöscht und nichts angetastet, was jemandem gehört — nur die
        Gruppe und das, was sie vergeben hat. Das lässt sich nicht rückgängig machen, aber
        neu anlegen.
    delete_confirm: Gruppe löschen
    edit_aria: '%group% bearbeiten'
    delete_aria: '%group% löschen'

profile:
    region: Region
    region_none: Standard der Anwendung
    region_help: Nach welchem Land diese Installation schreibt. Wer woanders ist, wählt es auf seinem Konto selbst.
    timezone: Zeitzone
    timezone_none: 'Aus der Region (%zone%)'
    timezone_help: >-
        Auf welcher Uhr Zeiten hier angezeigt werden. Die Region beantwortet das von selbst, wenn
        ein Land nur eine Zone hat; hat es mehrere, wähl sie aus — dass die Zeiten falsch sind,
        sieht man dem Bildschirm nicht an. Gespeichert wird immer gleich.
    payment_terms: Zahlungsfrist (Tage)
    payment_terms_help: >-
        Wie lange eine Kundin Zeit zum Zahlen hat, ab Rechnungsdatum. Einem Kontakt kannst du
        eine eigene Frist geben. Lässt du es leer, tragen Rechnungen kein Fälligkeitsdatum und
        nichts wird je überfällig.
    vat_mode: Preise
    vat_mode_none: 'Nicht gesetzt (Preise exkl. MWST)'
    vat_mode_excluded: Preise exkl. MWST
    vat_mode_included: Preise inkl. MWST
    vat_mode_help: >-
        Ob die Preise, die du eingibst, die MWST schon enthalten. Ein Laden schreibt 19.95 inkl.
        MWST, weil das die Zahl am Regal ist; eine Beratung rechnet netto und schlägt die MWST
        auf der Rechnung drauf. Jeder neue Auftrag und jede neue Rechnung übernimmt das als Kopie
        und lässt sich einzeln ändern — was du hier änderst, ändert nie ein bereits verschicktes
        Dokument.
    title: Firmenprofil
    intro: >-
        Wie diese Installation heißt und in welcher Währung sie rechnet. Das gilt für
        alle hier, nicht nur für dich.
    company_name: Firmenname
    company_name_help: Wie ihr euch nennt. Ersetzt den Namen in der Leiste oben, sobald er gesetzt ist.
    logo: Logo
    logo_help: >-
        PNG oder JPEG, bis %size% KB. Es erscheint in der Leiste oben und auf der Anmeldeseite dieser
        Adresse — wer diese Seite erreicht, sieht es also. Genau dafür ist ein Logo da.
    logo_remove: Logo entfernen
    currency: Währung
    currency_help: Worin Preise angegeben werden. Nichts erzwingt eine, und Module, die sie brauchen, greifen darauf zurück.
    currency_none: Noch nicht gewählt
    read_only: Du darfst das sehen, aber nicht ändern.
    mail: Ausgehende E-Mails
    mail_intro: >-
        Von wem die E-Mails dieser Installation kommen. Bleibt der Server leer, gehen sie
        über uns hinaus, mit eurer Adresse zum Antworten. Ist er ausgefüllt, gehen sie über
        euren eigenen Anbieter — dann sind sie wirklich von euch.
    mail_sender_address: Absenderadresse
    mail_sender_address_help: >-
        Die Adresse, die eure Kundschaft sieht und an die Antworten gehen. Ohne sie lässt
        sich kein Server verwenden.
    mail_smtp_host: Euer SMTP-Server
    mail_smtp_host_help: Leer lassen, um über diese Installation zu senden.
    mail_smtp_port: Port
    mail_smtp_port_help: Leer für den Standard. 465 für TLS.
    mail_smtp_user: SMTP-Benutzer
    mail_smtp_password: SMTP-Passwort
    mail_smtp_password_help: Wird verschlüsselt gespeichert und nie wieder angezeigt.
    mail_smtp_password_set: Ein Passwort ist gespeichert. Leer lassen, um es zu behalten.
    payment: Bezahlt werden
    payment_intro: >-
        Was der QR-Zahlteil einer Rechnung sagt: das Konto, auf das sie bezahlt wird, und eure
        Adresse als Zahlungsempfänger. Lässt du die IBAN leer, gehen Rechnungen ohne Zahlteil raus.
    address_street: Straße
    address_building_number: 'Nr.'
    address_postal_code: PLZ
    address_city: Ort
    payment_iban: IBAN
    payment_iban_help: >-
        Das Schweizer oder Liechtensteiner Konto, auf das eure Rechnungen bezahlt werden. Eine
        QR-IBAN geht auch, zusammen mit der QR-Referenz unten.
    reference_type: Zahlungsreferenz
    reference_type_help: >-
        Wie eine Zahlung auf dem Kontoauszug zu ihrer Rechnung findet. Die Creditor Reference
        funktioniert mit jeder IBAN und ist der Standard. Die QR-Referenz braucht die QR-IBAN,
        die deine Bank dafür ausgibt. Ohne Referenz reist die Rechnungsnummer nur als Freitext mit.
    reference_type_qrr: QR-Referenz (braucht eine QR-IBAN)
    reference_type_scor: Creditor Reference (jede IBAN)
    reference_type_non: Keine Referenz

