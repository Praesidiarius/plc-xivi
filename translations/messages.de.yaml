    name_placeholder: Vertrieb, Support, Nur lesen…
    name_help: Wie die Aufgabe heißt. Du kannst sie später umbenennen.
    what_it_may_do: Was diese Gruppe darf
    matrix_help: >-
        Eine Zeile pro Modul dieses Kunden, eine Spalte pro Aktion.
        <strong>Eigene Datensätze</strong> heißt nur die, die diese Person angelegt hat —
        das gilt für Aktionen, die einen bereits vorhandenen Datensatz benennen, weshalb
        Hinzufügen und Importieren nur ganz oder gar nicht gehen.
    no_modules: Es sind keine Module installiert, also gibt es noch nichts zu vergeben.
    instance: Die Instanz selbst
    instance_help: >-
        Die Teile dieser Installation, die keine Datensätze eines Moduls sind. Es gibt
        jeden nur einmal, also bleibt nur die Frage, wer ihn sehen und wer ihn ändern darf.
    who_is_in_it: Wer darin ist
    members_help: >-
        Die Administration steht nicht in der Liste: sie darf ohnehin alles, und sie in
        eine Gruppe zu stecken würde nahelegen, dass man ihr das wieder nehmen könnte.
    no_members_available: Hier gehören alle zur Administration, es gibt also noch niemanden hinzuzufügen.
    delete_title: '%group% löschen'
    delete_heading: „%group%“ löschen?
    delete_warning: Sie verlieren, was die Gruppe ihnen gab — es sei denn, eine andere Gruppe gibt ihnen dasselbe.
    delete_note: >-
        Es wird niemand gelöscht und nichts angetastet, was jemandem gehört — nur die
        Gruppe und das, was sie vergeben hat. Das lässt sich nicht rückgängig machen, aber
        neu anlegen.
