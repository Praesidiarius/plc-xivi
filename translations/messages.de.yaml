# Selbstregistrierung (XIV-64): die Bestätigungs-E-Mail und die Seite, auf der
# ihr Link landet. Beides gehört jemandem, der noch keine Kundin und kein Kunde
# ist — deshalb steht es hier und nirgends Mandantenförmigem: Es gibt keinen
# Mandanten, der eine Einstellung, eine E-Mail-Vorlage oder eine Sprache halten
# könnte.
#
# Verfasst in der Sprache, in der die Person das Formular gelesen hat; die
# aufrufende Website schickt sie mit. Ein anderes Signal gibt es nicht: Diese
# Person hat auf dieser Installation kein Konto und keine Sitzung.
signup:
    mail:
        subject: Bestätige deine Xivi-Installation
        greeting: 'Hallo %company%,'
        body: >-
            Jemand hat mit dieser Adresse eine Xivi-Installation namens %slug% angefragt.
            Folge dem Link unten, um zu bestätigen, dass du das warst — vorher wird nichts
            angelegt.
