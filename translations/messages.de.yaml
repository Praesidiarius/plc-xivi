# Die Einladungs-E-Mail selbst (XIV-1). Hier statt in einer E-Mail-Vorlage aus
# XIV-38: die sind pro Modul, an Kundschaft gerichtet und vom Mandanten
# bearbeitbar, und das trifft hier auf nichts davon zu. Sie gehört zu keinem
# Modul, sie geht an Kolleginnen und Kollegen, und wer den Link herausredigieren
# könnte, sperrt jemanden aus einem Konto aus, das anders nicht erreichbar ist.
#
# In der Sprache der Person verfasst, die auf den Knopf gedrückt hat: wer
# eingeladen wird, hat noch kein Konto geöffnet und damit keine hinterlegte
# Sprache.
invitation:
    subject: 'Du wurdest zu %instance% eingeladen'
    greeting: 'Hallo %name%,'
    body: >-
        Jemand bei %instance% hat ein Konto für dich eingerichtet. Folge dem Link unten,
        um hereinzukommen — dort wirst du gebeten, ein Passwort zu wählen.
    button: Einladung annehmen
