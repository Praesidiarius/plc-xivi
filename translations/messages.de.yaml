    how_id: Eine Zeile mit <code>id</code> aktualisiert diesen Datensatz. Eine leere <code>id</code> legt einen neuen an.
    how_names: >-
        Alles andere in <code>id</code> — etwa <code>ada</code> — benennt einen Datensatz,
        den diese Datei anlegt. So kommen neue Datensätze mit Unterzeilen herein: gib jedem
        neuen Datensatz in <code>id</code> einen eigenen Namen und trage denselben Namen in
        <code>parent_id</code> der Unterzeile ein. Ein Datensatz mit leerer <code>id</code>
        wird ebenfalls angelegt, aber nichts in der Datei kann auf ihn zeigen.
    how_collections: >-
        Ein Unterblatt spricht für die ganze Sammlung: eine Zeile, die es nicht aufführt,
        wird vom Datensatz entfernt. Lass das Blatt weg, um sie unangetastet zu lassen.
    how_atomic: Ein einziges Problem lehnt die ganze Datei ab. Einen halb importierten Zustand gibt es nicht.

