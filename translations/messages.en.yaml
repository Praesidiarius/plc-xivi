# The application's own strings, in the source language (XIV-8).
#
# English is the source and the fallback: a key with no German translation shows
# the English sentence rather than the key itself, which is the difference
# between a page with one odd word on it and a page reading "account.title".
# TranslationCatalogueTest makes sure that never has to happen.
#
# Keys are named for where the string lives and what it does, not for the words
# themselves — rewriting a sentence should not mean renaming its key.
#
# Counted strings live in messages+intl-icu.en.yaml instead, because "one" and
# "other" are not the only two answers every language has.
#
# The engine's own vocabulary — filter operators, permission actions — is in
# packages/core/translations/xivi.*.yaml, so core can name its own concepts
# without reaching into this file.

