    how_title: How a file is read
    how_columns: A column may be named by a field's key or by its label.
    how_missing: A field with no column keeps the value it had; a column left empty clears it.
    how_id: A row with an <code>id</code> updates that record. An empty <code>id</code> adds one.
    how_names: >-
        Anything else in <code>id</code> — <code>ada</code>, say — names a record this
        file is creating. That is how new records arrive with child rows: give each new
        record a name of your own in <code>id</code>, and put the same name in the
        child's <code>parent_id</code>. A record whose <code>id</code> is empty is
        created too, but nothing in the file can point at it.
    how_collections: >-
        A child sheet speaks for the whole collection: a row it does not list is removed
        from the record. Leave the sheet out to keep them untouched.
    how_atomic: One problem anywhere refuses the whole file. There is no half-imported state.

