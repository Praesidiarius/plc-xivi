    actions: Actions
    add: Add
    area: Area
    back: Back
    cancel: Cancel
    create: Create
    delete: Delete
    edit: Edit
    email: Email
    export: Export
    fields: Fields
    import: Import
    module: Module
    name: Name
    new: New
    none: None.
    password: Password
    remove: Remove
    rename: Rename
    save: Save
    view: View

