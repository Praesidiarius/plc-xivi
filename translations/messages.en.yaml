group:
    tooltip_edit: Edit group
    tooltip_delete: Delete group
    title: Permission groups
    one: Group
    new: New group
    members: Members
    permissions: Permissions
    intro: >-
        A group is a set of permissions given to a job rather than to a person, so it
        survives somebody leaving it. Everything is additive: a user has whatever all their
        groups give them, and nothing here can take a permission away.
    empty_title: No groups yet
    empty_body: >-
        Administrators can already do everything. Everybody else can do nothing until a
        group says otherwise.
    make_first: Make the first one
    name_placeholder: Sales, Support, Read only…
    name_help: What the job is called. You can rename it later.
    what_it_may_do: What this group may do
    matrix_help: >-
        One row per module this customer has, one column per action.
        <strong>Own records</strong> means only the ones that person created — it applies
        to the actions that name a record which already exists, so adding and importing
        are all-or-nothing.
    no_modules: No modules are installed, so there is nothing to grant yet.
    who_is_in_it: Who is in it
    members_help: >-
        Administrators are not listed: they may already do everything, and putting one in
        a group would suggest it could be taken away again.
    no_members_available: Everybody here is an administrator, so there is nobody to add yet.
    delete_title: 'Delete %group%'
    delete_heading: Delete “%group%”?
    delete_warning: They lose what it gave them, unless another group gives them the same.
    delete_note: >-
        Nobody is deleted and nothing they own is touched — only the group and what it
        granted. It cannot be undone, but it can be made again.
    delete_confirm: Delete the group
    edit_aria: 'Edit %group%'
    delete_aria: 'Delete %group%'

