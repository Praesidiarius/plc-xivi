# The invitation email itself (XIV-1). Here rather than in an XIV-38 email
# template, because those are per-module, customer-facing and tenant-editable and
# this is none of the three: it belongs to no module, it goes to a colleague, and
# a tenant who edited the link out of it would lock somebody out of an account
# they have no other way to reach. It also has to work for a tenant that has
# installed nothing at all, which is XIV-64's first user.
#
# Sent in the language of whoever pressed the button, not of the recipient: an
# invitee has no account they have ever opened and so no language on file.
invitation:
    subject: 'You have been invited to %instance%'
    greeting: 'Hello %name%,'
    body: >-
        Somebody at %instance% has set up an account for you. Follow the link below to
        get in — you will be asked to choose a password once you are there.
    button: Accept the invitation
    expiry: 'The link stops working after %hours% hours.'
    once: It also works only once, so it is worth choosing your password straight away.
    unexpected: If you were not expecting this, nothing is required of you and you can ignore it.

