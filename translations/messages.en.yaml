# The application's own strings, in the source language (XIV-8).
#
# English is the source and the fallback: a key with no German translation shows
# the English sentence rather than the key itself, which is the difference
# between a page with one odd word on it and a page reading "account.title".
# TranslationCatalogueTest makes sure that never has to happen.
#
# Keys are named for where the string lives and what it does, not for the words
# themselves — rewriting a sentence should not mean renaming its key.
#
# Counted strings live in messages+intl-icu.en.yaml instead, because "one" and
# "other" are not the only two answers every language has.
#
# The engine's own vocabulary — filter operators, permission actions — is in
# packages/core/translations/xivi.*.yaml, so core can name its own concepts
# without reaching into this file.

common:
    actions: Actions
    add: Add
    area: Area
    back: Back
    cancel: Cancel
    create: Create
    delete: Delete
    edit: Edit
    email: Email
    export: Export
    fields: Fields
    import: Import
    module: Module
    name: Name
    new: New
    none: None.
    password: Password
    remove: Remove
    rename: Rename
    save: Save
    view: View

nav:
    overview: Overview
    users: Users
    profile: Company
    store: Store
    # Short on purpose: it labels one item in the menu under your own name, and
    # the page it opens says "Your account" in its own heading (XIV-77).
    account: Account
    sign_out: Sign out

login:
    title: Sign in
    submit: Sign in
    invitation_failed: Ask an administrator to send you a new invitation — each link works once and for 24 hours.

# The platform's own pages, which no customer ever sees (XIV-57). Translated like
# everything else and not left in English: an operator is a person with a
# language, and a section that opts out of the catalogue is the one that quietly
# stops being translated everywhere else too.
control_plane:
    title: Control plane
    # Shown to an operator whose access was withdrawn while they were signed in
    # (XIV-92). They are put back on the sign-in page by
    # RevokedOperatorListener, and without this line that page would look like an
    # ordinary session timeout — which sends somebody to a password reset that
    # does not exist here instead of to the colleague who revoked them.
    revoked: This operator account has been revoked.
    # The tenant list, which replaced XIV-57's placeholder (XIV-58).
    tenants: Tenants
    status: Status
    plan: Plan
    domain: Domain
    created: Created
    provisioned: Provisioned
    modules: Modules
    # What a customer actually has installed, and where that disagrees with the
    # registry (XIV-95). The installed half is read from the customer's own
    # metadata by `tenant:usage:collect`, so it is as old as the last collection
    # and these lines have to say which of the three states it is in — exactly as
    # the usage figures beside them do.
    #
    # Nothing here is phrased as a fault. §6.1 makes a module installed by hand a
    # legitimate state and the customer's own definitions the truth once
    # installed, so the vocabulary is "differs", "not recorded", "not installed" —
    # facts an operator reads and judges, rather than an accusation they have to
    # dismiss.
    modules_never: 'Installed modules not collected yet — this is the registry.'
    modules_failed: 'Installed modules could not be read — this is the registry.'
    modules_collected: 'installed as of %time%'
    # The tenant has it and `enabled_modules` does not list it: somebody ran
    # `tenant:module:install` and nothing wrote it down. "Not recorded" rather
    # than "unknown", because the control plane is the thing that failed to
    # record it and the customer is fine.
    module_unrecorded: not recorded
    # And the other direction: the registry lists it and the customer's database
    # has not got it. Named from the customer's side, because that is whose
    # experience it is — their users see a module that is not there.
    module_not_installed: not installed
    # What a customer is actually using (XIV-59). The figures are collected by
    # `tenant:usage:collect` and read here out of the control plane, so every one
    # of these labels is about a *collection* as much as about a customer — hence
    # a word for when it happened beside every number.
    usage: Usage
    # Nobody has looked yet, which is neither zero nor a fault: a customer
    # provisioned this morning is in this state until the collector next runs.
    usage_never: Not collected yet
    # It was looked at and the database did not answer. Deliberately not phrased
    # as a fact about the customer — nothing is known about them right now, which
    # is a statement about us rather than about them.
    usage_failed: Could not be read
    usage_tried: 'tried %time%'
    usage_collected: 'collected %time%'
    last_sign_in: 'last sign-in %time%'
    # A successful collection that found nobody had ever signed in. The customer
    # who provisioned in March and never came back reads exactly like this.
    never_signed_in: nobody has signed in
    # The four registry statuses, spelled out rather than printed from the enum.
    # `provisioning` is a word an operator reads as a stage; the others are words
    # a customer's account manager would use, and both audiences read this page.
    status_provisioning: Provisioning
    status_trial: Trial
    status_active: Active
    status_suspended: Suspended
    # There is a registry and it is empty, which on a fresh installation is the
    # ordinary state rather than a fault. It says what to do next, because the
    # answer is one command and the person reading is the person who runs it.
    no_tenants: No customers yet
    no_tenants_hint: 'Provision the first one with'
    # The module pricing screen (XIV-101). What this deployment charges for each
    # module, which is a fact about *this company's business* and not about the
    # code — hence a control-plane row an operator edits, rather than a field on a
    # blueprint that every deployment would inherit.
    module_state: State
    module_price: Price
    module_in_store: In the store
    module_set_price: Set the price
    module_amount: Amount
    # The two module states, spelled out rather than printed from the enum, for
    # the same reason the tenant statuses above are.
    module_state_development: In development
    module_state_published: Published
    # **The four pricing decisions, and the first of them is the one this whole
    # section exists for.** "Not priced yet" is deliberately a sentence rather
    # than a dash or a blank: a price column with an empty cell in it reads as
    # free to anybody scanning, and free is a decision somebody made while this is
    # the absence of one.
    pricing_unpriced: Not priced yet
    pricing_free: Free
    pricing_priced: Priced
    # A finished module this deployment has decided not to sell — which is a
    # different statement from "in development", and phrased from the seller's
    # side because it is the seller's decision. The code is fine; the price list
    # does not have it on it.
    pricing_not_for_sale: Not for sale
    # The two columns to the left, combined. "Withheld" rather than "hidden",
    # because there are three separate reasons it can be no and every one of them
    # is somebody's decision rather than an accident.
    module_offered: Offered
    module_withheld: Withheld
    # A decision that outlived its code: the row names a module this deploy does
    # not ship. Worth showing rather than hiding — it is a deploy accident, and
    # this list is where somebody would notice (§6.2).
    module_not_in_build: not in this build
    module_decided: 'decided %time%'
    # There is a build and it ships no modules at all, which happens only to a
    # checkout somebody is taking apart. No hint about what to type: the answer is
    # a release rather than a command.
    no_modules: No modules in this build
    no_modules_hint: Nothing ships a module here, so there is nothing to price.
    # Nobody has told this installation what it sells in, so every figure on the
    # page is a bare number. §8.6's rule one level up: a guessed currency is wrong
    # quietly, so it is asked for rather than assumed.
    price_currency_unset: 'This installation has not said what it prices in. Set'
    # Said under the banner that names the published-and-unpriced modules, because
    # the count alone leaves somebody wondering whether it is a fault. It is not.
    modules_unpriced_hint: >-
        A module with no price is not a free module, so the store does not offer it. Say what it
        costs, or say that it is free — both are decisions, and neither is the absence of one.
    module_price_saved: 'The price of “%module%” was saved. Nothing was installed or uninstalled.'
    # The CSRF token did not check out, which for a page an operator leaves open
    # all day is overwhelmingly a stale tab rather than an attack. Phrased as the
    # former, because telling somebody they have been attacked when they have left
    # a tab open for a week is how a warning stops being read.
    module_price_stale: That page had been open a while. Nothing was changed — try again.
    # Unreachable from the form, which offers four radios. A hand-made post is a
    # thing, and "the price silently did not change" is the worst possible answer.
    module_price_unknown_pricing: That is not one of the four ways a module can be priced.
    # **Purchase requests** (XIV-102). A customer asked for a module that costs
    # money; the store installed nothing and wrote the request into their own
    # database; `tenant:purchase:collect` copied it here. So every word below is
    # about a *collection* as much as about a request — hence a time beside every
    # row and a vocabulary that never claims anything is live.
    #
    # Nothing here says "order", "sale" or "payment". No money has moved and none
    # can move through this system, and an operator screen that used the words of
    # a shop would be the first place that stopped being true.
    purchases: Requests
    purchases_outstanding: '%count% module request(s) nobody has answered yet.'
    purchases_outstanding_hint: >-
        A customer asked for a module that costs money. Nothing was installed and nothing was charged
        — somebody has to decide, get in touch, and install it.
    purchases_how: 'A request is answered by installing the module for that tenant:'
    purchase_asked: Asked
    purchase_first_asked: 'first asked %time%'
    purchase_state: State
    purchase_waiting: Waiting
    purchase_installed: Installed
    # Not "as of", because the reader has to understand that the row could be out
    # of date rather than merely be told a timestamp.
    purchase_collected: 'read %time%'
    no_purchases: Nobody has asked for anything
    no_purchases_hint: >-
        Requests appear here after `tenant:purchase:collect` runs. A module has to have a price before
        anybody can ask for one — every module is free until somebody sets one.

dashboard:
    # A widget's heading (XIV-81). The module tiles have none — a grid of labelled
    # cards under the company name describes itself — so this is the only one so
    # far.
    follow_ups: Your follow-ups
    no_access: You do not have access to any modules yet. An administrator can grant it.
    none_installed: 'No modules installed yet. Install one with'
    none_installed_store: No modules installed yet.
    from_store: Add one from the store.

    # What each widget is called where somebody is choosing between them
    # (XIV-66). A widget's name now lives beside the widget rather than only
    # above it: the module tiles draw no heading — a grid of labelled cards under
    # the company name explains itself — and still need a word in a list of
    # checkboxes. A module names its own card out of its own catalogue instead of
    # adding a key here, which is the point of the whole ticket; this section
    # holds the application's own two.
    widget:
        modules: Modules

    # The way to the picker, from the page it changes. On the dashboard itself
    # rather than only among the cards, because somebody who has hidden all of
    # them still has to be able to get back.
    customise: Customise
    loading: Loading…

    picker_title: Your dashboard
    picker_help: >-
        Which cards you see, and in what order. The number beside each one is where it sits;
        equal numbers keep the order they are shown in here.
    picker_default_help: >-
        What everybody who has not arranged their own dashboard sees. Nobody is prevented from
        seeing a card by leaving it out — what a person may look at is a matter of permissions.
    picker_position: Position
    picker_reset: Go back to the default
    picker_empty: There are no cards to arrange yet.
    picker_following_company: You are following the company's dashboard.
    picker_following_code: Every card, in the order they are listed here.
    saved: Your dashboard was saved.
    reset: Your dashboard follows the company's again.

