# Follow-ups (XIV-80). The words are the application's rather than a module's:
# every module shares one pair of tables, so there is nobody else to own them.
follow_up:
    priority:
        info: For information
        warning: Needs attention
        important: Important
    # The dashboard widget's three lenses (XIV-81). They are upper bounds and
    # nest, so the words are about how far ahead somebody is looking rather than
    # about a bucket — "due today" and not "today", because everything overdue is
    # in there too.
    lens:
        today: Due today
        week: Due this week
        all: All
    lens_group: How far ahead to look
    # One sentence per lens, because "nothing at all" and "nothing this week" are
    # different things to be told, and an empty widget that says which is a
    # widget doing its job.
    lens_empty:
        today: Nothing due today.
        week: Nothing due this week.
        all: Nothing on your list.
    # The panel on the record page (XIV-82). "Due" and "Done" rather than dates
    # on their own: a bare timestamp in a list of them stops saying which of the
    # two moments it is.
    due: 'Due %when%'
    assigned_to: 'for %who%'
    opened_by: 'Opened by %who%, %when%'
    done_at: 'Done %when%'
    mark_done: Done
    reopen: Reopen
    add: Add a follow-up
    # Said only to somebody who can open one, so it is an invitation rather than
    # a report about an empty table.
    none: Nothing outstanding on this record.
    open_it: Open it
    due_label: When
    priority_label: How loud
    assignee_label: Whose
    # Not "unassigned", which sounds like something unfinished. A follow-up
    # nobody owns is a note the office keeps, and that is a legitimate answer.
    nobody: Nobody in particular
    what_label: What needs doing
    what_placeholder: 'Call them back — they asked about the second invoice'
    note_placeholder: Add a note
    add_note: Add
    edited: (edited)

# The invitation email itself (XIV-1). Here rather than in an XIV-38 email
# template, because those are per-module, customer-facing and tenant-editable and
# this is none of the three: it belongs to no module, it goes to a colleague, and
# a tenant who edited the link out of it would lock somebody out of an account
# they have no other way to reach. It also has to work for a tenant that has
# installed nothing at all, which is XIV-64's first user.
#
# Sent in the language of whoever pressed the button, not of the recipient: an
# invitee has no account they have ever opened and so no language on file.
invitation:
    subject: 'You have been invited to %instance%'
    greeting: 'Hello %name%,'
    body: >-
        Somebody at %instance% has set up an account for you. Follow the link below to
        get in — you will be asked to choose a password once you are there.
    button: Accept the invitation
    expiry: 'The link stops working after %hours% hours.'
    once: It also works only once, so it is worth choosing your password straight away.
    unexpected: If you were not expecting this, nothing is required of you and you can ignore it.

# Sending one of those templates from a record (XIV-39). "Recipient" rather than
# "To", because the field is the one thing on this screen somebody is being asked
# to check rather than to fill in.
mail:
    send_failed: The message could not be sent. Nothing went out — try again, or check the outgoing mail settings.
    no_sender: This installation has no address to send from yet. Set a sender address in the company profile.
    send_email: Send email
    send: Send
    preview: Preview
    preview_and_send: Preview and send
    template: Template
    subject: Subject
    subject_placeholder: Leave empty for the template's own subject
    subject_help: Only for this one message. Empty uses the subject the template was written with, and either way it takes the same placeholders.
    recipient: Recipient
    recipient_help: Change it and only this message goes elsewhere — the record is not altered.
    recipient_from_field: 'Taken from %field%.'
    recipient_from_link: 'Taken from the %field% of the %via% this record names.'
    from: From
    reply_to: Reply to
    none_for_record: No email template applies to this record yet.
    not_sendable: Nothing can be sent from this record.
    no_template_chosen: Pick one of the templates. Nothing was sent.
    recipient_invalid: '"%address%" is not an email address. Nothing was sent.'
    attachment: Attachment
    no_attachment: Nothing attached
    attachment_help: The document is generated from this record when the message is sent, and goes out with it.
    attachment_failed: 'Nothing was sent, because the document could not be attached. %reason%'

flash:
    saved: Saved.
    transitioned: 'Now %state%.'
    # Follow-ups (XIV-82). The success says where the thing went, because it went
    # somewhere other than the page's middle and a reader who does not look up
    # will think nothing happened.
    follow_up_opened: Opened. It sits at the top of this record until somebody marks it done.
    # Only a hand-made request reaches this: the control is a required
    # datetime-local, so a browser refuses before the server has to.
    follow_up_no_date: A follow-up needs a date to be about. Nothing was opened.
    template_uploaded: Template uploaded. It is offered on every record it applies to.
    template_deleted: 'Removed "%template%". Documents already downloaded are unaffected.'
    email_template_saved: Saved. It is offered on every record it applies to.
    email_template_deleted: 'Removed "%template%". Emails already sent are unaffected.'
    email_sent: 'Sent to %recipient%. It is on this record''s timeline.'
    profile_saved: Saved. This is how the instance describes itself from now on.
    shape_renamed: 'Renamed to "%shape%".'
    deleted: Deleted.
    passwords_differ: Those two passwords are not the same.
    password_changed: Your password has been changed.
    field_added: 'Added "%field%".'
    field_saved: 'Saved "%field%".'
    field_removed: 'Removed "%field%". Its values are still stored.'
    # Numbering (XIV-27). The second sentence is the one worth flashing: the
    # first thought of anybody who has just changed a numbering pattern is what
    # it did to the numbers already out there, and the answer is nothing.
    numbering_saved: 'Saved the numbering for "%field%". Numbers already given out are unchanged.'
    module_installed: 'Installed "%module%". Nobody can see it until somebody is granted permission on it.'
    group_created: 'Created "%group%". Now say what it may do.'
    group_saved: 'Saved "%group%".'
    group_deleted: 'Deleted "%group%". Nobody was removed, only what the group gave them.'
    user_saved: 'Saved %email%.'
    user_created: 'Created %email%. Their password is %password% — copy it now, it cannot be shown again.'
    user_invited: 'Invited %email%. The link works once, for the next %hours% hours; any earlier one has stopped working.'
    user_created_not_invited: >-
        Created %email%, but the invitation could not be sent (%reason%). The account is
        waiting for one — send it again from the list once mail is working.
    invitation_failed: 'The invitation to %email% could not be sent (%reason%).'
    password_reset: 'New password for %email%: %password% — copy it now, it cannot be shown again.'
    user_reactivated: '%email% can now sign in.'
    user_deactivated: '%email% can no longer sign in.'
    upload_broken: 'That file did not arrive intact (%reason%).'
    no_file: Choose a spreadsheet to import.
