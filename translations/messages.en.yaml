module:
    view_record: View record
    overdue: Overdue
    overdue_title: Sent, and past its due date.
    edit_record: Edit record
    delete_record: Delete record
    new_title: New %module%
    edit_title: Edit %module%
    what_kind: What kind?
    filter: Filter
    filter_value: value
    clear_filter: Clear
    no_matches: Nothing matches that.
    empty_title: No %module% yet
    empty_body: >-
        Either a fresh start or a very quiet week. Add the first one and this page
        gets considerably more interesting.
    add_first: Add the first one
    add_row: Add %collection%
    add_kind: 'Add %kind%'
    owner: Owner
    record: Record
    created: Created
    changed: Changed
    created_at: 'Created %when%'
    pages: Pages
    page_first: First page
    page_previous: Previous page
    page_next: Next page
    page_last: Last page
    history: History
    status: Status
    drifted: '%field% differs from what it was copied from.'
    outstanding: '%amount% left'
    outstanding_help: Not yet taken by anything made from this record.
    locked: 'This record is %state% and can no longer be edited.'
    history_empty: >-
        Nothing recorded. Records that existed before history did have none until
        the next time they change.
    # What a number on this record has been worth over time (XIV-121). The
    # heading names the *kind* of thing rather than the field, because the field
    # is named on the picker beside it and on the chart's own tooltip — and
    # because on a record with one numeric field there is no picker, and "Trend"
    # is then the only word that says what the picture is.
    trend: Trend
    trend_field: Which number to show
    # The flat case, which is most records: nothing has ever been changed here.
    # It says the value as well as the date, because a horizontal line and a
    # chart that failed to draw look alike, and the number is the proof.
    trend_since: '%value% since %date%, unchanged.'
    # The same sentence for a screen reader, which is handed no picture at all.
    trend_summary: '%field% over time: now %value%, between %low% and %high%.'
    trend_range: 'between %low% and %high%'
    trend_truncated: Older changes than these are not drawn.
    linked_all: See them all
    action_by: 'by %who%'
    action_by_system: System
    action:
        created: Created
        updated: Updated
        deleted: Deleted
        document_generated: Document generated
        email_sent: Email sent
        email_failed: Email not sent
        transitioned: Status changed
    row_action:
        added: added
        updated: updated
        removed: removed

field:
    picker_truncated: 'Showing the first %shown% of %total%. Narrow the list or search in the other module.'
    label: Label
    label_placeholder: VAT number
    shape_name: Name of this shape
    rows_inside: '— rows inside a %module%'
    type: Type
    rules: Rules
    order: Order
    width: Width
    width_default: Type default
    autocomplete: Search box
    back_to: Back to %module%
    rule_required: required
    rule_unique: unique
    rule_unique_note: 'Unique is enforced by the database rather than only checked while a form is open: no two records may hold the same value, an empty field is not a duplicate of another empty one, and a deleted record does not stand in the way. A field whose records already share a value cannot be made unique until those records are fixed — you will be told which values they share.'
    rule_filterable: filterable
    rule_listed: on list
    rule_title: titles it
    remove_title: Remove “%field%”?
    remove_body: >-
        The field disappears from the form, the list, the filters and validation.
        <strong>The values stay in storage.</strong> Adding a field named
        <code>%key%</code> again brings them back.
    remove_none_hold: No records currently hold a value for it.
    remove_note: >-
        Nothing here deletes data. Permanently removing the values is a separate
        operation and does not exist yet — see docs/architecture.md §7.2.
    remove_confirm: Remove the field
    # The numbering page (XIV-27). Its sentences do more work than most labels
    # here, because what a customer is deciding is a small language with quiet
    # failure modes: the help text has to teach the syntax, and the two notices
    # have to say the parts nobody would guess — that a pattern is not a
    # renumbering, and that adding {year} moves to a counter of its own.
    numbering:
        title: Numbering
        pattern: Pattern
        pattern_help: >-
            <code>{number}</code> is the counter, and <code>{number:4}</code> pads it to four
            digits so that sorting the text sorts the documents. <code>{year}</code> is the
            year the number is given out in — and a pattern containing it counts from one
            again each January, because it has a counter of its own.
        numbers_nothing: >-
            This has no <code>{number}</code> in it, so it would number nothing and the field
            would be left to be typed in by hand. It cannot be saved.
        next_is: The next number will be
        from_year: 'From the counter for %period%, which starts again each January.'
        from_forever: From one counter, which never starts again.
        counter_switch: >-
            This draws from a different counter than the pattern in use now, and that counter
            is at %at%. Nothing is renumbered — the next number is simply the next one that
            counter gives out, which may be lower than the last one you saw.
        counter_label: Start the counter at
        counter_help: 'Leave this empty to carry on from %at%. Set it if you are moving from another system and your next number has to be one it already reached.'
        counter_back: >-
            The counter is at %at%, so a lower number would be given out a second time. This
            will be refused — a duplicate number on a document is not something that can be
            corrected afterwards.
        nothing_renumbered: >-
            Numbers already given out never change. This decides what the next one looks like
            and where it comes from, and nothing at all about the documents anybody is
            already holding.
        # Taking numbering up on a field that has none (XIV-91). These sentences
        # carry more weight than any others on the page: what is being agreed to
        # writes numbers into records that already exist, once, and the only
        # honest place to say so is before it happens. Every figure in them is
        # counted rather than described — "this may affect existing data" is the
        # sentence people click past.
        start_title: Number this field
        start_link: Number it
        review: See what this would do
        on_blank: >-
            <strong>%count% records have nothing in this field.</strong> They are given numbers
            now, oldest first, so that the number says when the record was made rather than
            when somebody last happened to open it.
        on_none_blank: >-
            Every record already has something in this field, so nothing is written to any of
            them. Numbering starts with the next record created.
        on_held: >-
            <strong>%count% records already hold a value</strong> and keep exactly what they
            have. Anything among them that looks like a number this pattern would produce is
            found first, and the counter starts above the highest of them.
        on_derived: >-
            Once this field is numbered, the engine fills it and nobody types into it — which
            is what stops somebody entering a number the counter is about to give out.
        start_confirm_title: 'Start numbering “%field%”?'
        start_pattern: 'The pattern will be <code>%pattern%</code>.'
        start_writes: >-
            <strong>%count% records that have no number will be given one</strong>, in the order
            they were created.
        start_writes_none: >-
            No record is written to: every one of them already holds a value in this field, and
            none of those is changed.
        start_range: 'They run from <code>%first%</code> to <code>%last%</code>.'
        start_irreversible: >-
            This cannot be undone. A number that has been on a record is a number somebody may
            have read out over the phone, so nothing here takes one back.
        start_found: >-
            %count% records already carry a number this pattern could have produced. They are
            left as they are, and the counter starts at %from% so that none of them can be given
            out a second time.
        start_unrecognised: >-
            %count% more hold something this pattern could never produce — a reference typed in
            some other shape. Those cannot collide with anything and are left alone.
        start_next: 'The next record created after this will be <code>%next%</code>.'
        start_unique: >-
            <strong>This field also becomes unique.</strong> A number no two records may share is
            what a document number <em>is</em>, so the promise stops being arithmetic and becomes an
            index in the database: nothing can write a second record carrying a number this one has
            already given out. If two records already share a value here, that cannot be promised
            and nothing is changed — you will be told which values they share.
        start_note: >-
            The counter can be moved forward afterwards, on this field's numbering page, if your
            old system got further than the numbers already in here.
        start_agree: 'Yes, write numbers into %count% existing records. I understand this cannot be undone.'
        start_agree_none: 'Yes, number this field from now on.'
        start_do: Start numbering
        # And stopping (XIV-91). Nothing is destroyed, which is exactly the part
        # that would be assumed wrongly in both directions — so all three
        # sentences say what does *not* happen.
        stop_link: Stop numbering this field
        stop_title: 'Stop numbering “%field%”?'
        stop_keeps: >-
            <strong>The numbers stay.</strong> All %count% records keep exactly what they carry —
            they are on documents customers are holding, and nothing here reaches them.
        stop_typeable: >-
            The field becomes an ordinary text box again: it appears in the form, anybody may
            type in it, and nothing checks what they type. New records get nothing in it unless
            somebody fills it in.
        stop_counter: >-
            The counter is kept where it is, so switching numbering back on later carries on from
            there rather than starting again over numbers that are already out.

# Taking what a module grew after it was installed (XIV-70, docs/architecture.md
# §7.2.1). The sentences here do an unusual amount of work: what is being offered
# is a change to the shape of every record in a module, and the thing a customer
# most needs told is not what happens but what does *not* — their own edits are
# not about to be overwritten, nothing is removed, and no field changes type.
upgrade:
    title: What this module has gained
    subtitle: '%module% — parts of the module your copy does not have.'
    back_to_fields: Back to the fields
    nothing: 'Your copy of %module% has everything the module declares. There is nothing to take.'
    nothing_outstanding: 'Your copy of %module% has everything the module declares, apart from what you dismissed below.'
    intro: >-
        A module can grow between releases, and installing never reaches back into an
        installation that already exists — from the day you installed it, your
        definitions are the truth. So none of this has happened to you. It is offered,
        and you decide item by item.
    keeps_yours: >-
        Only new things are added. A field you have already is never offered again,
        whatever you have since renamed, narrowed or reordered it to, and nothing you
        already have is changed. No field is removed and no field changes type.
    what: What
    where: Goes on
    derived: filled in by the engine
    dismiss: Not this one
    review: See what this would do
    review_note: Nothing is written until you have read the next page.
    dismissed_title: Dismissed
    dismissed_help: >-
        You have said no to these, so they are not offered again. Removing a field
        counts as saying no to it — that is how a field you deleted on purpose stops
        coming back. Offering one again puts it back on the list above.
    restore: Offer it again
    banner_link: See what they are
    review_title: 'Add these to %module%?'
    review_adds: 'This adds the following to your copy of <strong>%module%</strong>:'
    review_keeps: 'What this does not do:'
    review_keeps_fields: >-
        Nothing you already have is touched — not a label, not a width, not a rule,
        not the order they are in.
    review_keeps_values: >-
        No value is written into any record. A field the engine fills in arrives empty
        and is filled the next time each record is saved.
    review_keeps_removal: >-
        No field is removed and no field changes type. Both are separate questions, and
        this is the answer to neither.
    review_do: Add them

import:
    file: Spreadsheet
    file_help: 'An export of this module is exactly the shape it expects, with one sheet per shape: %sheets%.'
    check: Check
    back_to_list: Back to the list
    dry_run: Nothing was changed — this is what importing would do.
    how_title: How a file is read
    how_columns: A column may be named by a field's key or by its label.
    how_missing: A field with no column keeps the value it had; a column left empty clears it.
    how_id: A row with an <code>id</code> updates that record. An empty <code>id</code> adds one.
    how_names: >-
        Anything else in <code>id</code> — <code>ada</code>, say — names a record this
        file is creating. That is how new records arrive with child rows: give each new
        record a name of your own in <code>id</code>, and put the same name in the
        child's <code>parent_id</code>. A record whose <code>id</code> is empty is
        created too, but nothing in the file can point at it.
    how_collections: >-
        A child sheet speaks for the whole collection: a row it does not list is removed
        from the record. Leave the sheet out to keep them untouched.
    how_atomic: One problem anywhere refuses the whole file. There is no half-imported state.

