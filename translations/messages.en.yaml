    name_help: Shown on records they own and in history. Defaults to the email.
    first_sign_in: How they get in the first time
    method_invite: Send them an invitation email
    method_invite_help: >-
        A link to this installation, good for 24 hours and for one use. No password is
        created, so there is never one for somebody else to hold; they choose their own
        when they arrive.
    method_password: Generate a password I pass on myself
    administrator_help: >-
        Administrators may do everything, and manage users, groups and a module's fields.
        The permissions below have no effect on one.
    generated_password_note: A password is generated when you save, and shown to you once so you can pass it on.
    groups: Groups
    groups_help: >-
        Where permissions normally come from: a grant made to a job survives the person
        leaving it. <a href="%link%">Manage groups</a>.
    no_groups: 'No groups exist yet. <a href="%link%">Make one</a>.'
    extra_permissions: Extra permissions for this person
    extra_permissions_help: >-
        Only for what the groups do not already cover. These <strong>add</strong> to what
        the groups give — nothing here can take a permission away, which is why anything
        the groups already cover cannot be chosen.
    admin_permissions_note: >-
        This person is an administrator and may already do everything. Anything set here
        would take effect only if that were taken away.
    from_groups: 'from groups: %scope%'
    permissions_note: >-
        Administrators may do everything. Everybody else starts with nothing and gets what
        their <a href="%link%">permission groups</a> give them, per module and per action.
    edit_aria: 'Edit %email%'
    reset_aria: 'Reset the password of %email%'
    invite_aria: 'Send %email% a new invitation'
    deactivate_aria: 'Deactivate %email%'
    reactivate_aria: 'Reactivate %email%'

group:
    tooltip_edit: Edit group
    tooltip_delete: Delete group
    title: Permission groups
    one: Group
    new: New group
    members: Members
    permissions: Permissions
    store: The store
    store_help: >-
        Adding modules to this installation, which is not a permission about any one module —
        browsing is about none of them, and installing is about one you have not got yet.
    intro: >-
        A group is a set of permissions given to a job rather than to a person, so it
        survives somebody leaving it. Everything is additive: a user has whatever all their
        groups give them, and nothing here can take a permission away.
    empty_title: No groups yet
    empty_body: >-
        Administrators can already do everything. Everybody else can do nothing until a
        group says otherwise.
    make_first: Make the first one
    name_placeholder: Sales, Support, Read only…
    name_help: What the job is called. You can rename it later.
    what_it_may_do: What this group may do
    matrix_help: >-
        One row per module this customer has, one column per action.
        <strong>Own records</strong> means only the ones that person created — it applies
        to the actions that name a record which already exists, so adding and importing
        are all-or-nothing.
    no_modules: No modules are installed, so there is nothing to grant yet.
    instance: The instance itself
    instance_help: >-
        The parts of this installation that are not a module's records. There is one of
        each, so the only question is whether somebody may see it and whether they may
        change it.
    who_is_in_it: Who is in it
    members_help: >-
        Administrators are not listed: they may already do everything, and putting one in
        a group would suggest it could be taken away again.
    no_members_available: Everybody here is an administrator, so there is nobody to add yet.
    delete_title: 'Delete %group%'
    delete_heading: Delete “%group%”?
    delete_warning: They lose what it gave them, unless another group gives them the same.
    delete_note: >-
        Nobody is deleted and nothing they own is touched — only the group and what it
        granted. It cannot be undone, but it can be made again.
    delete_confirm: Delete the group
    edit_aria: 'Edit %group%'
    delete_aria: 'Delete %group%'

profile:
    region: Region
    region_none: Application default
    region_help: Which country's conventions this installation writes in. Somebody elsewhere can choose their own on their account.
    timezone: Time zone
    timezone_none: 'From the region (%zone%)'
    timezone_help: >-
        Which clock times are shown on here. The region answers it by itself where a country has
        only one zone; where it has several, choose, because nothing on screen tells you the times
        are wrong. Moments are always stored the same way.
    payment_terms: Payment terms (days)
    payment_terms_help: >-
        How long a customer has to pay, counted from the invoice date. A contact can be given
        different terms of their own. Leave it empty and invoices carry no due date, so nothing
        is ever overdue.
    vat_mode: Prices
    vat_mode_none: 'Not set (prices exclude VAT)'
    vat_mode_excluded: Prices exclude VAT
    vat_mode_included: Prices include VAT
    vat_mode_help: >-
        Whether the prices you type already have VAT in them. A shop quotes 19.95 including VAT
        because that is the number on the shelf; a consultancy quotes net and adds VAT on the
        invoice. Each new order and invoice takes a copy of this and can be changed on its own,
        so changing it here never alters a document you have already sent.
    title: Company profile
    intro: >-
        What this installation is called, and the currency it works in. It applies to
        everybody here, not just to you.
    company_name: Company name
    company_name_help: What you call yourselves. It replaces the name in the bar above once set.
    logo: Logo
    logo_help: >-
        PNG or JPEG, up to %size% KB. It appears in the bar above and on the sign-in page of this
        address, so anyone who can reach that page can see it — which is what a logo is for.
    logo_remove: Remove the logo
    currency: Currency
    currency_help: What prices are in. Nothing forces one, and modules that need it will ask for this.
    currency_none: Not chosen yet
    read_only: You may see this but not change it.
    mail: Outgoing mail
    mail_intro: >-
        Where the mail this installation sends comes from. Leave the server blank and it
        goes out through us, with your address to reply to. Fill it in and it goes out
        through your own provider, genuinely from you.
    mail_sender_address: Sender address
    mail_sender_address_help: >-
        The address your customers see, and where their replies go. Needed before a server
        can be used.
    mail_smtp_host: Your SMTP server
    mail_smtp_host_help: Leave this empty to send through this installation instead.
    mail_smtp_port: Port
    mail_smtp_port_help: Blank for the default. 465 for TLS.
    mail_smtp_user: SMTP user
    mail_smtp_password: SMTP password
    mail_smtp_password_help: Stored encrypted, and never shown again.
    mail_smtp_password_set: A password is stored. Leave this empty to keep it.

document:
    documents: Documents
    templates: Templates
    templates_intro: >-
        The .docx files documents for %module% are made from. Write one in Word, put the
        placeholders below where the values should go, and upload it here.
    uploaded: Uploaded templates
    none_yet: No templates yet. Nothing can be generated until there is one.
    upload: Upload a template
    file: The .docx file
    file_help: 'Word documents only, up to %size% MB.'
    name_placeholder: Letter, Invoice, Data sheet…
    name_help: What it is called on the record. Taken from the file name if you leave it empty.
    applies_to: Applies to
    applies_to_help: A template for one kind of record is only offered on that kind.
    every_record: Every record
    uploaded_when: Uploaded
    template: Template
    format: Format
    format_pdf: PDF — for sending
    format_docx: Word — for editing first
    download: Download
    none_for_record: No template applies to this record yet.
    marker:
        tenant_name: This company
        tenant_logo: This company's logo
        user_name: Who is generating it
        user_email: Their email
    marker_draws_a_picture: picture
    general: General
    general_help: Available in every template, whatever it is about.
    for_variant: 'For %variant%'
    placeholders: Placeholders
    placeholders_help: >-
        Type these into the Word document, brackets included. They are replaced with this
        record's values when the document is generated. Anything you leave out stays out.
    collection_help: >-
        Put one of these in a cell and the whole table row repeats — once for every row of
        this list, in the order they are in. Totals and anything else about the record
        belong outside the table, where they are written once.
    collection_kinds_help: >-
        A row whose placeholders name a kind is only drawn for that kind, so you can lay out
        one table row per kind and give each the columns it needs. Drop the kind — write
        [%example%] — and the row is drawn for every one of them.

# Written here rather than uploaded (XIV-38). The counterpart to the document
# vocabulary above, and it borrows what the two genuinely share — "Applies to",
# "Every record", the placeholder headings — rather than saying them twice.
email_template:
    templates: Email templates
    templates_intro: >-
        What the emails for %module% say. Written here rather than uploaded: an email is
        text, so there is nothing to design in Word and nothing to upload again to fix a
        typo.
    none_yet: No email templates yet. Nothing can be sent until there is one.
    write: Write a template
    form_intro: A name, a subject and the message itself. Both the subject and the body take placeholders.
    subject: Subject
    subject_placeholder: 'Invoice [record_id] from [tenant.name]'
    subject_help: The default subject. It takes placeholders like the message does, and can be changed for a single send.
    body: Message
    body_placeholder: |-
        Dear [first_name],

        thank you for your order.
    body_help: >-
        Markdown. Blank line between paragraphs, *emphasis* between stars, - for a bullet.
        Anything that looks like HTML is sent as the characters you typed.
    name_placeholder: Order confirmation, Reminder, Thank you…
    name_help: What it is called in the list and in the send window. Nobody outside sees it.
    written_when: Written
    placeholders_help: >-
        Type these into the subject or the message, brackets included. They are replaced with
        this record's values when the email is sent. Anything you leave out stays out.
    collection_help: >-
        This one is not a value — it becomes a whole table, one row per entry, in the order
        they are in. Put it on a line of its own rather than inside a sentence. In the subject
        it comes out empty: a table is not a subject line.
    collection_columns_help: >-
        Every column is shown unless you say otherwise. Name the ones you want, in the order
        you want them — write [%example%] — which is usually what an email wants, since the
        attached document already lists everything.
    collection_kinds_help: >-
        Entries of every kind end up in the same table, in their own order, and a column an
        entry has nothing for is left empty. Add the kind — [lines:article] — for a table of
        just that kind.
    wrapper: Around your message
    wrapper_help: >-
        What you write here is the message. The frame around it — the layout and the footer
        with your company name — is part of Xivi and is the same for every email, so nobody
        can break it by editing one template.
    incomplete: A template needs a name, a subject and a message. Nothing was saved.
    too_long: 'The name and the subject can be at most %max% characters. Nothing was saved.'

permission:
    yes: 'Yes'
    no: 'No'
    area:
        profile: Company profile
    store:
        browse: Browse the store
        browse_help: See which modules this installation could have.
        install: Install modules
        install_help: Add a module to this installation. It cannot be removed again, and what is installed is written into your own database as it stands.
        # A grant of its own rather than part of "install", and the help text is
        # where a person choosing between them finds out why (XIV-102): one is
        # authority over what the system consists of, the other is authority over
        # the company's money, and they belong to the same person only by
        # coincidence. Says out loud that it installs nothing, because that is the
        # surprising half.
        buy: Ask to buy modules
        buy_help: Request a module that costs money. This installs nothing and pays nothing — it records the request, and somebody gets in touch.

store:
    title: Store
    intro: Modules this installation can have. Installing one adds it to your own database; nothing here affects anybody else.
    empty: There is nothing on offer in this build yet.
    details: Details
    installed: Installed
    not_installed: Not installed
    already_yours: You already have this module. Installing it again would change nothing — the fields chosen at the time are yours to edit now.
    needs_first: 'Needs %missing% first.'
    requirements: What it needs
    requirements_help: This module cannot work without these. Install them first — each one has its own choices to make, so they are not installed for you.
    presets: How it can be installed
    presets_help: A named set of fields to start from. You can add more fields afterwards in the module's own settings.
    preset_default: Suggested
    collections_always: 'Whichever you choose, this also creates: %collections%. Those are lists of rows belonging to a record, and they always come with the module.'
    install: Install
    install_title: 'Install %module%'
    choose_preset: Choose what to start with
    # Not "this cannot be changed" any more (XIV-70). It never could be *changed*
    # — nothing is taken away, ever — but the smaller set can be grown into the
    # larger one afterwards, and a screen that says otherwise is now simply
    # wrong. The promise worth keeping is the one about rewriting: what is
    # installed here is yours from this moment.
    preset_permanent: Nothing rewrites this afterwards.
    preset_permanent_help: >-
        Installing writes these fields into your database, and nothing rewrites them afterwards — that is
        what lets you rename and rearrange them freely. Fields the other set has can be taken later, one
        at a time, from the module's own settings; nothing ever takes away what you install now.
    confirm_install: Install this module
    follow_ups: Follow-ups on this module's records
    follow_ups_help: >-
        A note with a date and somebody's name on it, kept on a record: call them back on Friday,
        chase this invoice next week. Unlike the fields above, this one is not permanent — you can
        turn it off or back on at any time.
    # **What a module costs, and asking for one** (XIV-102). Nothing here is
    # rendered for a free module: absence of a price is the ordinary case on this
    # store and looks ordinary, so a deployment that has priced nothing sees
    # exactly the screens it saw before.
    #
    # The vocabulary is deliberately not a shop's. There is no "checkout", no
    # "order", no "cart" and no "total" — this page takes no money and the words
    # on it must not suggest that it does. "Ask", "request" and "get in touch" are
    # what actually happens.
    price: Price
    price_one_off: A one-off price for this module. It is not a subscription and there is nothing recurring to cancel.
    ask_to_buy: Ask to buy
    buy_title: 'Ask to buy %module%'
    buy_what_happens: What happens when you ask
    buy_records_request: Your request is written down, with the price above, and shown to whoever runs this installation.
    # The sentence that stops somebody worrying afterwards, and the reason this
    # page exists rather than a form that looks like a checkout.
    buy_no_charge: Nothing is charged and no payment details are taken here. There is no card form on this page and never will be.
    buy_someone_replies: Somebody will get in touch about it. The module is not installed until they install it.
    buy_confirm: Ask for this module
    requested: Requested
    requested_on: 'You asked for this on %date%.'
    requested_next: Nothing has been charged. Somebody will get in touch, and the module appears here once it is installed.
    refusal:
        already_installed: 'You already have %module%. Nothing was changed.'
        requirements_missing: '%module% needs %missing%. Install those first.'
        no_such_preset: 'That is not one of the ways %module% can be installed.'
        # Not phrased as a telling-off. The ordinary way to reach it is to have had
        # the page open while somebody set a price, which is nobody's mistake.
        costs_money: '%module% has a price. Ask to buy it instead — nothing is charged when you do.'
        not_purchasable: '%module% is not something this installation is selling right now. Have another look at its page.'

refusal:
    last_admin: This is the only active administrator. Make somebody else an administrator first.
    own_admin_role: You cannot take administrator away from yourself. Ask another administrator to do it.
    own_account: You cannot deactivate your own account.
    email_taken: 'Somebody here already signs in as "%email%".'
    no_email: 'A user needs an email address: it is the login.'
    wrong_password: That is not your current password.
    group_no_name: 'A group needs a name: it is what people pick it by.'
    group_name_taken: 'There is already a group called "%label%".'
    mail_server_without_address: 'An SMTP server needs a sender address: it is what your mail would claim to be from.'
    mail_not_an_address: '"%address%" is not an email address.'
    logo_too_large: 'That logo is larger than %size% KB. Export it smaller — a logo in a bar or on a letter needs very few pixels.'
    logo_not_an_image: '"%filename%" is not a PNG or a JPEG. SVG files are not accepted; export one as a PNG instead.'
    already_has_password: '%email% already has a password. Reset it instead of sending an invitation.'
    inactive_invitee: '%email% is deactivated, and an invitation link would not let them in. Reactivate them first.'
    password_already_set: This account already has a password, so changing it needs the current one.
    follow_up_not_enabled: '%module% does not take follow-ups.'
    follow_up_no_record: That record does not exist, or has been deleted.
    follow_up_not_permitted: You are not allowed to do that here.
    follow_up_assignee_blind: '%assignee% is not allowed to see this record, so it cannot be assigned to them.'
    follow_up_not_your_note: 'A note can only be changed by whoever wrote it.'
    follow_up_empty_note: 'A note needs something in it.'
    follow_up_already_done: 'This follow-up is done. Reopen it before changing anything on it.'

# Follow-ups (XIV-80). The words are the application's rather than a module's:
# every module shares one pair of tables, so there is nobody else to own them.
follow_up:
    priority:
        info: For information
        warning: Needs attention
        important: Important
    # The dashboard widget's three lenses (XIV-81). They are upper bounds and
    # nest, so the words are about how far ahead somebody is looking rather than
    # about a bucket — "due today" and not "today", because everything overdue is
    # in there too.
    lens:
        today: Due today
        week: Due this week
        all: All
    lens_group: How far ahead to look
    # One sentence per lens, because "nothing at all" and "nothing this week" are
    # different things to be told, and an empty widget that says which is a
    # widget doing its job.
    lens_empty:
        today: Nothing due today.
        week: Nothing due this week.
        all: Nothing on your list.
    # The panel on the record page (XIV-82). "Due" and "Done" rather than dates
    # on their own: a bare timestamp in a list of them stops saying which of the
    # two moments it is.
    due: 'Due %when%'
    assigned_to: 'for %who%'
    opened_by: 'Opened by %who%, %when%'
    done_at: 'Done %when%'
    mark_done: Done
    reopen: Reopen
    add: Add a follow-up
    # Said only to somebody who can open one, so it is an invitation rather than
    # a report about an empty table.
    none: Nothing outstanding on this record.
    open_it: Open it
    due_label: When
    priority_label: How loud
    assignee_label: Whose
    # Not "unassigned", which sounds like something unfinished. A follow-up
    # nobody owns is a note the office keeps, and that is a legitimate answer.
    nobody: Nobody in particular
    what_label: What needs doing
    what_placeholder: 'Call them back — they asked about the second invoice'
    note_placeholder: Add a note
    add_note: Add
    edited: (edited)

# The invitation email itself (XIV-1). Here rather than in an XIV-38 email
# template, because those are per-module, customer-facing and tenant-editable and
# this is none of the three: it belongs to no module, it goes to a colleague, and
# a tenant who edited the link out of it would lock somebody out of an account
# they have no other way to reach. It also has to work for a tenant that has
# installed nothing at all, which is XIV-64's first user.
#
# Sent in the language of whoever pressed the button, not of the recipient: an
# invitee has no account they have ever opened and so no language on file.
invitation:
    subject: 'You have been invited to %instance%'
    greeting: 'Hello %name%,'
    body: >-
        Somebody at %instance% has set up an account for you. Follow the link below to
        get in — you will be asked to choose a password once you are there.
    button: Accept the invitation
    expiry: 'The link stops working after %hours% hours.'
    once: It also works only once, so it is worth choosing your password straight away.
    unexpected: If you were not expecting this, nothing is required of you and you can ignore it.

# Sending one of those templates from a record (XIV-39). "Recipient" rather than
# "To", because the field is the one thing on this screen somebody is being asked
# to check rather than to fill in.
mail:
    send_failed: The message could not be sent. Nothing went out — try again, or check the outgoing mail settings.
    no_sender: This installation has no address to send from yet. Set a sender address in the company profile.
    send_email: Send email
    send: Send
    preview: Preview
    preview_and_send: Preview and send
    template: Template
    subject: Subject
    subject_placeholder: Leave empty for the template's own subject
    subject_help: Only for this one message. Empty uses the subject the template was written with, and either way it takes the same placeholders.
    recipient: Recipient
    recipient_help: Change it and only this message goes elsewhere — the record is not altered.
    recipient_from_field: 'Taken from %field%.'
    recipient_from_link: 'Taken from the %field% of the %via% this record names.'
    from: From
    reply_to: Reply to
    none_for_record: No email template applies to this record yet.
    not_sendable: Nothing can be sent from this record.
    no_template_chosen: Pick one of the templates. Nothing was sent.
    recipient_invalid: '"%address%" is not an email address. Nothing was sent.'
    attachment: Attachment
    no_attachment: Nothing attached
    attachment_help: The document is generated from this record when the message is sent, and goes out with it.
    attachment_failed: 'Nothing was sent, because the document could not be attached. %reason%'

flash:
    saved: Saved.
    transitioned: 'Now %state%.'
    # Follow-ups (XIV-82). The success says where the thing went, because it went
    # somewhere other than the page's middle and a reader who does not look up
    # will think nothing happened.
    follow_up_opened: Opened. It sits at the top of this record until somebody marks it done.
    # Only a hand-made request reaches this: the control is a required
    # datetime-local, so a browser refuses before the server has to.
    follow_up_no_date: A follow-up needs a date to be about. Nothing was opened.
    template_uploaded: Template uploaded. It is offered on every record it applies to.
    template_deleted: 'Removed "%template%". Documents already downloaded are unaffected.'
    email_template_saved: Saved. It is offered on every record it applies to.
    email_template_deleted: 'Removed "%template%". Emails already sent are unaffected.'
    email_sent: 'Sent to %recipient%. It is on this record''s timeline.'
    profile_saved: Saved. This is how the instance describes itself from now on.
    shape_renamed: 'Renamed to "%shape%".'
    deleted: Deleted.
    passwords_differ: Those two passwords are not the same.
    password_changed: Your password has been changed.
    field_added: 'Added "%field%".'
    field_saved: 'Saved "%field%".'
    field_removed: 'Removed "%field%". Its values are still stored.'
    # Numbering (XIV-27). The second sentence is the one worth flashing: the
    # first thought of anybody who has just changed a numbering pattern is what
    # it did to the numbers already out there, and the answer is nothing.
    numbering_saved: 'Saved the numbering for "%field%". Numbers already given out are unchanged.'
    # Turning numbering on and off (XIV-91). The first names the count that was
    # actually written rather than the one the confirmation offered — a record
    # created between the two pages is one more record numbered, and what
    # somebody reads afterwards should be about what happened.
    numbering_started: 'Numbered "%field%". %count% existing records were given a number, oldest first.'
    numbering_stopped: '"%field%" is no longer numbered. The numbers on records are unchanged, and the field can be typed in again.'
    # Taking what a module grew (XIV-70). The dismissal says where the decision
    # went, because "not this one" is only safe to click if it is visibly
    # reversible.
    upgrade_dismissed: '"%addition%" will not be offered again. It is in the dismissed list if you change your mind.'
    upgrade_restored: '"%addition%" is on offer again.'
    upgrade_nothing_chosen: Nothing was ticked, so there is nothing to add.
    module_installed: 'Installed "%module%". Nobody can see it until somebody is granted permission on it.'
    # A purchase request (XIV-102). Says what happened rather than congratulating
    # anybody: "requested" and not "ordered", nothing charged, and a person is the
    # next step. A flash reading "Thank you for your purchase" would be the exact
    # lie the placeholder exists not to tell.
    purchase_requested: 'Asked for "%module%". Nothing has been charged — somebody will get in touch about it.'
    group_created: 'Created "%group%". Now say what it may do.'
    group_saved: 'Saved "%group%".'
    group_deleted: 'Deleted "%group%". Nobody was removed, only what the group gave them.'
    user_saved: 'Saved %email%.'
    user_created: 'Created %email%. Their password is %password% — copy it now, it cannot be shown again.'
    user_invited: 'Invited %email%. The link works once, for the next %hours% hours; any earlier one has stopped working.'
    user_created_not_invited: >-
        Created %email%, but the invitation could not be sent (%reason%). The account is
        waiting for one — send it again from the list once mail is working.
    invitation_failed: 'The invitation to %email% could not be sent (%reason%).'
    password_reset: 'New password for %email%: %password% — copy it now, it cannot be shown again.'
    user_reactivated: '%email% can now sign in.'
    user_deactivated: '%email% can no longer sign in.'
    upload_broken: 'That file did not arrive intact (%reason%).'
    no_file: Choose a spreadsheet to import.

# Self-service signup (XIV-64): the confirmation email, and the page its link
# lands on. Both belong to somebody who is not a customer yet, which is why they
# are here rather than anywhere tenant-shaped — there is no tenant to hold a
# setting, an email template or a language preference.
#
# Written in the language the *visitor* was reading the form in, which the
# calling site forwards with the submission. It is the only signal there is:
# this person has no account on this installation and no session.
signup:
    mail:
        subject: Confirm your Xivi installation
        greeting: 'Hello %company%,'
        body: >-
            Somebody asked for a Xivi installation called %slug% using this address.
            Follow the link below to confirm that it was you — nothing is created until
            you do.
        button: Confirm this address
        expiry: 'The link stops working after %hours% hours, and asking again sends a new one.'
        unexpected: >-
            If you were not expecting this, nothing is required of you and nothing has been
            created. You can ignore this message.
