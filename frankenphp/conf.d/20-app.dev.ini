; See https://docs.docker.com/desktop/features/networking/networking-how-tos/#connect-a-container-to-a-service-on-the-host
; See https://github.com/docker/for-linux/issues/264
; The `client_host` below may optionally be replaced with `discover_client_host=yes`
; Add `start_with_request=yes` to start debug session on each request
xdebug.client_host = host.docker.internal

; **Where PCOV looks for lines to count** (XIV-170).
;
; PCOV is the coverage driver for `composer coverage`; the Dockerfile's dev
; stage says why two drivers are installed and which one a run gets. PCOV
; instruments exactly one directory tree and guesses which one at startup, and
; left alone it guessed /app/src, so it would have counted the application and
; none of packages/*/src, where the engine and every module live. That is not a
; crash, it is a coverage figure quietly missing most of the codebase, and the
; gate would have read it as a real drop. So the root is stated rather than
; detected.
;
; vendor/ is excluded because none of it is in phpunit.dist.xml's <include>:
; instrumenting a few thousand third-party files buys lines that are thrown away
; before the report is written.
pcov.directory = /app
pcov.exclude = "~^/app/vendor/~"

; PCOV sizes its file table from this and reallocates past it. A run here
; compiles a few thousand files under /app, so the stock 64 means growing the
; table over and over on the way to the first test.
pcov.initial.files = 4000
