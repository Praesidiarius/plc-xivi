expose_php = 0
date.timezone = UTC

; **How much memory one request may have, chosen by measurement rather than by
; taste** (XIV-68, §5.1 "How long a collection can get, measured").
;
; The heaviest page this application draws is the edit form of a record with a
; long collection: every row is a Symfony form with a FormView behind it, which
; measures at roughly 0.34 MB per row on a 1.6 MB base — 35.9 MB at 100 lines,
; 105.9 MB at 300, 140.8 MB at 400. Nothing here set memory_limit before, so a
; request ran on PHP's stock 128M and the genuine ceiling was about 365 rows:
; above it the page does not get slow, it answers a 500 out of the middle of
; Twig.
;
; A collection is capped at 400 rows (Xivi\Core\Record\CollectionLimit), so 400
; is the largest form this can be asked to draw, and 256M puts that at 55% of
; its allowance — room for the per-row constant to drift as the form grows
; without anybody re-deriving this number.
;
; **Raise the cap and this has to move with it**, at about 0.34 MB a row. The
; figures come from tests/Measurement/CollectionCeilingTest.php, which is the
; thing to re-run rather than a number to argue about; it cannot verify this
; limit from inside, because PHPUnit, the kernel and the fixtures stand in more
; than 128M before a page renders at all — the check is its per-request column
; held against this line.
memory_limit = 256M

; **How large a file a record may carry, from the outside in** (XIV-115, §5.30).
;
; Four ceilings sit between somebody choosing a file and this application storing
; it, and only the innermost one can explain itself. PHP discarding a body over
; post_max_size empties $_POST and $_FILES, so the application sees a form that
; submitted nothing and says so, naming a required field rather than a limit;
; upload_max_filesize is kinder but still arrives as an error code rather than as
; a sentence with a number in it.
;
; So the numbers are deliberately not equal. Xivi\Core\Field\AttachmentLimit is
; 10 MB and is what refuses a file with the limit named; these two sit above it,
; with room for a multipart envelope and for the rest of a record form's fields,
; so that a file *at* the limit is never refused by PHP first. Caddy's
; request_body max_size in frankenphp/Caddyfile is the outermost and the largest.
;
; **Raise the application's limit and these have to move with it.**
; tests/Unit/Deployment/UploadLimitsAgreeTest.php reads all four and fails if the
; order is broken, which is the thing to re-run rather than a number to argue
; about.
upload_max_filesize = 12M
post_max_size = 14M
apc.enable_cli = 1
session.use_strict_mode = 1
zend.detect_unicode = 0

; https://symfony.com/doc/current/performance.html
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 32531
opcache.memory_consumption = 256
opcache.enable_file_override = 1
