---
services:
  php:
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      # Wildcard so per-tenant hostnames (customer1.localhost) resolve to this app.
      # Tenant resolution reads the Host header from here.
      SERVER_NAME: ${SERVER_NAME:-localhost, *.localhost}, php:80
      DEFAULT_URI: https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}
      # Control-plane connection. Per-tenant DSNs are resolved at runtime from
      # the control-plane database, not from this variable.
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-18}&charset=${POSTGRES_CHARSET:-utf8}
      # Where a filled .docx is turned into a PDF (XIV-4). A service rather than
      # a library, because the converter is LibreOffice.
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - name: https
        target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - name: http3
        target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp

  # Document conversion (XIV-4): a filled .docx in, a PDF out, converted by the
  # LibreOffice inside this image. Stateless and reachable only on the compose
  # network — it is never published, and it holds nothing between requests.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    # The default entrypoint enables every module including Chromium; only the
    # LibreOffice one is used here, and a converter that cannot also fetch URLs
    # is a smaller thing to have running.
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --api-timeout=60s

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      # postgres:18+ images store data in a major-version subdirectory and want the
      # mount one level up, at /var/lib/postgresql (the recipe's old /data path aborts).
      - database_data:/var/lib/postgresql:rw
###< doctrine/doctrine-bundle ###

volumes:
  caddy_data:
  caddy_config:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
