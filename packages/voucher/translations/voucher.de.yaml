# Deutsch, per „du“ — dieselbe Anrede wie überall sonst (XIV-8).
#
# Wird einmal bei der Installation gelesen und in die Definitionen dieser Kundin
# geschrieben; danach gehören die Bezeichnungen ihr.
#
# `field.code_help` ist die eine Ausnahme: der Feldtyp setzt sie bei jedem
# Rendern, nicht die Installation, und sie ist der einzige Ort, an dem jemand
# erfährt, dass ein leeres Feld einen Code erzeugt.

module: Gutscheine

field:
    code: Code
    code_help: Lass das Feld leer, dann wird ein Code erzeugt. Tipp einen eigenen ein, wenn du einen willst, den man vorlesen kann — Grossbuchstaben musst du nicht tippen.
    kind: Art
    amount: Betrag
    percentage: Rabatt (%)
    article: Nur auf Zeilen mit
    valid_from: Gültig ab
    valid_until: Gültig bis
    max_redemptions: Erlaubte Einlösungen

kind:
    order_amount: Betrag auf den Auftrag
    order_percentage: Prozent auf den Auftrag
    line_amount: Betrag auf eine Zeile
    line_percentage: Prozent auf eine Zeile

refusal:
    expired: Der Gutschein %voucher% ist abgelaufen und kann nicht verwendet werden.
    not_yet_valid: Der Gutschein %voucher% ist noch nicht gültig.
    exhausted: Der Gutschein %voucher% wurde bereits so oft eingelöst, wie er erlaubt.
    unavailable: Der Gutschein %voucher% ist nicht mehr verfügbar.
    wrong_place_for_line: Der Gutschein %voucher% gilt für eine einzelne Zeile und gehört deshalb auf eine Zeile statt auf den Auftrag.
    wrong_place_for_order: Der Gutschein %voucher% gilt für den ganzen Auftrag und gehört deshalb auf den Auftrag statt auf eine Zeile.
    wrong_article: Der Gutschein %voucher% kann nur auf einer Zeile mit %article% verwendet werden.
