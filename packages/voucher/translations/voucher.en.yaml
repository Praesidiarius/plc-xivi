# What the Voucher module calls itself, its fields and its four kinds (XIV-8).
#
# Read **once, at install time**, and written into that customer's definitions —
# see contact.en.yaml, which explains at length why this is a seed rather than a
# lookup table.
#
# `field.code_help` is the one key here that is *not* a seed. It is rendered on
# every draw of the form, because it is set by the field type rather than by the
# blueprint (Code\VoucherCodeFieldType::formOptions), and it is the only place
# anybody is told that leaving the box empty produces a code. That makes it the
# whole discoverability of the generator, so it says what happens rather than
# what the field is.

module: Vouchers

field:
    code: Code
    code_help: Leave this empty and a code is generated for you. Type your own if you want one people can say out loud — capitals are not required.
    kind: Kind
    amount: Amount off
    percentage: Percentage off (%)
    article: Only on lines for
    valid_from: Valid from
    valid_until: Valid until
    max_redemptions: Redemptions allowed

# **The four kinds, and each label says the mode before the arithmetic**
# (XIV-122). Somebody choosing one is choosing where the voucher may be applied
# first and how the figure is worked out second, so the labels read in that
# order — and "off one line" rather than "on one line", because what a line
# voucher does to the line it lands on is the half a shop needs to be sure of.
kind:
    order_amount: Amount off the order
    order_percentage: Percentage off the order
    line_amount: Amount off one line
    line_percentage: Percentage off one line

# **Why a voucher was refused when a document tried to use it** (XIV-104,
# XIV-122).
#
# Read at the moment somebody presses save rather than seeded into a customer's
# definitions like the labels above — the same distinction the order module's
# `guard:` block makes. There is nothing here for a customer to rename, and the
# sentence has to be the one this build actually enforces.
#
# **Seven, and not one.** "This voucher cannot be used" is of no use to whoever is
# standing at the till: a code that has been used up, a promotion that starts next
# month and a voucher somebody deleted are three different situations with three
# different things to do about them, and a limit reached is the only one where the
# answer is to stop asking.
#
# The last three are XIV-122's, and they are the mode being enforced. A voucher
# declares whether it is applied to the order or to one line, and putting it in the
# other place is a mistake with an obvious fix — so the sentence names the fix
# rather than the rule. `wrong_article` is the restriction: a line voucher may be
# limited to lines carrying one article, and a line that does not carry it is
# refused by name rather than silently discounted by nothing.
refusal:
    expired: The voucher %voucher% has expired and cannot be used.
    not_yet_valid: The voucher %voucher% is not valid yet.
    exhausted: The voucher %voucher% has already been used as many times as it allows.
    unavailable: The voucher %voucher% is no longer available.
    wrong_place_for_line: The voucher %voucher% is applied to a single line, so it belongs on a line rather than on the order.
    wrong_place_for_order: The voucher %voucher% is applied to the whole order, so it belongs on the order rather than on a line.
    wrong_article: The voucher %voucher% can only be used on a line for %article%.
