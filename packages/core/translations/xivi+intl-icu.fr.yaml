# Le seul message du moteur qui compte quelque chose (XIV-8). Apostrophes
# typographiques (’) uniquement : dans un message ICU, l'apostrophe ASCII est un
# caractère d'échappement.

metadata:
    would_invalidate: '{count, plural, one {Cette règle rendrait # enregistrement existant invalide, et il ne pourrait plus être enregistré avant d’être corrigé. Corrigez d’abord l’enregistrement, ou laissez «{key}» tel quel.} other {Cette règle rendrait # enregistrements existants invalides, et ils ne pourraient plus être enregistrés avant d’être corrigés. Corrigez d’abord les enregistrements, ou laissez «{key}» tel quel.}}'
    values_cannot_be_read: '{count, plural, one {# enregistrement existant a quelque chose que «{key}» ne sait pas lire comme valeur «{type}» ; rien n’a donc été changé : {values}. Corrigez d’abord cet enregistrement, ou dites explicitement qu’il doit être vidé.} other {# enregistrements existants ont quelque chose que «{key}» ne sait pas lire comme valeur «{type}» ; rien n’a donc été changé : {values}. Corrigez d’abord ces enregistrements, ou dites explicitement qu’ils doivent être vidés.}}'
    cannot_empty_a_required_field: '{count, plural, one {«{key}» est obligatoire, donc # enregistrement ne peut pas simplement être vidé : ce serait un enregistrement que personne ne pourrait plus enregistrer. Corrigez cette valeur, ou retirez d’abord la règle obligatoire de «{key}».} other {«{key}» est obligatoire, donc # enregistrements ne peuvent pas simplement être vidés : ce seraient des enregistrements que personne ne pourrait plus enregistrer. Corrigez ces valeurs, ou retirez d’abord la règle obligatoire de «{key}».}}'
