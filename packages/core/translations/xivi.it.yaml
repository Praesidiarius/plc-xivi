        no_converter: Il convertitore PDF non è raggiungibile, quindi per ora è disponibile solo il .docx.

mail:
    recipient:
        no_link: 'Questo record non nomina alcun %via%, quindi non c’è un indirizzo a cui inviare.'
        link_gone: 'Il %via% che questo record nomina non c’è più, quindi non c’è un indirizzo a cui inviare.'
        no_address_here: 'Questo record non ha %field%, quindi non c’è nulla a cui inviare.'
        no_address_there: 'Il %via% che questo record nomina non ha %field%, quindi non c’è nulla a cui inviare.'
        not_an_address: '“%value%” non è un indirizzo e-mail, quindi non ci si può inviare nulla.'

lifecycle:
