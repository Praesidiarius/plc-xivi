    refused_final: 'Questo record è a “%state%” e da lì non si muove più.'
    refused_unknown: Questo non è un passaggio che il record conosce.

record:
    collection_too_long: '%collection% contiene al massimo %limit% righe e questo ne ha %count%, quindi non è stato salvato nulla. Distribuiscile su più record.'
    submission_unreadable: 'Questo modulo ha inviato valori in una forma che non gli appartiene, quindi non è stato salvato nulla. Ricarica la pagina e riprova.'
    duplicate_value: 'Un altro record ha ricevuto questo %field% un attimo fa, mentre questo veniva salvato, quindi qui non è stato salvato nulla. Cambialo e riprova.'
    duplicate_value_unknown: 'Un altro record ha ricevuto uno di questi valori un attimo fa, mentre questo veniva salvato, quindi qui non è stato salvato nulla. Controlla i campi che devono essere univoci e riprova.'
    overlapping_period: 'Un altro record copre già parte di questo %field% per la stessa cosa, quindi qui non è stato salvato nulla. Scegli un periodo diverso, oppure una cosa diversa da prenotare.'
    overlapping_period_unknown: 'Un altro record copre già parte di uno di questi periodi per la stessa cosa, quindi qui non è stato salvato nulla. Controlla i periodi su questo record e riprova.'

history:
    period:
