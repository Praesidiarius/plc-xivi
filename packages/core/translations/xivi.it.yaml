# Il vocabolario proprio del motore (XIV-153), in italiano; dà del tu, come il
# resto del catalogo italiano.
#
# Le chiavi seguono xivi.en.yaml esattamente, in entrambe le direzioni;
# altrimenti TranslationCatalogueTest fa fallire il build.

operator:
    eq: è
    neq: non è
    contains: contiene
    starts: inizia con
    gt: dopo
    gte: dal
    lt: prima
    lte: fino a
    empty: è vuoto
    filled: non è vuoto
    # L'unico confronto che riguarda due estensioni anziché un punto (XIV-136).
    # Si legge come un confronto in una riga di filtro: «Soggiorno si sovrappone
    # a 19.8.2026».
    overlaps: si sovrappone a

autocomplete:
    auto: Automatico
    always: Sempre
    never: Mai

