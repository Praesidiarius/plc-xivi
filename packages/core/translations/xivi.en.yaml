# The engine's own vocabulary (XIV-8).
#
# Its own domain and its own file, shipped with the bundle, because these are
# words core chose and core should not need the application's catalogue to say
# them. A module package would ship its own the same way.
#
# What is *not* here: anything a customer named. Module labels, field labels and
# choice options are their data, in their language.

operator:
    eq: is
    neq: is not
    contains: contains
    starts: starts with
    gt: after
    gte: from
    lt: before
    lte: until
    empty: is empty
    filled: is not empty

# Whether somebody types to narrow a field's candidates (XIV-36). Read in the
# metadata editor, beside the field's width — three answers rather than a tick
# box, because the count is not the only reason to want typing and "never" is
# what a field with four options wants forever.
autocomplete:
    auto: Automatic
    always: Always
    never: Never

document:
    marker:
        record_id: Record number
        created_at: Created
        updated_at: Changed
        today: Today's date
    problem:
        not_a_docx: '"%file%" is not a Word document this can read. Save it as .docx and try again.'
        could_not_fill: 'Template "%template%" could not be filled in. It may have been saved in a format Word itself would repair.'
        no_converter: The PDF converter could not be reached, so only the .docx is available right now.

# Where a mail about a record goes, and why sometimes nowhere (XIV-39). The
# sentences name the customer's own field labels, because "no recipient" sends
# somebody looking at the wrong record and "This invoice names no Contact" does
# not.
mail:
    recipient:
        no_link: 'This record names no %via%, so there is no address to send to.'
        link_gone: 'The %via% this record names is no longer there, so there is no address to send to.'
        no_address_here: 'This record has no %field%, so there is nothing to send to.'
        no_address_there: 'The %via% this record names has no %field%, so there is nothing to send to.'
        not_an_address: '"%value%" is not an email address, so nothing can be sent to it.'

lifecycle:
    refused: 'That is not possible from "%state%". From here: %possible%.'
    refused_final: 'This record is at "%state%" and does not move on from there.'
    refused_unknown: That is not a step this record has.

# A rule about a record rather than about any one value in it (XIV-68). It names
# the limit and what was counted, and says what to do next, because "too many
# rows" on its own leaves somebody guessing at both numbers.
record:
    collection_too_long: '%collection% holds at most %limit% rows and this one has %count%, so nothing was saved. Split it across more than one record.'

history:
    period:
        today: Today
        week: This week
        month: This month
        year: This year
        older: Earlier

permission:
    action:
        view: View
        list: List
        add: Add
        edit: Edit
        delete: Delete
        export: Export
        import: Import
        templates: Templates
        document: Documents
        email_templates: Email templates
        send_email: Send email
        transition: Change status
        follow_up_create: Add follow-ups
        follow_up_complete: Complete follow-ups
    scope:
        own: Own records
        all: All records

import:
    at_sheet: '%sheet%: %problem%'
    at_row: '%sheet% row %row%: %problem%'
    problem:
        unknown_column: 'Column "%column%" matches no field of "%shape%".'
        duplicate_column: 'Two columns both fill "%field%".'
        unreadable: 'This file could not be read as a spreadsheet (%reason%).'
        missing_sheet: 'The file has no sheet named "%sheet%". An export of this module is the shape it expects.'
        unknown_sheet: This sheet matches no part of the module, and its rows would be ignored.
        missing_parent_column: 'A "%shape%" sheet needs a parent_id column saying which record each row belongs to.'
        duplicate_id: 'Id "%id%" appears more than once.'
        wrong_parent: 'Row %row% does not belong to record %parent%.'
        unknown_parent_name: 'No row of the %sheet% sheet is called "%name%". Put that same name in the id column of the row this belongs to.'
        unknown_id: 'There is no record with id %id%. Leave the id empty to create a new one.'
        no_parent: 'This row names no parent record. Put the id of the %module% it belongs to in parent_id.'
        invalid_value: '%field%: %reason%'

module:
    requires_missing: '"%module%" needs %missing%, which is not installed here. Install that first.'

# What a customer is told when the engine will not touch a counter (XIV-27).
# Winding one back is the only way this feature can hand two documents the same
# number, so the sentence names where the counter stands rather than only saying
# no — being refused without being told the number that would work sends
# somebody guessing upward one attempt at a time.
numbering:
    counter_back: 'This counter is at %at%, so the next number it gives out is %at%. %wanted% is at or below a number already on a record, and a counter only moves forward.'
    counter_back_in: 'The counter for %period% is at %at%, so the next number it gives out is %at%. %wanted% is at or below a number already on a record, and a counter only moves forward.'

metadata:
    pattern_numbers_nothing: 'A numbering pattern has to say where the counter goes: it needs {number} in it, as in ORD-{year}-{number:4}. "%pattern%" would leave this field numbering nothing.'
    empty_label: 'A shape needs a label: it is what the navigation and every page heading call it.'
    bad_key: 'A field name must start with a letter and contain only lowercase letters, numbers and underscores. "%key%" does not.'
    key_taken: '"%shape%" already has a field named "%key%".'
    system_field: 'The field "%key%" came with the module and cannot be removed. Fields you added yourself can be.'
    module_not_installed: 'No module named "%module%" is installed here.'

query:
    unknown_field: 'There is nothing called "%path%" on "%shape%" to filter or sort by.'
    unknown_collection: '"%module%" has no collection called "%collection%".'
    unsupported_operator: 'Cannot ask whether "%path%" (%type%) %operator%. That type accepts: %supported%.'
    sort_by_collection: 'Cannot sort by "%path%": it belongs to a collection, and a record with two of them has two values. Which one would be the record''s?'
