# The engine's own vocabulary (XIV-8).
#
# Its own domain and its own file, shipped with the bundle, because these are
# words core chose and core should not need the application's catalogue to say
# them. A module package would ship its own the same way.
#
# What is *not* here: anything a customer named. Module labels, field labels and
# choice options are their data, in their language.

operator:
    eq: is
    neq: is not
    contains: contains
    starts: starts with
    gt: after
    gte: from
    lt: before
    lte: until
    empty: is empty
    filled: is not empty
    # The only comparison that is about two stretches rather than a point
    # (XIV-136). Reads as a comparison in a filter row: "Stay overlaps 19.8.2026".
    overlaps: overlaps

# Whether somebody types to narrow a field's candidates (XIV-36). Read in the
# metadata editor, beside the field's width — three answers rather than a tick
# box, because the count is not the only reason to want typing and "never" is
# what a field with four options wants forever.
autocomplete:
    auto: Automatic
    always: Always
    never: Never

document:
    marker:
        record_id: Record number
        created_at: Created
        updated_at: Changed
        today: Today's date
    problem:
        not_a_docx: '"%file%" is not a Word document this can read. Save it as .docx and try again.'
        could_not_fill: 'Template "%template%" could not be filled in. It may have been saved in a format Word itself would repair.'
        no_converter: The PDF converter could not be reached, so only the .docx is available right now.

# Where a mail about a record goes, and why sometimes nowhere (XIV-39). The
# sentences name the customer's own field labels, because "no recipient" sends
# somebody looking at the wrong record and "This invoice names no Contact" does
# not.
mail:
    recipient:
        no_link: 'This record names no %via%, so there is no address to send to.'
        link_gone: 'The %via% this record names is no longer there, so there is no address to send to.'
        no_address_here: 'This record has no %field%, so there is nothing to send to.'
        no_address_there: 'The %via% this record names has no %field%, so there is nothing to send to.'
        not_an_address: '"%value%" is not an email address, so nothing can be sent to it.'

lifecycle:
    refused: 'That is not possible from "%state%". From here: %possible%.'
    refused_final: 'This record is at "%state%" and does not move on from there.'
    refused_unknown: That is not a step this record has.

# A rule about a record rather than about any one value in it (XIV-68). It names
# the limit and what was counted, and says what to do next, because "too many
# rows" on its own leaves somebody guessing at both numbers.
record:
    collection_too_long: '%collection% holds at most %limit% rows and this one has %count%, so nothing was saved. Split it across more than one record.'
    # And the other answer the same check can give (XIV-90): the values were not
    # shaped like this form's values, so there was nothing to count. It names no
    # limit and no number on purpose — inventing one would be worse than saying
    # plainly that this could not be read.
    submission_unreadable: 'This form sent values in a shape it does not have, so nothing was saved. Reload the page and try again.'
    # The unique index refusing a save (XIV-109). It says what happened rather
    # than only that something failed, because what happened is genuinely
    # surprising: the form was checked, it was fine, and it stopped being fine
    # while it was being written. Somebody told only "already in use" looks at
    # the value, sees nothing wrong with it, and presses Save again.
    duplicate_value: 'Another record was given this %field% a moment ago, while this one was being saved, so nothing was saved here. Change it and try again.'
    # And the same thing where the field could not be named — a unique index
    # this engine did not create. Naming nothing beats naming the wrong one.
    duplicate_value_unknown: 'Another record was given one of these values a moment ago, while this one was being saved, so nothing was saved here. Check the fields that have to be unique and try again.'

    # The exclusion constraint refusing a save (XIV-136). Harder to explain than
    # the duplicate above, because nothing on the form is wrong: what is in the
    # way is another record, which the person saving may not even be able to see.
    # So it says what happened and what to change rather than "invalid".
    overlapping_period: 'Another record already covers part of this %field% for the same thing, so nothing was saved here. Choose a different period, or a different one to book it against.'
    # And the same where the field could not be named — a constraint this engine
    # did not create. Naming nothing beats naming the wrong one.
    overlapping_period_unknown: 'Another record already covers part of one of these periods for the same thing, so nothing was saved here. Check the periods on this record and try again.'

history:
    period:
        today: Today
        week: This week
        month: This month
        year: This year
        older: Earlier

permission:
    action:
        view: View
        list: List
        add: Add
        edit: Edit
        delete: Delete
        export: Export
        import: Import
        templates: Templates
        document: Documents
        email_templates: Email templates
        send_email: Send email
        transition: Change status
        follow_up_create: Add follow-ups
        follow_up_complete: Complete follow-ups
    scope:
        own: Own records
        all: All records

import:
    at_sheet: '%sheet%: %problem%'
    at_row: '%sheet% row %row%: %problem%'
    problem:
        unknown_column: 'Column "%column%" matches no field of "%shape%".'
        duplicate_column: 'Two columns both fill "%field%".'
        unreadable: 'This file could not be read as a spreadsheet (%reason%).'
        missing_sheet: 'The file has no sheet named "%sheet%". An export of this module is the shape it expects.'
        unknown_sheet: This sheet matches no part of the module, and its rows would be ignored.
        missing_parent_column: 'A "%shape%" sheet needs a parent_id column saying which record each row belongs to.'
        duplicate_id: 'Id "%id%" appears more than once.'
        wrong_parent: 'Row %row% does not belong to record %parent%.'
        unknown_parent_name: 'No row of the %sheet% sheet is called "%name%". Put that same name in the id column of the row this belongs to.'
        unknown_id: 'There is no record with id %id%. Leave the id empty to create a new one.'
        no_parent: 'This row names no parent record. Put the id of the %module% it belongs to in parent_id.'
        invalid_value: '%field%: %reason%'

module:
    requires_missing: '"%module%" needs %missing%, which is not installed here. Install that first.'

# What a customer is told when the engine will not touch a counter (XIV-27).
# Winding one back is the only way this feature can hand two documents the same
# number, so the sentence names where the counter stands rather than only saying
# no — being refused without being told the number that would work sends
# somebody guessing upward one attempt at a time.
numbering:
    counter_back: 'This counter is at %at%, so the next number it gives out is %at%. %wanted% is at or below a number already on a record, and a counter only moves forward.'
    counter_back_in: 'The counter for %period% is at %at%, so the next number it gives out is %at%. %wanted% is at or below a number already on a record, and a counter only moves forward.'
    # The second way to hand two documents the same number (XIV-91), and the one
    # the counter cannot see: a number typed into the field by hand before it was
    # numbered was never in any counter. So the records are read as well, and the
    # sentence names the highest number found there — which is usually the thing
    # somebody was trying to type in the first place.
    counter_in_use: 'A record already carries %number%, so setting the counter to %wanted% would give that number out a second time. Numbers typed in before this field was numbered are not in the counter, so they are looked for in the records instead. The lowest this counter can be set to is %free%.'
    counter_in_use_in: 'A record already carries %number%, so setting the counter for %period% to %wanted% would give that number out a second time. Numbers typed in before this field was numbered are not in the counter, so they are looked for in the records instead. The lowest this counter can be set to is %free%.'

metadata:
    pattern_numbers_nothing: 'A numbering pattern has to say where the counter goes: it needs {number} in it, as in ORD-{year}-{number:4}. "%pattern%" would leave this field numbering nothing.'
    empty_label: 'A shape needs a label: it is what the navigation and every page heading call it.'
    bad_key: 'A field name must start with a letter and contain only lowercase letters, numbers and underscores. "%key%" does not.'
    key_taken: '"%shape%" already has a field named "%key%".'
    system_field: 'The field "%key%" came with the module and cannot be removed. Fields you added yourself can be.'
    module_not_installed: 'No module named "%module%" is installed here.'
    # Refusing to make a field unique, with the values to go and fix (XIV-109).
    # No plural to handle: a value cannot be *shared* by fewer than two records.
    values_are_shared: '%count% records already share a value in "%key%", so it cannot be made unique. On more than one record: %values%. Fix those records first, or leave "%key%" as it is.'
    # The five refusals a mandatory per-type option can meet (XIV-144). Every one
    # of them is about something that would otherwise be silent: a field that is
    # drawn and saved and does nothing, an option removed from under the records
    # holding it, ids that go on rendering as the wrong records' names.
    # The option name arrives already quoted, and with an "or" in it when there
    # is more than one way of answering (XIV-127): a choice field's values may
    # come from its own options or from a shared list, and a sentence naming only
    # the first would send somebody off to type options into a field they meant
    # to point at a list.
    option_unanswered: 'A "%type%" field does nothing until %option% is set, so "%key%" was not saved. A choice field with no options offers nothing to pick and accepts anything; a reference with no target has nowhere to look a record up.'
    options_are_held: '%count% existing records hold an option you are removing from "%key%": %values%. They would be left with a value that is no longer on the list and could not be saved again until somebody fixed them. Change those records first, or keep the option.'
    options_are_the_modules: 'The field "%key%" came with the module, and its options are part of what the module does — the states it moves records between, the kinds of record it knows. You can add options and rename them; removing one is not offered.'
    target_is_held: '%count% existing records point through "%key%" at records in "%from%". An id only means anything in the module it was chosen from, so pointing this field at "%to%" would leave every one of them naming the wrong record, or none. Empty those records first, or leave it pointing at "%from%".'
    target_is_the_modules: 'The field "%key%" came with the module and points at "%module%" because the module''s own forms, documents and totals expect it to. Fields you added yourself can be pointed wherever you like.'
    unknown_target: 'No module named "%module%" is installed here, so "%key%" cannot point at it.'
    # Sections (XIV-119). Refusals rather than shrugs, unlike the width and the
    # country: the empty answer here is a real one — "in no section" — so reading
    # nonsense as empty would move somebody's field and call it a success.
    unknown_section: 'There is no section named "%section%" on this module, so "%key%" cannot be put in it. Make it on the sections page first.'
    section_needs_a_name: 'A section is a heading on the form, so it needs a name: it is the only thing it says.'
    sections_are_for_modules: '"%shape%" is a list of rows inside a record rather than a form of its own, so it has no sections to put fields in.'
    # The shared lists a customer keeps (XIV-127). The first four are §5.4's rule
    # reaching further than a field's own options: an entry a record holds is not
    # removable, and where the records are is part of the sentence because they
    # are in modules the person removing it is not looking at.
    entries_are_held: '%count% existing records hold an entry you are removing from "%list%": %values%. They are in %where%. Those records would be left holding a value the list no longer has, and could not be saved again until somebody fixed them. Change those records first, or keep the entry.'
    entry_has_children: '%count% entries sit under "%label%", so it cannot be removed. Move them somewhere else or make them top-level entries first.'
    list_is_in_use: '"%list%" cannot be deleted: %count% fields take their values from it — %fields%. Point those fields somewhere else first, and the list can go.'
    list_is_the_modules: 'The field "%key%" came with the module, and its options are part of what the module does — the states it moves records between, the kinds of record it knows. It cannot take them from a list you maintain. Add a field of your own and point that at the list instead.'
    list_key_taken: 'A shared list named "%key%" already exists.'
    empty_list_label: 'A list needs a name: it is what the field editor offers when somebody points a field at it.'
    cannot_merge_that: 'A merge has to name two different entries of "%list%". Pick the entry to keep and the entry to merge into it.'
    unknown_list: 'No shared list named "%list%" exists here, so "%key%" cannot take its values from it.'
    # And the two that answer §5.21's objection to options in general: pointing a
    # populated field at a list, or off one, reinterprets every value already
    # stored — so the values are counted against the new source first and the
    # ones that would be stranded are named.
    values_are_not_on_the_list: '%count% existing records hold a value in "%key%" that is not on the list "%list%": %values%. Pointing the field at that list would leave them holding something it does not contain, and they could not be saved again until somebody fixed them. Add those values to the list first, or change the records.'
    values_are_not_among_its_options: '%count% existing records hold a value in "%key%" that is not one of the field''s own options: %values%. Taking the field off the shared list would leave them holding something the field does not offer. Add those options to the field first, or leave it on the list.'

    # The three refusals a period's scope can meet (XIV-136). Each is about a rule
    # that would otherwise be switched on and enforce nothing — the worst
    # available outcome for a constraint, because the page says the overlaps are
    # impossible and the database goes on allowing them.
    scope_is_not_a_field: '"%key%" cannot be exclusive within "%scope%": this module has no field called that. Periods are exclusive within something — a room, a machine, a person — and that something is a field beside them.'
    scope_on_a_collection: '"%key%" is a field of the collection "%shape%", and periods there cannot be made exclusive: within one parent record and across the whole table are different rules, and the engine will not guess which was meant.'
    periods_already_overlap: 'Records already overlap in "%key%", so it cannot be made exclusive within "%scope%" yet: %pairs%. Move those records apart first, or leave "%key%" as it is.'

    # The two refusals a type change has of its own ([XIV-146], §7.2), and the
    # one its result can meet. The first two are about the field: the engine
    # fills it, or it is already what it is being asked to become. The third is
    # about what the conversion would leave behind, which is the only refusal
    # here that emptying does not answer.
    type_of_a_derived_field: 'The engine fills "%key%" rather than anybody typing into it, so its type is not something to change underneath it. If it is numbered, stop numbering it first: that makes it an ordinary field again, and this is then an ordinary change.'
    type_unchanged: '"%key%" is already a "%type%" field, so there is nothing to convert.'
    conversion_would_share_values: 'Read as "%type%" values, several records in "%key%" turn out to hold the same one, and "%key%" is marked unique: %values%. Nothing was changed. Sort those records out, or take the unique rule off "%key%" first.'

query:
    unknown_field: 'There is nothing called "%path%" on "%shape%" to filter or sort by.'
    unknown_collection: '"%module%" has no collection called "%collection%".'
    unsupported_operator: 'Cannot ask whether "%path%" (%type%) %operator%. That type accepts: %supported%.'
    sort_by_collection: 'Cannot sort by "%path%": it belongs to a collection, and a record with two of them has two values. Which one would be the record''s?'

# The two sentences beside a formatted field's textarea (XIV-131).
#
# The hint is the whole documentation a customer gets for the grammar, so it
# names the four constructs somebody will reach for and stops. It is not a
# Markdown tutorial: what it has to do is answer "can I make this bold" without
# sending anybody to look for the answer somewhere this application does not
# control.
markdown:
    hint: >-
        Formatting: <code>**bold**</code>, <code>*italic*</code>, <code># Heading</code>,
        and a line beginning with <code>-</code> for a list item.
    preview: Preview

# What a phone box says about itself (XIV-114). The single fact that makes a
# later refusal comprehensible: a number typed without a country code is read as
# belonging to one particular country, and this is which.
phone:
    help_country: 'Typed without a country code, this is read as a %country% number.'
    help_no_country: 'This installation has not said which country it is in, so type numbers in full, with the country code.'

# The colours and the pictures a list entry may carry (XIV-127).
#
# **Named here rather than in the application's catalogue** because the palette
# is the engine's: `ValueTone` and `ValueIcon` are what a definition holds, and a
# module drawing one should not have to reach into `messages` to name it.
#
# The colours are named for what they *say* rather than for the pigment. A
# customer choosing a colour for "urgent" is choosing a meaning, and Bootstrap's
# own words — primary, danger — are developer vocabulary. "Blue" would be worse
# still: these are theme colours and the dark theme moves them.
value_list:
    tone:
        primary: Accent
        secondary: Muted
        success: Green
        danger: Red
        warning: Amber
        info: Blue
        light: Pale
        dark: Charcoal
    icon:
        Circle: Dot
        Square: Square
        Star: Star
        Flag: Flag
        Place: Place
        Building: Building
        Person: Person
        Box: Box
        Delivery: Delivery
        Tools: Tools
        Done: Tick
        Attention: Warning

# The three controls of a period, and the one sentence that has to be there
# (XIV-136).
#
# `until_help` is the whole of the bound decision, said where somebody meets it:
# the second date is when the period *stops*, not its last day. Getting that
# wrong is a bug nobody sees until the day two guests arrive, so it is written
# beside the box rather than in a manual.
period:
    from: From
    until: Until
    until_help: The day the period ends — it is not included, so a room is free again on this date.
    open_ended_label: No end date
    open_ended: 'from %from%'
