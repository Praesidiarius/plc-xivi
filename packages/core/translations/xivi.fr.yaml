numbering:
    counter_back: 'Ce compteur est à %at%, le prochain numéro qu’il donne est donc %at%. %wanted% est égal ou inférieur à un numéro déjà porté par un enregistrement, et un compteur ne fait qu’avancer.'
    counter_back_in: 'Le compteur de %period% est à %at%, le prochain numéro qu’il donne est donc %at%. %wanted% est égal ou inférieur à un numéro déjà porté par un enregistrement, et un compteur ne fait qu’avancer.'
    counter_in_use: 'Un enregistrement porte déjà %number% ; mettre le compteur à %wanted% donnerait donc ce numéro une seconde fois. Les numéros saisis à la main avant la numérotation de ce champ ne sont dans aucun compteur, ils sont donc cherchés dans les enregistrements. Le plus bas possible pour ce compteur est %free%.'
    counter_in_use_in: 'Un enregistrement porte déjà %number% ; mettre le compteur de %period% à %wanted% donnerait donc ce numéro une seconde fois. Les numéros saisis à la main avant la numérotation de ce champ ne sont dans aucun compteur, ils sont donc cherchés dans les enregistrements. Le plus bas possible pour ce compteur est %free%.'

metadata:
    pattern_numbers_nothing: 'Un motif de numérotation doit dire où va le compteur : il lui faut {number}, comme dans ORD-{year}-{number:4}. «%pattern%» laisserait ce champ ne rien numéroter.'
    empty_label: 'Une forme a besoin d’un libellé : c’est ainsi que la navigation et chaque titre de page la nomment.'
    bad_key: 'Un nom de champ commence par une lettre et ne contient que des minuscules, des chiffres et des tirets bas. «%key%» n’y répond pas.'
    key_taken: '«%shape%» a déjà un champ nommé «%key%».'
    system_field: 'Le champ «%key%» est venu avec le module et ne peut pas être retiré. Les champs que vous avez ajoutés vous-même, si.'
    module_not_installed: 'Aucun module nommé «%module%» n’est installé ici.'
    values_are_shared: '%count% enregistrements partagent déjà une valeur dans «%key%» ; il ne peut donc pas devenir unique. Sur plus d’un enregistrement : %values%. Corrigez d’abord ces enregistrements, ou laissez «%key%» tel quel.'
    option_unanswered: 'Un champ «%type%» ne fait rien tant que %option% n’est pas réglé ; «%key%» n’a donc pas été enregistré. Un champ à choix sans options ne propose rien et accepte n’importe quoi ; une référence sans cible n’a nulle part où chercher un enregistrement.'
    options_are_held: '%count% enregistrements existants portent une option que vous retirez de «%key%» : %values%. Ils garderaient une valeur qui n’est plus dans la liste et ne pourraient plus être enregistrés avant d’être corrigés. Modifiez d’abord ces enregistrements, ou gardez l’option.'
    options_are_the_modules: 'Le champ «%key%» est venu avec le module, et ses options font partie de ce que le module fait : les états entre lesquels il déplace les enregistrements, les types d’enregistrement qu’il connaît. Vous pouvez ajouter des options et les renommer ; en retirer une n’est pas proposé.'
    target_is_held: '%count% enregistrements existants pointent par «%key%» vers des enregistrements de «%from%». Un id n’a de sens que dans le module où il a été choisi ; faire pointer ce champ vers «%to%» laisserait chacun d’eux nommer le mauvais enregistrement, ou aucun. Videz d’abord ces enregistrements, ou laissez-le pointer vers «%from%».'
    target_is_the_modules: 'Le champ «%key%» est venu avec le module et pointe vers «%module%» parce que les formulaires, documents et totaux du module l’attendent ainsi. Les champs que vous avez ajoutés vous-même peuvent pointer où bon vous semble.'
    unknown_target: 'Aucun module nommé «%module%» n’est installé ici ; «%key%» ne peut donc pas pointer vers lui.'
    # « Unique » sur un champ qui contient une liste (XIV-113). L’index derrière le
    # drapeau porte sur la valeur en texte : il imposerait « pas deux
    # enregistrements avec exactement le même ensemble », ce que personne ne veut
    # dire.
    unique_holds_several_values: 'Un champ «%type%» contient plusieurs valeurs ; «unique» n’a donc pas de sens unique pour lui : il faudrait qu’il signifie soit que deux enregistrements n’ont jamais exactement le même ensemble, ce que personne ne demande, soit qu’ils ne partagent aucune valeur, ce que le moteur ne peut pas imposer. Laisse «%key%» tel quel.'
    file_on_a_collection: 'Un fichier ne peut pas vivre sur « %collection% », car une ligne de collection n’a pas d’adresse propre d’où la télécharger. Mets « %key% » sur la fiche elle-même.'
    unknown_section: 'Il n’y a pas de section nommée «%section%» sur ce module ; «%key%» ne peut donc pas y être placé. Créez-la d’abord sur la page des sections.'
    section_needs_a_name: 'Une section est un titre sur le formulaire ; il lui faut donc un nom : c’est la seule chose qu’elle dit.'
    sections_are_for_modules: '«%shape%» est une liste de lignes à l’intérieur d’un enregistrement, pas un formulaire à part ; elle n’a donc pas de sections où placer des champs.'
    promotion_needs_a_value_set: 'Les valeurs d’un champ «%type%» ne forment pas un ensemble que le client tient, il n’y a donc rien à dessiner en pastille en haut de l’enregistrement. Laissez «%key%» hors de l’en-tête, ou pointez-le vers une liste.'
    promotion_is_for_modules: '«%shape%» est une liste de lignes à l’intérieur d’un enregistrement : ses champs appartiennent à une ligne et non à l’enregistrement, et il n’y a pas une valeur de l’un d’eux à dessiner en haut de la page.'
    entries_are_held: '%count% enregistrements existants portent une entrée que vous retirez de «%list%» : %values%. Ils sont dans %where%. Ces enregistrements garderaient une valeur que la liste n’a plus, et ne pourraient plus être enregistrés avant d’être corrigés. Modifiez d’abord ces enregistrements, ou gardez l’entrée.'
    entry_has_children: '%count% entrées sont classées sous «%label%» ; elle ne peut donc pas être retirée. Déplacez-les ailleurs ou remontez-les d’abord au premier niveau.'
    list_is_in_use: '«%list%» ne peut pas être supprimée : %count% champs y prennent leurs valeurs, à savoir %fields%. Faites d’abord pointer ces champs ailleurs, et la liste pourra partir.'
    list_is_the_modules: 'Le champ «%key%» est venu avec le module, et ses options font partie de ce que le module fait : les états entre lesquels il déplace les enregistrements, les types d’enregistrement qu’il connaît. Il ne peut pas les prendre dans une liste que vous tenez. Ajoutez un champ à vous et faites-le pointer vers la liste.'
    list_key_taken: 'Une liste partagée nommée «%key%» existe déjà.'
    empty_list_label: 'Une liste a besoin d’un nom : c’est ce que l’éditeur de champs propose quand quelqu’un y fait pointer un champ.'
    cannot_merge_that: 'Une fusion doit nommer deux entrées différentes de «%list%». Choisissez l’entrée à garder et l’entrée à fusionner dedans.'
    unknown_list: 'Aucune liste partagée nommée «%list%» n’existe ici ; «%key%» ne peut donc pas y prendre ses valeurs.'
    values_are_not_on_the_list: '%count% enregistrements existants portent dans «%key%» une valeur qui n’est pas sur la liste «%list%» : %values%. Faire pointer le champ vers cette liste les laisserait porter quelque chose qu’elle ne contient pas, et ils ne pourraient plus être enregistrés avant d’être corrigés. Ajoutez d’abord ces valeurs à la liste, ou modifiez les enregistrements.'
    values_are_not_among_its_options: '%count% enregistrements existants portent dans «%key%» une valeur qui n’est pas une des options propres du champ : %values%. Retirer le champ de la liste partagée les laisserait porter quelque chose que le champ ne propose pas. Ajoutez d’abord ces options au champ, ou laissez-le sur la liste.'
    scope_is_not_a_field: '«%key%» ne peut pas être exclusif au sein de «%scope%» : ce module n’a pas de champ de ce nom. Une période est exclusive au sein de quelque chose, une salle, une machine, une personne, et ce quelque chose est un champ à côté d’elle.'
    scope_on_a_collection: '«%key%» est un champ de la collection «%shape%», et là une période ne peut pas être rendue exclusive : au sein d’un même enregistrement parent et sur toute la table sont deux règles différentes, et le moteur ne devinera pas laquelle était voulue.'
    periods_already_overlap: 'Des enregistrements se chevauchent déjà dans «%key%» ; il ne peut donc pas encore devenir exclusif au sein de «%scope%» : %pairs%. Écartez d’abord ces enregistrements, ou laissez «%key%» tel quel.'

    # Les deux refus propres à un changement de type ([XIV-146], §7.2), et celui
    # que son résultat peut rencontrer. Les deux premiers portent sur le champ :
    # le moteur le remplit, ou il est déjà ce qu’on lui demande de devenir. Le
    # troisième porte sur ce que la conversion laisserait, et c’est le seul ici
    # auquel vider ne répond pas.
    type_of_a_derived_field: 'Le moteur remplit «%key%» au lieu que quiconque y écrive ; son type n’est donc pas quelque chose à changer par-dessous. S’il est numéroté, arrêtez d’abord la numérotation : il redevient un champ ordinaire, et ceci devient un changement ordinaire.'
    type_unchanged: '«%key%» est déjà un champ «%type%» : il n’y a rien à convertir.'
    conversion_would_share_values: 'Lus comme des valeurs «%type%», plusieurs enregistrements de «%key%» se révèlent avoir la même, et «%key%» est marqué unique : %values%. Rien n’a été changé. Réglez ces enregistrements, ou retirez d’abord la règle d’unicité de «%key%».'

