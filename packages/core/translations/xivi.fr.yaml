# Un fichier sur une fiche (XIV-115). Quatre de ces six messages sont des refus,
# et celui qui compte est `too_large` : il nomme la vraie limite, prise dans la
# constante qui l’applique, car « trop gros » sans chiffre fait deviner.
file:
    upload: Choisir un fichier
    remove: Retirer ce fichier
    max: 'Jusqu’à %size% par fichier.'
    problem:
        too_large: '« %file% » fait %size%, et un fichier peut peser au plus %max%. Rien n’a été enregistré.'
        did_not_arrive: '« %file% » n’est pas arrivé en entier et n’a donc pas été enregistré. Réessaie ; si cela se reproduit, préviens qui administre cette installation.'
        not_saved: 'Le fichier n’a pas pu être enregistré. Rien n’a changé sur la fiche, et qui administre cette installation doit le savoir.'
        missing: 'Le fichier « %file% » ne se trouve plus sur cette installation.'
