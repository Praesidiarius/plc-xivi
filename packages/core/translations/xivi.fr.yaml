# Le vocabulaire propre du moteur (XIV-153), en français ; il vouvoie, comme le
# reste du catalogue français.
#
# Les clés suivent xivi.en.yaml exactement, dans les deux sens ;
# TranslationCatalogueTest fait échouer le build sinon.

operator:
    eq: est
    neq: n’est pas
    contains: contient
    starts: commence par
    gt: après
    gte: dès
    lt: avant
    lte: jusqu’à
    empty: est vide
    filled: n’est pas vide
    # La seule comparaison qui porte sur deux étendues plutôt que sur un point
    # (XIV-136). Se lit comme une comparaison dans une ligne de filtre :
    # « Séjour chevauche 19.8.2026 ».
    overlaps: chevauche
    # Les deux comparaisons d’un champ qui nomme plusieurs enregistrements
    # (XIV-113). « L’un d’eux » serait l’arbre OR que la couche de requête n’a
    # pas (§5.3) ; il n’est donc pas écrit ici non plus.
    includes: contient
    excludes: ne contient pas

