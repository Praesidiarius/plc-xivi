# L'unico messaggio del motore che conta qualcosa (XIV-8). Solo apostrofi
# tipografici (’): in un messaggio ICU l'apostrofo ASCII è un carattere di
# escape.

metadata:
    would_invalidate: '{count, plural, one {Quella regola renderebbe invalido # record esistente, e non si potrebbe più salvare finché qualcuno non lo sistema. Sistema prima il record, oppure lascia “{key}” com’è.} other {Quella regola renderebbe invalidi # record esistenti, e non si potrebbero più salvare finché qualcuno non li sistema. Sistema prima i record, oppure lascia “{key}” com’è.}}'
    values_cannot_be_read: '{count, plural, one {# record esistente ha qualcosa che “{key}” non sa leggere come valore “{type}”, quindi non è stato cambiato nulla: {values}. Sistemi prima quel record, oppure dica esplicitamente che va svuotato.} other {# record esistenti hanno qualcosa che “{key}” non sa leggere come valore “{type}”, quindi non è stato cambiato nulla: {values}. Sistemi prima quei record, oppure dica esplicitamente che vanno svuotati.}}'
    cannot_empty_a_required_field: '{count, plural, one {“{key}” è obbligatorio, quindi # record non si può semplicemente svuotare: sarebbe un record che nessuno può più salvare. Sistemi quel valore, oppure tolga prima l’obbligo da “{key}”.} other {“{key}” è obbligatorio, quindi # record non si possono semplicemente svuotare: sarebbero record che nessuno può più salvare. Sistemi quei valori, oppure tolga prima l’obbligo da “{key}”.}}'
