# The one engine message that counts something (XIV-8).

metadata:
    would_invalidate: '{count, plural, one {That rule would make # existing record invalid, and it could not be saved again until somebody fixed it. Fix the record first, or leave "{key}" as it is.} other {That rule would make # existing records invalid, and they could not be saved again until somebody fixed them. Fix the records first, or leave "{key}" as it is.}}'
    values_cannot_be_read: '{count, plural, one {# existing record holds something "{key}" cannot read as a "{type}" value, so nothing was changed: {values}. Fix that record first, or say explicitly that it should be emptied.} other {# existing records hold something "{key}" cannot read as a "{type}" value, so nothing was changed: {values}. Fix those records first, or say explicitly that they should be emptied.}}'
    cannot_empty_a_required_field: '{count, plural, one {"{key}" is required, so # record cannot simply be emptied: it would be a record nobody could save again. Fix that value, or take the required rule off "{key}" first.} other {"{key}" is required, so # records cannot simply be emptied: they would be records nobody could save again. Fix those values, or take the required rule off "{key}" first.}}'
