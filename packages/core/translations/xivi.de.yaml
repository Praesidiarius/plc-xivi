    requires_missing: '„%module%“ braucht %missing%, und das ist hier nicht installiert. Installiere das zuerst.'

# Was jemand zu hören bekommt, wenn die Engine einen Zähler nicht anfasst
# (XIV-27). Ihn zurückzudrehen ist die einzige Stelle, an der diese Funktion zwei
# Belegen dieselbe Nummer geben kann — deshalb nennt der Satz den Stand des
# Zählers und sagt nicht bloß nein.
numbering:
    counter_back: 'Dieser Zähler steht auf %at%, die nächste Nummer ist also %at%. %wanted% liegt auf oder unter einer bereits vergebenen Nummer, und ein Zähler läuft nur vorwärts.'
    counter_back_in: 'Der Zähler für %period% steht auf %at%, die nächste Nummer ist also %at%. %wanted% liegt auf oder unter einer bereits vergebenen Nummer, und ein Zähler läuft nur vorwärts.'
    # Der zweite Weg zu zwei gleichen Belegnummern (XIV-91) — und der, den der
    # Zähler nicht sehen kann: Eine vor der Nummerierung von Hand eingetippte
    # Nummer stand in keinem Zähler. Also werden auch die Datensätze gelesen.
    counter_in_use: 'Ein Datensatz trägt bereits %number%. Den Zähler auf %wanted% zu setzen würde diese Nummer ein zweites Mal vergeben. Vor der Nummerierung eingetippte Nummern stehen in keinem Zähler, deshalb wird in den Datensätzen danach gesucht. Der niedrigste mögliche Wert ist %free%.'
    counter_in_use_in: 'Ein Datensatz trägt bereits %number%. Den Zähler für %period% auf %wanted% zu setzen würde diese Nummer ein zweites Mal vergeben. Vor der Nummerierung eingetippte Nummern stehen in keinem Zähler, deshalb wird in den Datensätzen danach gesucht. Der niedrigste mögliche Wert ist %free%.'

metadata:
    pattern_numbers_nothing: 'Ein Nummernmuster muss sagen, wo der Zähler steht: es braucht {number}, etwa AUF-{year}-{number:4}. Mit „%pattern%“ würde dieses Feld gar nichts nummerieren.'
    empty_label: 'Eine Form braucht eine Bezeichnung: so nennen sie die Navigation und jede Seitenüberschrift.'
    bad_key: 'Ein Feldname muss mit einem Buchstaben beginnen und darf nur Kleinbuchstaben, Zahlen und Unterstriche enthalten. „%key%“ tut das nicht.'
    key_taken: '„%shape%“ hat bereits ein Feld namens „%key%“.'
    system_field: 'Das Feld „%key%“ kam mit dem Modul und kann nicht entfernt werden. Selbst hinzugefügte Felder schon.'
    module_not_installed: 'Hier ist kein Modul namens „%module%“ installiert.'
    # Warum ein Feld nicht eindeutig gemacht werden kann, mit den Werten, die
    # dafür sorgen (XIV-109). Kein Plural nötig: geteilt wird ein Wert erst ab
    # zwei Datensätzen.
    values_are_shared: '%count% Datensätze teilen sich bereits einen Wert in „%key%“, deshalb kann es nicht eindeutig werden. Auf mehr als einem Datensatz: %values%. Bring diese Datensätze zuerst in Ordnung, oder lass „%key%“ wie es ist.'
    # Die fünf Ablehnungen, die eine pflichtige Typ-Option treffen kann
    # (XIV-144). Jede einzelne betrifft etwas, das sonst still bliebe: ein Feld,
    # das gezeichnet und gespeichert wird und nichts tut; eine Option, die unter
    # den Datensätzen weggenommen wird, die sie tragen; IDs, die weiterhin die
    # Namen der falschen Datensätze anzeigen.
    option_unanswered: 'Ein Feld vom Typ „%type%“ tut nichts, solange %option% nicht gesetzt ist — „%key%“ wurde nicht gespeichert. Ein Auswahlfeld ohne Optionen bietet nichts zur Auswahl und nimmt alles an; eine Referenz ohne Ziel hat nichts, worin sie einen Datensatz nachschlagen könnte.'
    options_are_held: '%count% vorhandene Datensätze tragen eine Option, die du aus „%key%“ entfernst: %values%. Sie stünden mit einem Wert da, den es in der Liste nicht mehr gibt, und ließen sich erst wieder speichern, wenn jemand sie in Ordnung bringt. Ändere diese Datensätze zuerst, oder behalte die Option.'
    options_are_the_modules: 'Das Feld „%key%“ kam mit dem Modul, und seine Optionen gehören zu dem, was das Modul tut — die Zustände, zwischen denen es Datensätze bewegt, die Arten von Datensatz, die es kennt. Ergänzen und umbenennen kannst du sie; entfernen wird nicht angeboten.'
    target_is_held: '%count% vorhandene Datensätze zeigen über „%key%“ auf Datensätze in „%from%“. Eine ID bedeutet nur in dem Modul etwas, aus dem sie gewählt wurde — zeigte dieses Feld auf „%to%“, würde jede einzelne davon den falschen Datensatz benennen oder gar keinen. Leere diese Datensätze zuerst, oder lass es auf „%from%“ zeigen.'
    target_is_the_modules: 'Das Feld „%key%“ kam mit dem Modul und zeigt auf „%module%“, weil die Formulare, Dokumente und Summen des Moduls das erwarten. Felder, die du selbst angelegt hast, dürfen zeigen, wohin du willst.'
    unknown_target: 'Hier ist kein Modul namens „%module%“ installiert, deshalb kann „%key%“ nicht darauf zeigen.'
    # „Eindeutig“ auf einem Feld, das eine Liste hält (XIV-113). Der Index dahinter
    # läuft über den Wert als Text, würde also „keine zwei Datensätze mit genau
    # derselben Menge“ erzwingen, was niemand meint.
    unique_holds_several_values: 'Ein Feld vom Typ „%type%“ hält mehrere Werte, „eindeutig“ hat dafür also keine eindeutige Bedeutung: Es müsste entweder heißen, dass keine zwei Datensätze genau dieselbe Menge tragen, was niemand verlangt, oder dass keine zwei Datensätze auch nur einen Wert teilen, was die Engine nicht erzwingen kann. Lass „%key%“, wie es ist.'
    file_on_a_collection: 'Eine Datei kann nicht an „%collection%“ hängen, weil eine Zeile einer Sammlung keine eigene Adresse hat, von der man sie herunterladen könnte. Leg „%key%“ stattdessen am Datensatz selbst an.'
    # Abschnitte (XIV-119). Abweisungen statt Achselzucken, anders als bei Breite
    # und Land: Die leere Antwort ist hier eine echte — „in keinem Abschnitt“ —,
    # also würde Unsinn als leer zu lesen ein Feld verschieben und Erfolg melden.
    unknown_section: 'Auf diesem Modul gibt es keinen Abschnitt namens „%section%“, deshalb kann „%key%“ nicht hinein. Lege ihn zuerst auf der Abschnittsseite an.'
    section_needs_a_name: Ein Abschnitt ist eine Überschrift im Formular und braucht deshalb einen Namen — mehr sagt er nicht.
    sections_are_for_modules: '„%shape%“ ist eine Zeilenliste innerhalb eines Datensatzes und kein eigenes Formular, hat also keine Abschnitte, in die Felder passen.'
    entries_are_held: '%count% vorhandene Datensätze tragen einen Eintrag, den du aus „%list%“ entfernst: %values%. Sie liegen in %where%. Diese Datensätze stünden mit einem Wert da, den es in der Liste nicht mehr gibt, und ließen sich erst wieder speichern, wenn jemand sie in Ordnung bringt. Ändere diese Datensätze zuerst, oder behalte den Eintrag.'
    entry_has_children: '%count% Einträge stehen unter „%label%“, es lässt sich deshalb nicht entfernen. Verschiebe sie zuerst oder mache sie zu Einträgen der obersten Ebene.'
    list_is_in_use: '„%list%“ lässt sich nicht löschen: %count% Felder beziehen ihre Werte daraus — %fields%. Zeige diese Felder zuerst woanders hin, dann kann die Liste weg.'
    list_is_the_modules: 'Das Feld „%key%“ kam mit dem Modul, und seine Optionen gehören zu dem, was das Modul tut — die Zustände, zwischen denen es Datensätze bewegt, die Arten von Datensatz, die es kennt. Es kann sie nicht aus einer Liste beziehen, die du pflegst. Lege stattdessen ein eigenes Feld an und zeige dieses auf die Liste.'
    list_key_taken: 'Eine gemeinsame Liste namens „%key%“ gibt es bereits.'
    empty_list_label: 'Eine Liste braucht einen Namen: Er ist das, was der Feldeditor anbietet, wenn jemand ein Feld darauf zeigen lässt.'
    cannot_merge_that: 'Eine Zusammenführung muss zwei verschiedene Einträge von „%list%“ benennen. Wähle den Eintrag, der bleibt, und den, der darin aufgeht.'
    unknown_list: 'Hier gibt es keine gemeinsame Liste namens „%list%“, deshalb kann „%key%“ ihre Werte nicht beziehen.'
    values_are_not_on_the_list: '%count% vorhandene Datensätze tragen in „%key%“ einen Wert, den es in der Liste „%list%“ nicht gibt: %values%. Zeigte das Feld auf diese Liste, stünden sie mit etwas da, das sie nicht enthält, und ließen sich erst wieder speichern, wenn jemand sie in Ordnung bringt. Ergänze diese Werte zuerst in der Liste, oder ändere die Datensätze.'
    values_are_not_among_its_options: '%count% vorhandene Datensätze tragen in „%key%“ einen Wert, der keine der eigenen Optionen des Feldes ist: %values%. Nähme man das Feld von der gemeinsamen Liste, stünden sie mit etwas da, das das Feld nicht anbietet. Ergänze diese Optionen zuerst am Feld, oder lass es auf der Liste.'

    # Die drei Absagen, die der Bezug eines Zeitraums bekommen kann (XIV-136).
    # Jede betrifft eine Regel, die sonst eingeschaltet wäre und nichts
    # durchsetzen würde — das Schlimmste, was einer Bedingung passieren kann:
    # Die Seite sagt, Überschneidungen seien unmöglich, und die Datenbank lässt
    # sie weiter zu.
    scope_is_not_a_field: '„%key%“ kann nicht exklusiv innerhalb „%scope%“ sein: Dieses Modul hat kein Feld mit diesem Namen. Zeiträume sind exklusiv innerhalb von etwas — einem Zimmer, einer Maschine, einer Person — und dieses Etwas ist ein Feld daneben.'
    scope_on_a_collection: '„%key%“ ist ein Feld der Unterliste „%shape%“, und Zeiträume dort können nicht exklusiv gemacht werden: innerhalb eines übergeordneten Datensatzes und über die ganze Tabelle sind zwei verschiedene Regeln, und die Engine rät nicht, welche gemeint war.'
    periods_already_overlap: 'In „%key%“ überschneiden sich bereits Datensätze, deshalb kann es noch nicht exklusiv innerhalb „%scope%“ sein: %pairs%. Trenne diese Datensätze zuerst, oder lass „%key%“ wie es ist.'

    # Die zwei Verweigerungen, die eine Typänderung selbst hat ([XIV-146],
    # §7.2), und die eine, auf die ihr Ergebnis stoßen kann. Die ersten beiden
    # betreffen das Feld: die Engine füllt es, oder es ist schon das, was es
    # werden soll. Die dritte betrifft, was die Umwandlung hinterließe, und ist
    # die einzige hier, auf die Leeren keine Antwort ist.
    type_of_a_derived_field: 'Die Engine füllt „%key%“, statt dass jemand hineinschreibt, deshalb ist seine Art nichts, was darunter geändert wird. Wenn es nummeriert ist, beende zuerst die Nummerierung: dann ist es wieder ein gewöhnliches Feld, und dies ist eine gewöhnliche Änderung.'
    type_unchanged: '„%key%“ ist bereits ein Feld vom Typ „%type%“, es gibt also nichts umzuwandeln.'
    conversion_would_share_values: 'Als „%type%“-Werte gelesen halten mehrere Datensätze in „%key%“ denselben, und „%key%“ ist als eindeutig markiert: %values%. Es wurde nichts geändert. Bring diese Datensätze in Ordnung, oder nimm zuerst die Eindeutigkeit von „%key%“.'

query:
    unknown_field: 'Auf „%shape%“ gibt es nichts namens „%path%“, wonach sich filtern oder sortieren ließe.'
    unknown_collection: '„%module%“ hat keine Sammlung namens „%collection%“.'
    unsupported_operator: 'Es lässt sich nicht fragen, ob „%path%“ (%type%) %operator%. Dieser Typ akzeptiert: %supported%.'
    sort_by_collection: 'Nach „%path%“ lässt sich nicht sortieren: es gehört zu einer Sammlung, und ein Datensatz mit zweien davon hat zwei Werte. Welcher wäre der des Datensatzes?'
    sort_by_several_values: 'Nach „%path%“ (%type%) lässt sich nicht sortieren: es hält mehrere Werte, und ein Datensatz mit vieren davon hat vier. In der Reihenfolge welches Werts stünde die Liste?'

# Die beiden Sätze neben dem Textfeld eines formatierten Feldes (XIV-131).
#
# Der Hinweis ist die gesamte Dokumentation, die ein Kunde zur Syntax bekommt:
# er nennt die vier Konstrukte, nach denen jemand greift, und hört dann auf.
# Die Auszeichnungen selbst bleiben englisch, weil sie Zeichen sind und keine
# Wörter — <code>**fett**</code> wird nicht deutscher, wenn das Wort dazwischen
# übersetzt ist, aber das Beispiel wird falsch, wenn jemand es abtippt.
markdown:
    hint: >-
        Formatierung: <code>**fett**</code>, <code>*kursiv*</code>, <code># Überschrift</code>,
        und eine Zeile, die mit <code>-</code> beginnt, für einen Listenpunkt.
    preview: Vorschau

