# Die drei Bedienelemente eines Zeitraums und der eine Satz, der dabeistehen muss
# (XIV-136). `until_help` ist die ganze Entscheidung über die Grenze, gesagt dort,
# wo sie jemandem begegnet: Das zweite Datum ist der Moment, an dem der Zeitraum
# *endet*, nicht sein letzter Tag.
