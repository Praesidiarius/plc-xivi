# Wohin eine E-Mail zu einem Datensatz geht — und warum manchmal nirgendwohin
# (XIV-39). Die Sätze nennen die Feldbezeichnungen des Kunden, denn „kein
# Empfänger“ schickt jemanden zum falschen Datensatz, „Diese Rechnung nennt
# keinen Kontakt“ nicht.
mail:
    recipient:
        no_link: 'Dieser Datensatz nennt keinen %via%, deshalb gibt es keine Adresse zum Senden.'
        link_gone: 'Der %via%, den dieser Datensatz nennt, existiert nicht mehr, deshalb gibt es keine Adresse zum Senden.'
        no_address_here: 'Dieser Datensatz hat kein Feld %field%, deshalb gibt es nichts zu senden.'
        no_address_there: 'Der %via%, den dieser Datensatz nennt, hat kein Feld %field%, deshalb gibt es nichts zu senden.'
        not_an_address: '„%value%“ ist keine E-Mail-Adresse, deshalb kann nichts dorthin gesendet werden.'

lifecycle:
    refused: 'Das ist aus „%state%“ nicht möglich. Von hier aus: %possible%.'
    refused_final: 'Dieser Datensatz steht auf „%state%“ und geht von dort nicht weiter.'
    refused_unknown: Diesen Schritt gibt es für diesen Datensatz nicht.

# Eine Regel über den Datensatz, nicht über einen einzelnen Wert darin (XIV-68).
record:
    collection_too_long: '%collection% fasst höchstens %limit% Zeilen und hat hier %count%, deshalb wurde nichts gespeichert. Verteile das auf mehrere Datensätze.'
    # Die andere Antwort derselben Prüfung (XIV-90): Die Werte hatten nicht die
    # Form dieses Formulars, es gab also nichts zu zählen. Bewusst ohne Grenze
    # und ohne Zahl — eine erfundene Zahl wäre schlechter als die schlichte
    # Auskunft, dass sich das nicht lesen ließ.
    submission_unreadable: 'Dieses Formular hat Werte in einer Form gesendet, die es nicht hat; deshalb wurde nichts gespeichert. Lade die Seite neu und versuche es noch einmal.'
    # Der eindeutige Index, der ein Speichern ablehnt (XIV-109). Er sagt, was
    # passiert ist, und nicht nur, dass etwas schiefging: das Formular war
    # geprüft und in Ordnung und hörte genau während des Schreibens auf, es zu
    # sein.
    duplicate_value: 'Ein anderer Datensatz hat diesen Wert (%field%) gerade eben bekommen, während dieser gespeichert wurde. Deshalb wurde hier nichts gespeichert. Ändere ihn und versuche es noch einmal.'
    duplicate_value_unknown: 'Ein anderer Datensatz hat einen dieser Werte gerade eben bekommen, während dieser gespeichert wurde. Deshalb wurde hier nichts gespeichert. Prüfe die Felder, die eindeutig sein müssen, und versuche es noch einmal.'

