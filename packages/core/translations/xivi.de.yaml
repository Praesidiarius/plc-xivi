    contains: enthält
    starts: beginnt mit
    gt: nach
    gte: ab
    lt: vor
    lte: bis
    empty: ist leer
    filled: ist nicht leer

# Ob jemand tippt, um die Auswahl einzugrenzen (XIV-36).
autocomplete:
    auto: Automatisch
    always: Immer
    never: Nie

document:
