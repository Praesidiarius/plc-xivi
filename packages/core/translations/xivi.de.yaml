# German, informal ("du") — the register was chosen deliberately (XIV-8).

operator:
    eq: ist
    neq: ist nicht
    contains: enthält
    starts: beginnt mit
    gt: nach
    gte: ab
    lt: vor
    lte: bis
    empty: ist leer
    filled: ist nicht leer

# Ob jemand tippt, um die Auswahl einzugrenzen (XIV-36).
autocomplete:
    auto: Automatisch
    always: Immer
    never: Nie

document:
    marker:
        record_id: Datensatznummer
        created_at: Erstellt
        updated_at: Geändert
        today: Heutiges Datum
    problem:
        not_a_docx: '„%file%“ ist kein lesbares Word-Dokument. Speichere es als .docx und versuche es erneut.'
        could_not_fill: 'Die Vorlage „%template%“ konnte nicht befüllt werden. Möglicherweise ist sie in einem Format gespeichert, das Word selbst reparieren würde.'
        no_converter: Der PDF-Dienst war nicht erreichbar, deshalb gibt es gerade nur die .docx-Datei.

# Wohin eine E-Mail zu einem Datensatz geht — und warum manchmal nirgendwohin
# (XIV-39). Die Sätze nennen die Feldbezeichnungen des Kunden, denn „kein
# Empfänger“ schickt jemanden zum falschen Datensatz, „Diese Rechnung nennt
# keinen Kontakt“ nicht.
mail:
    recipient:
        no_link: 'Dieser Datensatz nennt keinen %via%, deshalb gibt es keine Adresse zum Senden.'
        link_gone: 'Der %via%, den dieser Datensatz nennt, existiert nicht mehr, deshalb gibt es keine Adresse zum Senden.'
        no_address_here: 'Dieser Datensatz hat kein Feld %field%, deshalb gibt es nichts zu senden.'
        no_address_there: 'Der %via%, den dieser Datensatz nennt, hat kein Feld %field%, deshalb gibt es nichts zu senden.'
        not_an_address: '„%value%“ ist keine E-Mail-Adresse, deshalb kann nichts dorthin gesendet werden.'

lifecycle:
    refused: 'Das ist aus „%state%“ nicht möglich. Von hier aus: %possible%.'
    refused_final: 'Dieser Datensatz steht auf „%state%“ und geht von dort nicht weiter.'
    refused_unknown: Diesen Schritt gibt es für diesen Datensatz nicht.

# Eine Regel über den Datensatz, nicht über einen einzelnen Wert darin (XIV-68).
record:
    collection_too_long: '%collection% fasst höchstens %limit% Zeilen und hat hier %count%, deshalb wurde nichts gespeichert. Verteile das auf mehrere Datensätze.'
    # Die andere Antwort derselben Prüfung (XIV-90): Die Werte hatten nicht die
    # Form dieses Formulars, es gab also nichts zu zählen. Bewusst ohne Grenze
    # und ohne Zahl — eine erfundene Zahl wäre schlechter als die schlichte
    # Auskunft, dass sich das nicht lesen ließ.
    submission_unreadable: 'Dieses Formular hat Werte in einer Form gesendet, die es nicht hat; deshalb wurde nichts gespeichert. Lade die Seite neu und versuche es noch einmal.'

history:
    period:
        today: Heute
        week: Diese Woche
        month: Diesen Monat
        year: Dieses Jahr
        older: Früher

permission:
    action:
        view: Ansehen
        list: Auflisten
        add: Hinzufügen
        edit: Bearbeiten
        delete: Löschen
        export: Exportieren
        import: Importieren
        templates: Vorlagen
        document: Dokumente
        email_templates: E-Mail-Vorlagen
        send_email: E-Mail senden
        transition: Status ändern
        follow_up_create: Wiedervorlagen anlegen
        follow_up_complete: Wiedervorlagen erledigen
    scope:
        own: Eigene Datensätze
        all: Alle Datensätze

import:
    at_sheet: '%sheet%: %problem%'
    at_row: '%sheet%, Zeile %row%: %problem%'
    problem:
        unknown_column: 'Die Spalte „%column%“ passt zu keinem Feld von „%shape%“.'
        duplicate_column: 'Zwei Spalten füllen beide „%field%“.'
        unreadable: 'Diese Datei konnte nicht als Tabelle gelesen werden (%reason%).'
        missing_sheet: 'Die Datei hat kein Blatt namens „%sheet%“. Ein Export dieses Moduls hat die erwartete Form.'
        unknown_sheet: Dieses Blatt passt zu keinem Teil des Moduls, seine Zeilen würden ignoriert.
        missing_parent_column: 'Ein Blatt „%shape%“ braucht eine Spalte parent_id, die sagt, zu welchem Datensatz jede Zeile gehört.'
        duplicate_id: 'Die Id „%id%“ kommt mehrfach vor.'
        wrong_parent: 'Zeile %row% gehört nicht zum Datensatz %parent%.'
        unknown_parent_name: 'Keine Zeile des Blatts %sheet% heißt „%name%“. Trage denselben Namen in der Spalte id der Zeile ein, zu der dies gehört.'
        unknown_id: 'Es gibt keinen Datensatz mit der Id %id%. Lass die Id leer, um einen neuen anzulegen.'
        no_parent: 'Diese Zeile nennt keinen übergeordneten Datensatz. Trage die Id des %module%, zu dem sie gehört, in parent_id ein.'
        invalid_value: '%field%: %reason%'

module:
    requires_missing: '„%module%“ braucht %missing%, und das ist hier nicht installiert. Installiere das zuerst.'

# Was jemand zu hören bekommt, wenn die Engine einen Zähler nicht anfasst
# (XIV-27). Ihn zurückzudrehen ist die einzige Stelle, an der diese Funktion zwei
# Belegen dieselbe Nummer geben kann — deshalb nennt der Satz den Stand des
# Zählers und sagt nicht bloß nein.
numbering:
    counter_back: 'Dieser Zähler steht auf %at%, die nächste Nummer ist also %at%. %wanted% liegt auf oder unter einer bereits vergebenen Nummer, und ein Zähler läuft nur vorwärts.'
    counter_back_in: 'Der Zähler für %period% steht auf %at%, die nächste Nummer ist also %at%. %wanted% liegt auf oder unter einer bereits vergebenen Nummer, und ein Zähler läuft nur vorwärts.'

metadata:
    pattern_numbers_nothing: 'Ein Nummernmuster muss sagen, wo der Zähler steht: es braucht {number}, etwa AUF-{year}-{number:4}. Mit „%pattern%“ würde dieses Feld gar nichts nummerieren.'
    empty_label: 'Eine Form braucht eine Bezeichnung: so nennen sie die Navigation und jede Seitenüberschrift.'
    bad_key: 'Ein Feldname muss mit einem Buchstaben beginnen und darf nur Kleinbuchstaben, Zahlen und Unterstriche enthalten. „%key%“ tut das nicht.'
    key_taken: '„%shape%“ hat bereits ein Feld namens „%key%“.'
    system_field: 'Das Feld „%key%“ kam mit dem Modul und kann nicht entfernt werden. Selbst hinzugefügte Felder schon.'
    module_not_installed: 'Hier ist kein Modul namens „%module%“ installiert.'

query:
    unknown_field: 'Auf „%shape%“ gibt es nichts namens „%path%“, wonach sich filtern oder sortieren ließe.'
    unknown_collection: '„%module%“ hat keine Sammlung namens „%collection%“.'
    unsupported_operator: 'Es lässt sich nicht fragen, ob „%path%“ (%type%) %operator%. Dieser Typ akzeptiert: %supported%.'
    sort_by_collection: 'Nach „%path%“ lässt sich nicht sortieren: es gehört zu einer Sammlung, und ein Datensatz mit zweien davon hat zwei Werte. Welcher wäre der des Datensatzes?'
