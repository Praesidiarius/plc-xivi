# Was jemand zu hören bekommt, wenn die Engine einen Zähler nicht anfasst
# (XIV-27). Ihn zurückzudrehen ist die einzige Stelle, an der diese Funktion zwei
# Belegen dieselbe Nummer geben kann — deshalb nennt der Satz den Stand des
# Zählers und sagt nicht bloß nein.
numbering:
    counter_back: 'Dieser Zähler steht auf %at%, die nächste Nummer ist also %at%. %wanted% liegt auf oder unter einer bereits vergebenen Nummer, und ein Zähler läuft nur vorwärts.'
    counter_back_in: 'Der Zähler für %period% steht auf %at%, die nächste Nummer ist also %at%. %wanted% liegt auf oder unter einer bereits vergebenen Nummer, und ein Zähler läuft nur vorwärts.'
    # Der zweite Weg zu zwei gleichen Belegnummern (XIV-91) — und der, den der
    # Zähler nicht sehen kann: Eine vor der Nummerierung von Hand eingetippte
    # Nummer stand in keinem Zähler. Also werden auch die Datensätze gelesen.
    counter_in_use: 'Ein Datensatz trägt bereits %number%. Den Zähler auf %wanted% zu setzen würde diese Nummer ein zweites Mal vergeben. Vor der Nummerierung eingetippte Nummern stehen in keinem Zähler, deshalb wird in den Datensätzen danach gesucht. Der niedrigste mögliche Wert ist %free%.'
    counter_in_use_in: 'Ein Datensatz trägt bereits %number%. Den Zähler für %period% auf %wanted% zu setzen würde diese Nummer ein zweites Mal vergeben. Vor der Nummerierung eingetippte Nummern stehen in keinem Zähler, deshalb wird in den Datensätzen danach gesucht. Der niedrigste mögliche Wert ist %free%.'

metadata:
    pattern_numbers_nothing: 'Ein Nummernmuster muss sagen, wo der Zähler steht: es braucht {number}, etwa AUF-{year}-{number:4}. Mit „%pattern%“ würde dieses Feld gar nichts nummerieren.'
    empty_label: 'Eine Form braucht eine Bezeichnung: so nennen sie die Navigation und jede Seitenüberschrift.'
    bad_key: 'Ein Feldname muss mit einem Buchstaben beginnen und darf nur Kleinbuchstaben, Zahlen und Unterstriche enthalten. „%key%“ tut das nicht.'
    key_taken: '„%shape%“ hat bereits ein Feld namens „%key%“.'
    system_field: 'Das Feld „%key%“ kam mit dem Modul und kann nicht entfernt werden. Selbst hinzugefügte Felder schon.'
    module_not_installed: 'Hier ist kein Modul namens „%module%“ installiert.'
    # Warum ein Feld nicht eindeutig gemacht werden kann, mit den Werten, die
    # dafür sorgen (XIV-109). Kein Plural nötig: geteilt wird ein Wert erst ab
    # zwei Datensätzen.
    values_are_shared: '%count% Datensätze teilen sich bereits einen Wert in „%key%“, deshalb kann es nicht eindeutig werden. Auf mehr als einem Datensatz: %values%. Bring diese Datensätze zuerst in Ordnung, oder lass „%key%“ wie es ist.'
    # Die fünf Ablehnungen, die eine pflichtige Typ-Option treffen kann
    # (XIV-144). Jede einzelne betrifft etwas, das sonst still bliebe: ein Feld,
    # das gezeichnet und gespeichert wird und nichts tut; eine Option, die unter
    # den Datensätzen weggenommen wird, die sie tragen; IDs, die weiterhin die
    # Namen der falschen Datensätze anzeigen.
    option_unanswered: 'Ein Feld vom Typ „%type%“ tut nichts, solange „%option%“ nicht gesetzt ist — „%key%“ wurde nicht gespeichert. Ein Auswahlfeld ohne Optionen bietet nichts zur Auswahl und nimmt alles an; eine Referenz ohne Ziel hat nichts, worin sie einen Datensatz nachschlagen könnte.'
    options_are_held: '%count% vorhandene Datensätze tragen eine Option, die du aus „%key%“ entfernst: %values%. Sie stünden mit einem Wert da, den es in der Liste nicht mehr gibt, und ließen sich erst wieder speichern, wenn jemand sie in Ordnung bringt. Ändere diese Datensätze zuerst, oder behalte die Option.'
    options_are_the_modules: 'Das Feld „%key%“ kam mit dem Modul, und seine Optionen gehören zu dem, was das Modul tut — die Zustände, zwischen denen es Datensätze bewegt, die Arten von Datensatz, die es kennt. Ergänzen und umbenennen kannst du sie; entfernen wird nicht angeboten.'
    target_is_held: '%count% vorhandene Datensätze zeigen über „%key%“ auf Datensätze in „%from%“. Eine ID bedeutet nur in dem Modul etwas, aus dem sie gewählt wurde — zeigte dieses Feld auf „%to%“, würde jede einzelne davon den falschen Datensatz benennen oder gar keinen. Leere diese Datensätze zuerst, oder lass es auf „%from%“ zeigen.'
    target_is_the_modules: 'Das Feld „%key%“ kam mit dem Modul und zeigt auf „%module%“, weil die Formulare, Dokumente und Summen des Moduls das erwarten. Felder, die du selbst angelegt hast, dürfen zeigen, wohin du willst.'
    unknown_target: 'Hier ist kein Modul namens „%module%“ installiert, deshalb kann „%key%“ nicht darauf zeigen.'

query:
    unknown_field: 'Auf „%shape%“ gibt es nichts namens „%path%“, wonach sich filtern oder sortieren ließe.'
    unknown_collection: '„%module%“ hat keine Sammlung namens „%collection%“.'
    unsupported_operator: 'Es lässt sich nicht fragen, ob „%path%“ (%type%) %operator%. Dieser Typ akzeptiert: %supported%.'
    sort_by_collection: 'Nach „%path%“ lässt sich nicht sortieren: es gehört zu einer Sammlung, und ein Datensatz mit zweien davon hat zwei Werte. Welcher wäre der des Datensatzes?'

# Die beiden Sätze neben dem Textfeld eines formatierten Feldes (XIV-131).
#
# Der Hinweis ist die gesamte Dokumentation, die ein Kunde zur Syntax bekommt:
# er nennt die vier Konstrukte, nach denen jemand greift, und hört dann auf.
# Die Auszeichnungen selbst bleiben englisch, weil sie Zeichen sind und keine
# Wörter — <code>**fett**</code> wird nicht deutscher, wenn das Wort dazwischen
# übersetzt ist, aber das Beispiel wird falsch, wenn jemand es abtippt.
markdown:
    hint: >-
        Formatierung: <code>**fett**</code>, <code>*kursiv*</code>, <code># Überschrift</code>,
        und eine Zeile, die mit <code>-</code> beginnt, für einen Listenpunkt.
    preview: Vorschau

phone:
    help_country: 'Ohne Landesvorwahl getippt, wird das als Nummer aus %country% gelesen.'
    help_no_country: 'Diese Installation hat kein Land hinterlegt — schreib Nummern deshalb vollständig, mit Landesvorwahl.'
