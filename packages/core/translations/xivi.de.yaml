# German, informal ("du") — the register was chosen deliberately (XIV-8).

operator:
    eq: ist
    neq: ist nicht
    contains: enthält
    starts: beginnt mit
    gt: nach
    gte: ab
    lt: vor
    lte: bis
    empty: ist leer
    filled: ist nicht leer
    # Der einzige Vergleich, der zwei Zeitspannen betrifft statt eines Punktes
    # (XIV-136). Liest sich in einer Filterzeile: „Aufenthalt überschneidet
    # 19.8.2026“.
    overlaps: überschneidet
    # Die beiden Vergleiche eines Feldes, das mehrere Datensätze benennt
    # (XIV-113). „Eines davon“ wäre der OR-Baum, den die Abfrageschicht laut
    # §5.3 nicht hat, und steht deshalb auch hier nicht.
    includes: enthält
    excludes: enthält nicht

# Ob jemand tippt, um die Auswahl einzugrenzen (XIV-36).
autocomplete:
    auto: Automatisch
    always: Immer
    never: Nie

document:
    marker:
        record_id: Datensatznummer
        created_at: Erstellt
        updated_at: Geändert
        today: Heutiges Datum
