# Deutsch, per „du“ — dieselbe Anrede wie überall sonst (XIV-8).
#
# Wird einmal bei der Installation gelesen und in die Definitionen dieser Kundin
# geschrieben; danach gehören die Bezeichnungen ihr.

module: Rechnungen

collection:
    lines: Positionen
    taxes: MWST-Aufteilung

field:
    number: Nummer
    order: Auftrag
    contact: Kundin
    issued_on: Rechnungsdatum
    due_date: Fällig
    status: Status
    note: Notiz
    vat_mode: Preisbasis
    net_total: Total netto
    tax_total: MWST
    gross_total: Total
    kind: Art
    order_line: Auftragsposition
    article: Artikel
    description: Bezeichnung
    quantity: Menge
    unit: Einheit
    unit_price: Einzelpreis
    tax_rate: MWST-Satz (%)
    line_total: Positionssumme
    rate: Satz (%)
    taxable_net: Netto
    tax_amount: MWST

# Worin eine Menge gezählt wird (XIV-118). Die Einheit gehört dem Artikel, die
# Position übernimmt eine Kopie — beide Kataloge führen deshalb dieselben sieben
# Wörter, denn ein Modul, das den Wortschatz eines anderen ausleiht, liesse sich
# nicht mehr allein installieren (§3).
#
# **Bewusst ohne Pluralformen**; die Begründung steht auf `Xivi\Core\Field\Units`.
unit:
    hour: Stunden
    day: Tage
    piece: Stück
    kilogram: kg
    metre: m
    square_metre: m²
    litre: Liter

# Wie jeder Preis auf dem Dokument zu lesen ist (XIV-116). **Ganze Sätze statt
# eines Worts**, und das ist die Entscheidung: eine Vorlage schreibt
# `[vat_mode]` und bekommt die Beschriftung der *Option*, ohne Feldnamen daneben
# — "inkl." allein ließe die Empfängerin raten, inklusive was. Der Satz muss
# allein neben einem Totalblock stehen können und von jemandem gelesen werden,
# der diese Software nie gesehen hat.
#
# Wie jede andere Beschriftung beim Installieren in die eigenen Definitionen der
# Kundin geschrieben und ab da ihre (§6.1) — genau darum geht es, denn "exkl.
# MWST" gegen "zzgl. MwSt." ist Hausstil so gut wie Übersetzung.
vat_mode:
    excluded: Preise exkl. MWST
    included: Preise inkl. MWST

status:
    draft: Entwurf
    sent: Versendet
    paid: Bezahlt
    cancelled: Storniert

line:
    article: Artikelposition
    custom: Freie Position
    comment: Kommentar
    subtotal: Zwischensumme

transition:
    send: Als versendet markieren
    pay: Als bezahlt markieren
    cancel: Stornieren

seed:
    action: Restmenge verrechnen

# Die eigene Dashboard-Karte des Moduls (XIV-66).
dashboard:
    unpaid: Offene Rechnungen
    unpaid_none: Es ist nichts offen.
    unpaid_overdue: Überfällig
