# Deutsch, per „du“ — dieselbe Anrede wie überall sonst (XIV-8).
#
# Wird einmal bei der Installation gelesen und in die Definitionen dieser Kundin
# geschrieben; danach gehören die Bezeichnungen ihr.

module: Rechnungen

collection:
    lines: Positionen
    taxes: MWST-Aufteilung

field:
    number: Nummer
    order: Auftrag
    contact: Kundin
    issued_on: Rechnungsdatum
    due_date: Fällig
    status: Status
    note: Notiz
    net_total: Total netto
    tax_total: MWST
    gross_total: Total
    kind: Art
    order_line: Auftragsposition
    article: Artikel
    description: Bezeichnung
    quantity: Menge
    unit: Einheit
