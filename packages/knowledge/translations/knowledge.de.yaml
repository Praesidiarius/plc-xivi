# Deutsch, per „du“ — dieselbe Anrede wie überall sonst (XIV-8).
#
# Wird einmal bei der Installation gelesen und in die Definitionen dieser Kundin
# geschrieben; danach gehören die Bezeichnungen ihr. Gerade die Themen unten sind
# das, was am ehesten anders heissen soll — eine Werkstatt will „Maschine“, eine
# Praxis will „Patient“.
#
# Und ein eigenes Thema geht jetzt auch (XIV-144): Der Feld-Editor hat eine
# Bedienung für die Auswahlwerte eines Choice-Felds, eine Werkstatt ergänzt also
# „Maschine“. Was nicht geht, ist eines der sechs *weg*zunehmen — dieses Feld kam
# mit dem Modul (§5.4). „Sonstiges“ bleibt trotzdem nützlich: Da landet ein
# Eintrag, solange jemand noch überlegt, ob er ein eigenes Thema will.

module: Wissen

field:
    title: Titel
    topic: Thema
    body: Eintrag

# Bewusst wenige: eine Einteilung mit zwanzig Einträgen wendet niemand
# einheitlich an, und uneinheitliche Themen sind schlimmer als gar keine, weil
# sie wie ein Register aussehen und keines sind.
topic:
    # Wie wir etwas machen — die Schritte, der Reihe nach.
    process: Ablauf
    # Was wir entschieden haben — die Regel und ihre Grenzen.
    policy: Regel
    # Was mit jemandem vereinbart wurde, der bei uns kauft.
    customer: Kundschaft
    # Was wir über die wissen, bei denen wir einkaufen.
    supplier: Lieferant
    # Was wir über die Sache selbst wissen.
    product: Produkt
    other: Sonstiges

# Wie die Übersicht die Karte mit den Einträgen ohne Thema nennt (XIV-177).
#
# Der Feldname wird eingesetzt, es steht also heute „Ohne Thema“ und bei einer
# Kundin, die das Feld umbenannt hat, ihr eigenes Wort. Der Satz ist mit dem
# Karten-Markup aus dem Katalog der Anwendung hierher gezogen: er steht auf der
# Seite dieses Moduls und sonst nirgends.
index:
    unfiled: 'Ohne %field%'
