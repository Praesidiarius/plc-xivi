# Comment le module Savoir se nomme, lui, ses champs et ses sujets (XIV-153).
#
# Lu une seule fois, à l'installation, puis écrit dans les définitions de ce
# client ; voir contact.en.yaml, qui explique pourquoi. Ce qui est stocké reste
# `process` et `supplier` quoi que deviennent les étiquettes, et le client peut
# ajouter un sujet à lui ; retirer un des six est refusé (§5.4).

module: Savoir

field:
    title: Titre
    topic: Sujet
    body: Entrée

topic:
    # Comment nous faisons quelque chose : les étapes, dans l'ordre.
    process: Processus
    # Ce que nous avons décidé : la règle, et où elle cesse de s'appliquer.
    policy: Règle interne
    # Ce qui a été convenu avec quelqu'un qui nous achète.
    customer: Client
    # Ce que nous savons des gens auprès de qui nous achetons.
    supplier: Fournisseur
    # Ce que nous savons de la chose elle-même.
    product: Produit
    other: Autre

# Comment l'index nomme la carte des entrées classées sous aucun sujet (XIV-177).
#
# Le nom du champ est inséré : « Sans Sujet » aujourd'hui, et le mot du client
# s'il a renommé le champ. La phrase a suivi le balisage des cartes hors du
# catalogue de l'application : elle est sur la page de ce module et nulle part
# ailleurs.
index:
    unfiled: 'Sans %field%'
