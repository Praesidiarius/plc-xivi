# What the Article module calls itself and its fields (XIV-8).
#
# Read **once, at install time**, and written into that customer's definitions —
# see contact.en.yaml, which says why at length. A label is the customer's data
# from the moment the module is installed, and this stops having a say.

module: Articles

field:
    kind: Kind
    title: Title
    sku_of: Variant of
    description: Description
    price: Price
    unit: Unit
    tax_rate: VAT rate (%)

# What a quantity is counted in (XIV-118). Seeded into the customer's own
# definitions at install like every label above, and theirs to rename from that
# moment — so these are a starting point rather than a vocabulary this file keeps
# a say over (§6.1).
#
# **Deliberately not pluralised**, and the argument is on `Xivi\Core\Field\Units`:
# a label stops being a key the moment it is installed, so there is nothing left
# for ICU to pluralise against — and a customer's own "pallet" would have nothing
# either. The plural form where the word has one, because a line for exactly one
# of something is the exception on an invoice; the SI symbols have no plural in
# any language this ships in.
unit:
    hour: hours
    day: days
    piece: pieces
    kilogram: kg
    metre: m
    square_metre: m²
    litre: litres

# The three kinds an article comes in ([XIV-133], §5.32).
#
# **The customer's word is "variant" and the code's word is "SKU"**, and the gap
# is deliberate. §5.5 already calls something a variant, the metadata concept
# deciding which fields a record has, so the source says SKU everywhere to keep
# that word meaning one thing. Nobody selling T-shirts reads §5.5, and "variant"
# is what they call three sizes of one shirt, so that is what the screen says.
#
# "Sold in variants" rather than "Base": the label has to say what choosing it
# *does*, and half of what it does is take the price away.
choice:
    plain: Article
    base: Sold in variants
    sku: Variant
