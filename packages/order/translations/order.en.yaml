# What the Order module calls itself, its fields and its steps (XIV-8).
#
# Read once, at install time, and written into that customer's definitions —
# see contact.en.yaml, which explains at length why this is a seed rather than a
# lookup table.

module: Orders

collection:
    lines: Lines
    taxes: VAT breakdown

field:
    number: Number
    contact: Customer
    ordered_on: Ordered on
    status: Status
    note: Note
    kind: Kind
    article: Article
    description: Description
    quantity: Quantity
    unit_price: Unit price
    line_total: Line total
    tax_rate: VAT rate (%)
    net_total: Net total
    tax_total: VAT
    gross_total: Total
    rate: Rate (%)
    taxable_net: Net
    tax_amount: VAT

status:
    draft: Draft
    confirmed: Confirmed
    delivered: Delivered
    cancelled: Cancelled

line:
    article: Article line
    custom: Custom line
    comment: Comment
    subtotal: Subtotal

transition:
    confirm: Confirm
    deliver: Mark delivered
    cancel: Cancel

# Why a step is not offered (XIV-110). Read at the moment somebody looks at the
# record rather than seeded into their definitions like the labels above: a
# transition's condition belongs to the module for as long as the module has it,
# and there is nothing for a customer to rename here.
#
# It names what to do rather than what went wrong, which is the whole reason this
# sentence is the module's and not the engine's — "cannot confirm" is something
# the engine could have said on its own, and is of no use to anybody.
guard:
    needs_a_line: An order needs at least one line before it can be confirmed.
