# What the Order module calls itself, its fields and its steps (XIV-8).
#
# Read once, at install time, and written into that customer's definitions —
# see contact.en.yaml, which explains at length why this is a seed rather than a
# lookup table.

module: Orders

collection:
    lines: Lines
    taxes: VAT breakdown

field:
    number: Number
    contact: Customer
    ordered_on: Ordered on
    status: Status
    note: Note
    kind: Kind
    article: Article
    description: Description
    quantity: Quantity
    unit: Unit
    unit_price: Unit price
    line_discount: Discount
    line_total: Line total
    tax_rate: VAT rate (%)
    vat_mode: Price basis
    voucher: Voucher
    net_total: Net total
    tax_total: VAT
    gross_total: Total
    rate: Rate (%)
    taxable_net: Net
    tax_amount: VAT

# What a quantity is counted in (XIV-118). The article owns the unit and a line
# takes a copy of it, so both catalogues carry the same seven words — a module
# that borrowed another module's vocabulary would be a module that cannot be
# installed on its own (§3).
#
# **Deliberately not pluralised**; the argument is on `Xivi\Core\Field\Units`.
unit:
    hour: hours
    day: days
    piece: pieces
    kilogram: kg
    metre: m
    square_metre: m²
    litre: litres

# How to read every price on the document (XIV-116). **Full sentences rather
# than one word**, and that is the decision: a template prints `[vat_mode]` and
# gets the *option's* label, with no field name beside it, so "included" would
# leave the recipient to work out included in what. The sentence has to survive
# being dropped into a document on its own, next to a totals block, and be read
# by somebody who has never seen this software.
#
# Seeded into the customer's own definitions at install like every other label,
# and theirs to reword from that moment (§6.1) — which is the point, because
# "exkl. MWST" and "excl. VAT" and "hors TVA" are house style as much as
# translation.
vat_mode:
    excluded: Prices exclude VAT
    included: Prices include VAT

status:
    draft: Draft
    confirmed: Confirmed
    delivered: Delivered
    cancelled: Cancelled

line:
    article: Article line
    custom: Custom line
    comment: Comment
    subtotal: Subtotal
    # The kind nobody adds (XIV-104). It is a label rather than a button: the
    # engine writes these rows from the voucher the order names, one per VAT
    # rate, and this is what the row is headed on the form and printed as on the
    # document.
    discount: Discount

transition:
    confirm: Confirm
    deliver: Mark delivered
    cancel: Cancel

# Why a step is not offered (XIV-110). Read at the moment somebody looks at the
# record rather than seeded into their definitions like the labels above: a
# transition's condition belongs to the module for as long as the module has it,
# and there is nothing for a customer to rename here.
#
# It names what to do rather than what went wrong, which is the whole reason this
# sentence is the module's and not the engine's — "cannot confirm" is something
# the engine could have said on its own, and is of no use to anybody.
guard:
    needs_a_line: An order needs at least one line before it can be confirmed.
