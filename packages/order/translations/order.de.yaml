# Deutsch, per „du“ — dieselbe Anrede wie überall sonst (XIV-8).
#
# Wird einmal bei der Installation gelesen und in die Definitionen dieser Kundin
# geschrieben; danach gehören die Bezeichnungen ihr.

module: Aufträge

collection:
    lines: Positionen
    taxes: MWST-Aufteilung

field:
    number: Nummer
    contact: Kundin
    ordered_on: Bestellt am
    status: Status
    note: Notiz
    kind: Art
    article: Artikel
    description: Bezeichnung
    quantity: Menge
    unit: Einheit
    unit_price: Einzelpreis
    line_total: Positionssumme
    tax_rate: MWST-Satz (%)
    net_total: Total netto
    tax_total: MWST
    gross_total: Total
    rate: Satz (%)
    taxable_net: Netto
    tax_amount: MWST

# Worin eine Menge gezählt wird (XIV-118). Die Einheit gehört dem Artikel, die
# Position übernimmt eine Kopie — beide Kataloge führen deshalb dieselben sieben
# Wörter, denn ein Modul, das den Wortschatz eines anderen ausleiht, liesse sich
# nicht mehr allein installieren (§3).
#
# **Bewusst ohne Pluralformen**; die Begründung steht auf `Xivi\Core\Field\Units`.
unit:
    hour: Stunden
    day: Tage
    piece: Stück
    kilogram: kg
    metre: m
    square_metre: m²
    litre: Liter

status:
    draft: Entwurf
    confirmed: Bestätigt
    delivered: Geliefert
    cancelled: Storniert

line:
    article: Artikelposition
    custom: Freie Position
    comment: Kommentar
    subtotal: Zwischensumme

transition:
    confirm: Bestätigen
    deliver: Als geliefert markieren
    cancel: Stornieren

# Warum ein Schritt nicht angeboten wird (XIV-110). Der Satz sagt, was zu tun ist,
# nicht bloss, was nicht geht.
guard:
    needs_a_line: Ein Auftrag braucht mindestens eine Position, bevor er bestätigt werden kann.
