---
# Development environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}xivi-php-dev
    build:
      context: .
      target: frankenphp_dev
    # Run as the developer, not as root. Otherwise every file a container command
    # creates — a migration, a recipe's config, a vendored asset — lands in the
    # working tree owned by root and cannot be edited from the host.
    #
    # Not ${UID}: that is a shell variable and is never exported, so Compose
    # cannot see it and every reader of this line silently got 1000. bin/ci
    # exports the real values, which is what makes the suite work anywhere the
    # checkout is not owned by uid 1000 — a second developer, or GitHub's runner,
    # where it is 1001 and vendor/ could not be created at all. Running compose
    # directly instead, with a different uid? Put APP_UID and APP_GID in
    # .env.local.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    depends_on:
      database-test:
        condition: service_healthy
      # The browser tests are part of `bin/ci`, so the grid has to be up before
      # anything asks it for a session (XIV-31).
      browser:
        condition: service_healthy
    volumes:
      # **The working tree this stack serves** (XIV-51). `./` for an ordinary
      # checkout, and the whole reason a git worktree could not run the tests:
      # a worktree is a *different directory*, so a container started from the
      # main checkout cannot see it and the suite has nothing to run against.
      #
      # Compose resolves a relative path against this file's directory rather
      # than the working directory, so a worktree points at itself absolutely.
      - ${APP_ROOT:-./}:/app
      # Whatever this installation is branded with (XIV-48). Defaults to the
      # project's own (gitignored) directory mounted over itself, which does
      # nothing — point XIVI_BRAND_DIR somewhere else to use a logo that lives
      # outside the project without copying it in. It must be a directory that
      # exists: Docker silently creates one where a bind mount's source is
      # missing, which is a confusing way to learn about a typo.
      - ${XIVI_BRAND_DIR:-./assets/brand}:/app/assets/brand:ro
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # Keep var/ off the bind-mount for faster I/O on Mac/Windows; comment to inspect from the host.
      - /app/var
    environment:
      # Note: Caddy site addresses allow one wildcard label only, so *.localhost
      # matches acme.localhost but not www.acme.localhost. Dev tenant hostnames
      # are therefore one label deep (as are production ones: customer1.1plc.ch).
      #
      # Worker mode is off; see the comment in frankenphp/Caddyfile for why.
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
      APP_ENV: "${APP_ENV:-dev}"
      # Which checkout's test databases these are (XIV-51). Empty for the main
      # one, so its names are exactly what they have always been.
      #
      # It has to be declared here or it never arrives: `docker compose exec`
      # runs a process in a container and carries none of the host's environment
      # with it, so exporting this in `bin/ci` alone left the prefix mechanism
      # switched off while looking switched on.
      #
      # Two checkouts already have a database server each, so this is not what
      # keeps them apart today — it is what would, if anyone ever pointed both at
      # one server to save the tmpfs.
      TEST_RUN: "${TEST_RUN:-}"
      # That user has no home directory in the image.
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    # The name the browser asks for in the end-to-end tests (XIV-31), and the
    # hostname the e2e tenant is provisioned under.
    #
    # **Both lines are needed, for different readers.** This application resolves
    # the customer from the Host header, and a browser in another container
    # resolves `xivi.localhost` to its own loopback rather than to this one — so
    # the name has to be one Docker's DNS answers, which is what the alias does.
    # But Panther binds its web server to the same name it will later ask for, and
    # an alias does *not* resolve inside the container it belongs to; `hostname`
    # is what puts it in this container's own /etc/hosts.
    #
    # Not the service name `php`: that is in app.system_hosts, deliberately served
    # without a tenant, so the pages render and the first thing that touches the
    # database throws. An hour, that one.
    hostname: xivi-e2e
    networks:
      default:
        aliases:
          - xivi-e2e
          # **A second name for the same container, and the landing page is why**
          # (XIV-105). The signup surface is host-bound (§8.12) and the landing
          # page shares that host (§8.13), so a browser can only reach the page by
          # asking for a name the routing table recognises — and `SIGNUP_HOST` in
          # `.env.test` is this one. It is an alias and *not* a second `hostname:`
          # because the web server binds `xivi-e2e` and never binds this: the
          # browser connects to the same socket under a different name, which is
          # the only part of the arrangement the application can see.
          #
          # **Not `signup.localhost`, which is what the suite used to configure.**
          # Chromium implements draft-west-let-localhost-be-localhost and answers
          # every `*.localhost` name from its own loopback before DNS is consulted,
          # so a browser in this network cannot be pointed at one of them however
          # the alias is spelled. Any other parent is resolved the ordinary way.
          #
          # **It keeps a dot, and that is not cosmetic.**
          # `SignupFirewallTest::testTheSignupFirewallIsScopedByAMatcherAndNotByARegularExpression`
          # proves the signup firewall is scoped by a request matcher rather than
          # by `security.yaml`'s `host:`, which is a regular expression in which a
          # dot matches anything — and it proves it by asking for the hostname with
          # its dots replaced. A single-label signup host would have nothing to
          # replace and that test would be asserting nothing at all.
          - signup.e2e
    tty: true

  # The browser the end-to-end tests drive (XIV-31).
  #
  # **Its own container, not chromium in the php image.** That image is the one
  # production is built from — the same Dockerfile, and `bin/ci` builds the
  # production target on every run — so a browser in it would be several hundred
  # megabytes and a wider attack surface in the thing that ships, for something
  # only the test suite ever uses.
  #
  # Standalone Selenium rather than a bare chromedriver: Panther talks the W3C
  # WebDriver protocol over HTTP either way, and this image already has the
  # browser, the driver and the versions that match each other, which is the part
  # nobody wants to maintain by hand.
  browser:
    image: selenium/standalone-chromium:latest
    restart: unless-stopped
    # Chromium's renderer processes want more than Docker's default 64 MB of
    # shared memory and crash without saying so when they do not get it.
    shm_size: 2gb
    environment:
      # One session at a time: the browser tests are deliberately few and run in
      # one process, so a queue is more honest than parallelism nothing uses.
      # Four slots for three tests, deliberately generous. With one slot, a
      # session the test process never released — a failing test, an interrupted
      # run — makes every later test queue for three minutes before reporting a
      # timeout that says nothing about a leaked browser. Slack here is the
      # difference between a red run and a nine-minute red run.
      SE_NODE_MAX_SESSIONS: "4"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      SE_OPTS: "--max-sessions 4 --override-max-sessions true"
      # And a session nobody has spoken to for five minutes is abandoned, so an
      # interrupted run heals itself instead of holding the only slot until
      # somebody restarts this container. Long enough that nothing a test
      # legitimately does looks idle — which is also why the tenant is
      # provisioned before the browser is opened rather than after.
      SE_NODE_SESSION_TIMEOUT: "300"
    healthcheck:
      test: ["CMD", "/opt/bin/check-grid.sh", "--host", "0.0.0.0", "--port", "4444"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The database the test suite uses, kept entirely in RAM (XIV-10).
  #
  # A second server rather than a second database on the first one, and the
  # reason is the dev tenants: acme, scratch and xivi live on `database` and are
  # meant to survive a restart. This one is on tmpfs, so it is empty every time
  # the container starts — which for tests is the point and for them would be
  # data loss.
  #
  # `fsync=off` and its friends are the other half. They trade crash safety for
  # speed, which is exactly the right trade for a database whose entire contents
  # are disposable and the wrong one for anything else. Keeping them on their own
  # server means they cannot reach anything that matters.
  #
  # Provisioning is what the suite spends its time on — CREATE DATABASE copies a
  # template off disk and the tenant migrations commit repeatedly — so this is
  # aimed squarely at the part that was left after XIV-9.
  database-test:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      # Initialising into a tmpfs needs the data directory to be a subdirectory
      # of the mount: the mount point itself is not empty enough for initdb.
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - synchronous_commit=off
      # Eight paratest workers each hold connections open per tenant they touch,
      # and the default 100 is not enough — the first symptom is "too many
      # clients already", which reads like a leak rather than a limit.
      - -c
      - max_connections=300
    tmpfs:
      # Capped rather than left to the default half-of-RAM: a CI runner with 7 GB
      # should not be one runaway test away from having none.
      #
      # **3g, and it stays 3g** — this is the number that was raised twice, from
      # 1g and then 2g, before it became clear that the thing growing was not the
      # suite (XIV-78). A full parallel run from empty measures **440 MB across
      # 48 databases, 17% of this**, so the size was never close to the problem.
      #
      # What accumulated was runs, not a run. Nothing here used to be deleted —
      # a database cannot be dropped while DAMA still holds a connection to it,
      # so the suite leaves its tenants behind (see SharesATenant) — and the next
      # run only reclaimed the ones it happened to ask for again *by worker*. A
      # class does not land on the same worker twice, so each one spread across
      # all eight and the set saturated at classes × workers: 48 × 8 × 9 MB is
      # 3.6 GB, a ceiling eight times one run and growing eight times faster than
      # the suite does. Measured 2026-08-16: four runs from empty went 48 → 92 →
      # 134 → 170 databases, 17% → 29% → 43% → 54%. It filled on the seventh.
      #
      # No size is above a ceiling like that, which is why the answer was not a
      # fourth number here. **`bin/ci` now drops every database matching this
      # checkout's prefix before it runs**, terminating whatever holds a
      # connection first, so the steady state is one run's worth and this is
      # roughly seven times what that needs. The reasoning is in `bin/ci`; the
      # numbers above are the ones it is sized against.
      #
      # The trap this comment has warned about for three enlargements is still
      # worth stating, because it is why the number was chased in the first
      # place: a full volume does not fail as a full volume. Postgres aborts its
      # checkpointer, the server restarts, and a hundred tests fail with "no
      # connection to the server", which reads like anything but a disk. `bin/ci`
      # now says so in one line instead, from a `df` it takes after reclaiming.
      #
      # Restarting the container empties it and costs nothing — still the thing
      # to reach for by hand in the middle of a session, and still not a reason
      # to raise this.
      - /var/lib/postgresql/data:size=3g
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 30s

  # A database console, for reading a tenant's tables by hand.
  #
  #   docker compose --profile tools up -d adminer
  #
  # Behind a profile so it is opt-in: it has no business in bin/ci, and an
  # ordinary `docker compose up` should not start a database UI nobody asked
  # for. In compose.override.yaml rather than compose.yaml for the stronger
  # version of the same point — this file is the development environment, and a
  # console onto every customer's data must not be able to follow the stack into
  # production.
  adminer:
    image: adminer:5
    profiles: [tools]
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: database
    ports:
      # Loopback only. Published on every interface, this is an unauthenticated
      # door to a database server for anyone who can reach this machine.
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"

  # Where mail sent in development goes, instead of anywhere (XIV-41).
  #
  # **This is visibility, not a guarantee.** It catches what is pointed at it and
  # nothing else: a DSN naming a real server still reaches that server, and this
  # container never learns of it. What makes it impossible to send to a real
  # address is the transport configuration, which is XIV-37 and a different
  # thing. Do not read this service as a safety net.
  #
  # It earns its place because the next tickets render Markdown to HTML and wrap
  # it in a base template, and neither is reviewable from a log line — Mailpit
  # shows the rendered mail and its source side by side, which is the whole
  # reason to run one at all.
  #
  # Mailpit rather than MailHog, which has had no release in two years, or
  # MailCatcher, which would put a Ruby runtime in this stack for the same job.
  #
  # **The test suite does not use it, and must not start to.** Tests assert on
  # mail through Symfony's in-memory collection — see MAILER_DSN in .env.test —
  # because the suite runs eight workers at once and this is a single mutable
  # inbox: a worker reading the API would see the other seven's mail and race
  # them for it. That is XIV-9's lesson in another shape, and no assertion is
  # worth reintroducing it for.
  #
  # No profile, unlike adminer: the dev MAILER_DSN points here, so a stack
  # without it is a stack where sending mail fails rather than one missing an
  # optional console.
  mailpit:
    image: axllent/mailpit:v1.28
    restart: unless-stopped
    environment:
      # A cap, not a retention policy — MP_DATABASE is unset, so the inbox is in
      # memory already and a restart empties it, which is what makes it obvious
      # that what is on screen belongs to this session. The cap is only so a
      # forgotten loop cannot grow it without bound.
      MP_MAX_MESSAGES: "500"
      # Accept whatever credentials arrive, over a plaintext connection. Both are
      # off by default and both are right here: this listens only on the compose
      # network, and the alternative is a DSN that grows a username and a
      # password which authenticate nothing against a server that delivers
      # nothing. It also means a DSN copied from a real deployment still lands
      # here rather than failing to connect.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      # The web UI, on the loopback only — the same reasoning as adminer's, and
      # it applies unchanged: published on every interface this is an
      # unauthenticated reader of every mail this machine has sent.
      #
      # Overridable, and `bin/ci` derives it per checkout, so a second worktree
      # does not collide with this one (XIV-51).
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
      # SMTP is deliberately *not* published. Only the php container speaks to
      # it, over the compose network, exactly as with gotenberg — a second
      # published port is a second thing two checkouts can collide on, bought
      # for a convenience nobody has asked for.
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

###> doctrine/doctrine-bundle ###
