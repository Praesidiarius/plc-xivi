---
# Development environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}xivi-php-dev
    build:
      context: .
      target: frankenphp_dev
    # Run as the developer, not as root. Otherwise every file a container command
    # creates — a migration, a recipe's config, a vendored asset — lands in the
    # working tree owned by root and cannot be edited from the host.
    #
    # Not ${UID}: that is a shell variable and is never exported, so Compose
    # cannot see it and every reader of this line silently got 1000. bin/ci
    # exports the real values, which is what makes the suite work anywhere the
    # checkout is not owned by uid 1000 — a second developer, or GitHub's runner,
    # where it is 1001 and vendor/ could not be created at all. Running compose
    # directly instead, with a different uid? Put APP_UID and APP_GID in
    # .env.local.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    depends_on:
      database-test:
        condition: service_healthy
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # Keep var/ off the bind-mount for faster I/O on Mac/Windows; comment to inspect from the host.
      - /app/var
    environment:
      # Note: Caddy site addresses allow one wildcard label only, so *.localhost
      # matches acme.localhost but not www.acme.localhost. Dev tenant hostnames
      # are therefore one label deep (as are production ones: customer1.1plc.ch).
      #
      # Worker mode is off; see the comment in frankenphp/Caddyfile for why.
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
      APP_ENV: "${APP_ENV:-dev}"
      # That user has no home directory in the image.
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true

  # The database the test suite uses, kept entirely in RAM (XIV-10).
  #
  # A second server rather than a second database on the first one, and the
  # reason is the dev tenants: acme, scratch and xivi live on `database` and are
  # meant to survive a restart. This one is on tmpfs, so it is empty every time
  # the container starts — which for tests is the point and for them would be
  # data loss.
  #
  # `fsync=off` and its friends are the other half. They trade crash safety for
  # speed, which is exactly the right trade for a database whose entire contents
  # are disposable and the wrong one for anything else. Keeping them on their own
  # server means they cannot reach anything that matters.
  #
  # Provisioning is what the suite spends its time on — CREATE DATABASE copies a
  # template off disk and the tenant migrations commit repeatedly — so this is
  # aimed squarely at the part that was left after XIV-9.
  database-test:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      # Initialising into a tmpfs needs the data directory to be a subdirectory
      # of the mount: the mount point itself is not empty enough for initdb.
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - synchronous_commit=off
      # Eight paratest workers each hold connections open per tenant they touch,
      # and the default 100 is not enough — the first symptom is "too many
      # clients already", which reads like a leak rather than a limit.
      - -c
      - max_connections=300
    tmpfs:
      # Capped rather than left to the default half-of-RAM: a CI runner with 7 GB
      # should not be one runaway test away from having none.
      #
      # 2g rather than the 1g this started at. A full parallel run is about 320 MB
      # across 28 databases now that a dozen test classes provision a tenant each
      # — and nothing here is ever deleted, because a database cannot be dropped
      # while DAMA still holds a connection to it (see SharesATenant). A machine
      # that runs both `composer test` and `composer test:parallel` therefore
      # keeps two sets, plus whatever slugs older branches left behind, and 1g ran
      # out mid-suite with "no space left on device". Restarting the container
      # empties it, which is the other half of the answer and costs nothing.
      - /var/lib/postgresql/data:size=2g
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 30s

  # A database console, for reading a tenant's tables by hand.
  #
  #   docker compose --profile tools up -d adminer
  #
  # Behind a profile so it is opt-in: it has no business in bin/ci, and an
  # ordinary `docker compose up` should not start a database UI nobody asked
  # for. In compose.override.yaml rather than compose.yaml for the stronger
  # version of the same point — this file is the development environment, and a
  # console onto every customer's data must not be able to follow the stack into
  # production.
  adminer:
    image: adminer:5
    profiles: [tools]
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: database
    ports:
      # Loopback only. Published on every interface, this is an unauthenticated
      # door to a database server for anyone who can reach this machine.
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"

###> doctrine/doctrine-bundle ###
  database:
    ports:
      # Fixed host port so external tools (PhpStorm's DB panel, psql) have a
      # predictable DSN. Per-tenant databases all live on this same server.
      - "5432:5432"
