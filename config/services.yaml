# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # What a tenant's database and role are named after the prefix, so that
    # parallel test workers cannot claim each other's cluster objects (XIV-9).
    # Production never overrides this.
    app.tenant_object_prefix: 'tenant_'

    # **Where the control plane is served** (XIV-57), and the only place that
    # hostname is written down.
    #
    # A deployment sets `CONTROL_PLANE_HOST` and nothing else: it lands in
    # `app.system_hosts` immediately below, so the host that serves the control
    # plane is by construction a host that resolves no tenant, and the two cannot
    # be set out of step with each other. It is also read by
    # Xivi\ControlPlane\Security\ControlPlaneHost, which is the firewall's request
    # matcher and the request listener's rule — three readers, one fact.
    #
    # **The class that reads it is in a package now and this parameter is not**
    # (XIV-60), which is the one place the boundary is visibly awkward and is
    # deliberate anyway: `CONTROL_PLANE_HOST` is something a *deployment* sets, and
    # a bundle that carried its own default would be answering a question about
    # where it is installed rather than about what it does.
    #
    # It must not be a hostname any tenant owns, and provisioning refuses to make
    # it one (TenantProvisioner). The default is a `.localhost` name because
    # every browser resolves those to the loopback with no hosts file, so a fresh
    # checkout can sign in to the control plane without configuring anything.
    app.control_plane_host: '%env(CONTROL_PLANE_HOST)%'

    # **Where the public signup endpoint is served, and whether it exists at all**
    # (XIV-64).
    #
    # One variable does both jobs, which is deliberate rather than economical:
    # empty means no route is registered — not a route that answers 404, but a
    # routing table with nothing in it (Xivi\ControlPlane\Routing\SignupRouteLoader)
    # — and a hostname means the endpoint is served there and nowhere else. A
    # separate on/off flag beside a hostname would be two facts that can
    # disagree, and the disagreement everybody eventually has is "enabled, but
    # nobody said where".
    #
    # It must **not** be the control-plane host. That one answers to people who
    # can see every customer and §8.9 asks for it not to be guessable; this one
    # is configured into a third party's marketing site, which is the opposite
    # kind of secret. The route loader refuses to build a routing table when the
    # two are equal.
    #
    # Like %app.control_plane_host%, it lands in app.system_hosts below, so the
    # host that serves signup is by construction one that resolves no tenant —
    # which it has to be, because a signup is about a customer who does not exist
    # yet. `.localhost` by default in dev and test for the reason the control
    # plane uses one: browsers resolve those to the loopback with no hosts file.
    app.signup_host: '%env(SIGNUP_HOST)%'

    # **Whether this installation draws its own signup page** (XIV-65).
    #
    # The second of the two switches, and it is a boolean rather than a second
    # hostname because it has no second job: the page is served on
    # %app.signup_host%, which is already decided above. The three states are
    # page-and-endpoint (the default when signup is on), endpoint-only for a
    # deployment that has built its own front end and posts to the published
    # contract, and neither — which is what an empty SIGNUP_HOST means, whatever
    # this says, and which is the shipped default.
    #
    # Read in exactly one place, Xivi\ControlPlane\Signup\SignupPage, which
    # combines it with the host so that "a page with no intake behind it" is not
    # expressible rather than being refused by a check somewhere.
    app.signup_page: '%env(bool:SIGNUP_PAGE)%'

    # **Which plans self-service may ask for** (XIV-64). `Tenant::$plan` has
    # existed since the registry did and defaults to `standard`; billing is out
    # of scope and writing the intake as though one plan is the only one would
    # have built in the assumption that has to be undone first. The first entry
    # is what a request that names no plan gets, so a deployment says which is
    # ordinary by putting it first. An unknown plan is refused at the endpoint
    # rather than stored.
    app.signup_plans: '%env(csv:XIVI_SIGNUP_PLANS)%'

    # **The currency this deployment's module price list is in** (XIV-101).
    #
    # Not the tenant's. §8.6 gives each customer a currency and that one is about
    # *their* documents — what they invoice their own customers in. This is what
    # the company running Xivi charges for a module, so it is one answer for the
    # whole installation and a tenant whose profile says EUR does not change it.
    # `App\Registry\Pricing\PriceCurrency` has the argument at length, including
    # why it deliberately does not implement `Xivi\Core\Money\InstanceCurrency`.
    #
    # **A deployment fact in the environment, which the price itself is not.**
    # [XIV-101] is emphatic that a price must not live in `.env` — a price nobody
    # can change without a deploy is the thing the ticket exists to avoid — and
    # that argument does not reach the currency: a deployment picks it once, and
    # changing it invalidates every figure on the list at the same moment, so it
    # is a re-pricing with a person in it rather than an edit between two
    # customers. Same shape as `app.control_plane_host` above (§4.4), and it is
    # read identically by both images because a parameter is in both.
    #
    # Empty by default and empty is a real answer: §8.6 refuses to guess a
    # currency for a customer because a guessed one is wrong quietly, and the same
    # holds for a price list. Unset, prices are bare numbers and the operator
    # screen says which variable to set.
    app.price_currency: '%env(PRICE_CURRENCY)%'

    # **Where each watched scheduled job pings when it runs** (XIV-126, §4.5),
    # as `command=url` pairs.
    #
    # Empty is the shipped default and means **no pings and no behaviour change
    # at all** — the same shape as XIVI_TRUSTED_DOMAINS above and [XIV-61]'s
    # secret guard, and for the same reason: monitoring is somebody else's
    # service, Xivi does not require one, and an installation that configures
    # nothing has to behave exactly as it did before this existed.
    #
    # Read in exactly one place, App\Monitoring\PingTargets, which refuses a
    # malformed entry rather than skipping it — a skipped entry is a job nobody
    # is watching on an installation whose operator believes they configured
    # watching, which is the failure §4.5 exists to remove.
    #
    # A `csv:` list rather than JSON for the same reason app.signup_plans is one:
    # this is a line somebody edits in a deployment's environment, and a shape
    # that survives being typed by hand beats one that survives being generated.
    app.monitor_pings: '%env(csv:XIVI_MONITOR_PINGS)%'

    # Hosts served without a tenant: dev tooling (profiler), health checks, the
    # container-internal name, the control plane — whose entire subject matter is
    # the set of tenants and which must therefore be about none of them (§4,
    # §8.9) — and the public signup endpoint, which is about a customer who does
    # not exist yet (§8.12). Every other host must resolve to a tenant or the
    # request is rejected.
    #
    # The last entry is the empty string when signup is switched off. That is
    # harmless and worth knowing rather than tidying: no request has an empty
    # `Host`, so an empty entry matches nothing, and the alternative — a
    # conditional list — would be a second place for "is signup on" to be
    # answered.
    app.system_hosts:
        - 'localhost'
        - '127.0.0.1'
        - '[::1]'
        - 'php'
        - '%app.control_plane_host%'
        - '%app.signup_host%'

    # **Paths that belong to no host and to nobody's data**: compiled assets, the
    # importmap, the profiler and the debug toolbar. Served identically whichever
    # hostname drew the page, because none of them is a customer's information or
    # the platform's.
    #
    # A parameter rather than a literal because it now has two readers that must
    # agree (XIV-57): it is the `dev` firewall's pattern in security.yaml, and it
    # is what Xivi\ControlPlane\EventListener\ControlPlaneRequestListener stands
    # aside for when it refuses tenant paths on the control-plane host. Two copies
    # would drift, and the way you would find out is a control-plane page with no
    # stylesheet.
    app.shared_paths: '^/(_profiler|_wdt|assets|build)/'

    # Hosts a non-production environment may still build an SMTP transport to,
    # because they accept mail and deliver none (XIV-37, and see
    # config/packages/mailer.yaml). Empty here and empty in test: the default is
    # that nothing outside production reaches a mail server at all, and dev opts
    # its catcher back in below. Production never reads this — the guard stands
    # down there entirely.
    app.mail.catcher_hosts: []

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        # Demo data is a development tool. Excluded here and registered again
        # under when@dev/when@test below, so the commands do not exist at all in
        # a production image — a stronger guarantee than a flag somebody could
        # pass by accident against a customer's database.
        #
        # Three entries shorter than it was (XIV-60), and nothing was relaxed: the
        # control plane's introspector, `tenant:inspect` and `tenant:reset` moved
        # into packages/control-plane, so the exclusions that keep them out of a
        # production build moved with them into that package's own
        # config/services.php. The argument for each is written there, unchanged.
        # Since XIV-96 the *dev and test* registrations that put them back are
        # over there too, which is the last thing this file had to say about a
        # package the application must be buildable without.
        exclude:
            - '../src/Command/GenerateDemoDataCommand.php'
            - '../src/Command/ClearDemoDataCommand.php'
            # Faker is a dev dependency; this class would not even load in a
            # production build.
            - '../src/Demo/FakerSampleValues.php'

    # The engine operates on the tenant's database. Core deliberately has no idea
    # which one that is (it would have to know about tenancy to decide), so the
    # application says so here. Without these, autowiring would hand it the
    # control-plane connection and customer records would land in the registry.
    Xivi\Core\Metadata\MetadataRepository:
        arguments:
            $entityManager: '@doctrine.orm.tenant_entity_manager'

    Xivi\Core\Metadata\MetadataEditor:
        arguments:
            $entityManager: '@doctrine.orm.tenant_entity_manager'

    # Turning numbering on is four writes that are only correct together — the
    # counter's floor, the pattern, the derived flag and the backfill — so it
    # opens the transaction they share (XIV-91). The customer's connection, for
    # the same reason as everything else here, and specifically the *same* one
    # the tenant entity manager uses: MetadataEditor's flush has to join this
    # transaction rather than run beside it.
    Xivi\Core\Metadata\NumberingChange:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    Xivi\Core\Module\ModuleInstaller:
        arguments:
            $entityManager: '@doctrine.orm.tenant_entity_manager'
            $connection: '@doctrine.dbal.tenant_connection'

    # Taking what a module grew after it was installed (XIV-70). Adding a
    # collection is a table *and* a definition, and either without the other is a
    # shape nothing can read, so it opens the transaction they share — on the
    # same connection the tenant entity manager holds, or the installer's flushes
    # would run beside that transaction rather than inside it.
    Xivi\Core\Module\ModuleUpgrade:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    Xivi\Core\Record\RecordRepository:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    # The index behind a unique field (XIV-109). Its DDL has to land in the
    # customer's database and, more sharply, in the *same* transaction as the
    # definition row that implies it — MetadataEditor takes the connection off
    # the tenant entity manager for exactly that reason, and this is the other
    # end of it.
    Xivi\Core\Record\UniqueIndex:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    # What a form starts with (XIV-30). Core's own, and autowired: it reads a
    # shape and a record and asks nothing about whose database it is in.
    Xivi\Core\Record\RecordFormData: ~

    Xivi\Core\Export\RecordExporter: ~

    # The importer opens the transaction it either keeps or throws away, so it
    # needs the same connection the records are written on. Autowired, it would
    # get the control plane, and a rolled-back check would roll back nothing.
    Xivi\Core\Import\RecordImporter:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    Xivi\Core\Query\QueryCompiler:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    # Which records of a module a link may reach (XIV-13). Core asks by module
    # key, because a filter following a reference cannot know in advance which
    # module it will land in; the application resolves it from the same grants
    # every other check uses.
    Xivi\Core\Permission\RecordAccessProvider: '@App\Tenant\Security\CurrentUserRecordAccess'

    # Where an autocompleting picker goes to search (XIV-36). Same seam again:
    # a route is the application's to name, and a form type in core that built
    # the path itself would only work under an application that happened to
    # spell it the same way.
    Xivi\Core\Record\RecordSearchUrl: '@App\Record\RecordSearchUrls'

    # And where one record's own page is (XIV-66). The same seam a third time,
    # for a caller that is not core itself but a *module*: a dashboard widget
    # shipped by packages/invoice turns "12 unpaid invoices" into twelve links,
    # and twelve links need twelve URLs. Without this the module would have to
    # spell `module_show` in its own Twig template, which is the §3 boundary
    # leaking out through the one file deptrac cannot read.
    Xivi\Core\Record\RecordPageUrl: '@App\Record\RecordPageUrls'

    Xivi\Core\Record\RecordWriter:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    Xivi\Core\History\HistoryRepository:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    # Document numbers come out of the customer's own counters (XIV-15). On the
    # control plane they would be one sequence shared by every customer, which is
    # both wrong and a leak: my invoice numbers would tell you how many invoices
    # everybody else sent.
    Xivi\Core\Numbering\NumberAllocator:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    # A voucher's redemption counter (XIV-103), and the first *module* service to
    # need this binding rather than a core one. The rule is the same one core
    # states about itself: a module has no opinion about whose database it is
    # operating on, so `packages/voucher` autowires everything except this
    # argument and the application says which connection. Autowired, it would get
    # the control plane's and count one shared set of redemptions for every
    # customer on the instance — a voucher exhausted by somebody else's orders.
    Xivi\Voucher\Redemption\VoucherRedemptions:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    # Both write to the customer's database, so both need its connection rather
    # than the control plane's.
    Xivi\Core\Demo\DemoDataGenerator:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    Xivi\Core\Demo\DemoLedger:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    # Which currency prices are in. Core asks (Xivi\Core\Money\InstanceCurrency)
    # and never learns what a tenant is; the answer comes from the customer's own
    # profile (§8.6). Same boundary as the connections above, one level up: there
    # the application says which database, here it says whose settings (XIV-11).
    Xivi\Core\Money\InstanceCurrency: '@App\Tenant\Settings\ProfileCurrency'

    # And how long a customer gets to pay, when nothing on the customer says
    # otherwise (XIV-67). The same seam one line up, for the same reason: the
    # deriver that writes a due date has no business knowing what a tenant is.
    Xivi\Core\Payment\DefaultPaymentTerms: '@App\Tenant\Settings\ProfilePaymentTerms'

    # Documents (XIV-4). Core fills a .docx template and asks for a PDF through
    # Xivi\Core\Document\PdfConverter; the application answers with Gotenberg,
    # a service on the compose network. Same seam as the currency above.
    Xivi\Core\Document\PdfConverter: '@App\Tenant\Document\GotenbergPdfConverter'

    # And what a document can say that is not about the record: who this
    # installation is, and who is generating it (XIV-4).
    Xivi\Core\Document\DocumentContext: '@App\Tenant\Document\InstanceContext'

    Xivi\Core\Document\DocumentTemplateRepository:
        arguments:
            $entityManager: '@doctrine.orm.tenant_entity_manager'

    # Email templates are the customer's too, so they live where their records
    # do (XIV-38). Text rather than a blob, and otherwise the same call.
    Xivi\Core\Mail\EmailTemplateRepository:
        arguments:
            $entityManager: '@doctrine.orm.tenant_entity_manager'

    # Which sanitizer policy an email's HTML goes through (XIV-38). The framework
    # registers one service per named sanitizer and autowiring cannot guess which
    # of them a class means, so the application says — the same shape as the
    # connections above, one level up: there it says which database, here which
    # policy. The policy itself is config/packages/html_sanitizer.yaml.
    Xivi\Core\Mail\EmailRenderer:
        arguments:
            $sanitizer: '@html_sanitizer.sanitizer.email'

    # **Dev and test cannot put mail on the wire** (XIV-37). Registered ahead of
    # every factory symfony/mailer ships — priority, on the tag they all share —
    # so it is the first thing asked about any DSN the application turns into a
    # transport, whether that is MAILER_DSN or a tenant's own SMTP credentials.
    # Read the class for why the guarantee belongs at construction rather than in
    # a configured DSN: §9.2 already recorded that a DSN is simply believed.
    #
    # Defined here rather than in config/packages/mailer.yaml because this file
    # is loaded last and its `App\` resource would otherwise overwrite the
    # definition with an untagged one.
    App\Mail\NonProductionMailGuard:
        arguments:
            $environment: '%kernel.environment%'
            $catcherHosts: '%app.mail.catcher_hosts%'
        tags:
            - { name: 'mailer.transport_factory', priority: 255 }

    # The words demo data is made of. Core's own lists by default, so generation
    # works with no dependency; dev and test replace this with Faker below,
    # which has hundreds of names where these have thirty.
    Xivi\Core\Demo\SampleValues: '@Xivi\Core\Demo\BuiltInSampleValues'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

# The demo commands, excluded from the production build above.
when@dev:
    parameters:
        # The catcher, and the loopback for anybody running one on the host
        # (XIV-41, XIV-37). `mailpit` is a compose service on a private network
        # that accepts everything and delivers nothing, which is the only reason
        # development is allowed to open a socket to it at all.
        #
        # The test environment is deliberately absent from this list: §9.2 refuses
        # to read from the catcher there — eight paratest workers against one
        # inbox is a shared mutable thing — so a transport reaching it would be a
        # transport nothing is allowed to assert on.
        app.mail.catcher_hosts: ['mailpit', 'localhost', '127.0.0.1', '::1']

    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Command\GenerateDemoDataCommand: ~
        App\Command\ClearDemoDataCommand: ~

        # The administration surface's own development-only services — the
        # tenant introspector, `tenant:inspect` and `tenant:reset` — used to be
        # named here (XIV-60) and are declared by the package itself since
        # XIV-96, in packages/control-plane/config/services.php. The application
        # names no class of that package outside the three guarded seams §4.4
        # lists, because a name it cannot resolve is a container it cannot
        # compile — and "compiles without the administration surface" has to
        # hold in every environment or it is a claim about one build rather than
        # about the application.

        App\Demo\FakerSampleValues: ~
        Xivi\Core\Demo\SampleValues: '@App\Demo\FakerSampleValues'

when@test:
    parameters:
        # One namespace per parallel worker, and one per *checkout* above it
        # (XIV-9, then XIV-51).
        #
        # TEST_TOKEN is paratest's own variable, numbered from one and empty on a
        # serial run — which leaves the name exactly as it was, so `composer test`
        # still finds the databases it left behind.
        #
        # **The token alone is not enough once two checkouts run at the same
        # time**, because both are handed the same eight numbers: worker 3 here
        # and worker 3 over there would claim one `tenant3_test_locale` between
        # them, and the second would connect with a password only the first's
        # registry knows. That is XIV-9's original failure — 245 of them —
        # arriving one layer up. TEST_RUN names the checkout and is empty for
        # anybody who never runs two.
        app.tenant_object_prefix: 'tenant%env(default::TEST_RUN)%%env(default::TEST_TOKEN)%_'

    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Command\GenerateDemoDataCommand: ~
        App\Command\ClearDemoDataCommand: ~

        # As in `when@dev` above: the control plane's development-only services
        # are declared by the control plane (XIV-96).

        App\Demo\FakerSampleValues: ~
        Xivi\Core\Demo\SampleValues: '@App\Demo\FakerSampleValues'

        # Between DAMA (100) and TenantConnectionMiddleware (0): middlewares
        # connect from the lowest priority up, so this sees the tenant's resolved
        # database name and DAMA sees the key derived from it.
        App\Tests\Support\Dbal\TenantConnectionKeyMiddleware:
            tags:
                - { name: 'doctrine.middleware', connection: 'tenant', priority: 50 }

        # Counting the tenant connection's statements, so "this is not an N+1"
        # can be asserted rather than believed (XIV-81). DBAL's own logging
        # middleware does the wrapping; all that is supplied here is a logger
        # that counts — see tests/Support/Dbal/CountsQueries.php for why that is
        # the whole of it.
        #
        # Inside the two above rather than outside, so it sees the statements as
        # the application issues them: DAMA's transaction and the connection-key
        # middleware are both about *which* database is being talked to, and
        # neither is a query anybody wrote.
        App\Tests\Support\Dbal\CountsQueries:
            public: true

        Doctrine\DBAL\Logging\Middleware:
            arguments: ['@App\Tests\Support\Dbal\CountsQueries']
            tags:
                - { name: 'doctrine.middleware', connection: 'tenant', priority: 40 }

        # A module that exists only here, so the lifecycle machinery has
        # something to be tested against without inventing product behaviour in
        # a module customers actually have (XIV-14).
        App\Tests\Support\Module\JobModule: ~

        # And one whose blueprint has *grown*, so that taking what a module
        # gained after it was installed can be tested against a shape nobody is
        # going to change for a product reason (XIV-70). The modules that really
        # grew — Contact's `payment_terms`, its addresses collection — are
        # precisely the ones a test must not assert the current shape of.
        App\Tests\Support\Module\GrownModule: ~

        # Private services with no caller are removed when the container is
        # compiled, and nothing in the application validates a record yet — the
        # UI is the next thing to be built. Keeping it reachable so the engine can
        # be tested before something happens to use it.
        Xivi\Core\Validation\RecordValidator:
            public: true

        # The same situation one ticket later (XIV-80): the follow-up write path
        # is the engine half, and its callers are the record page (XIV-82) and the
        # dashboard widget (XIV-81), neither of which exists yet. The rules it
        # enforces are exactly the ones worth having under test *before* a screen
        # relies on them, so it stays reachable until something calls it.
        App\Tenant\FollowUp\FollowUpManager:
            public: true

        # The read half (XIV-81). Reachable for the same reason as the write half
        # above and one more: the claim worth testing about it is how many
        # queries it runs, and that is a claim about the service rather than
        # about the page it happens to be drawn on. Its only production caller
        # injects it once, which is exactly the shape the container inlines.
        App\Tenant\FollowUp\MyFollowUps:
            public: true

        # XIV-37 and XIV-38 each had to be reachable from a test before anything
        # in the application called them. XIV-39 is that caller — the send screen
        # renders through EmailRenderer and sends through TenantMailer — so both
        # are ordinary private services again and the tests reach them through
        # the controller, which is the thing worth proving anyway.
