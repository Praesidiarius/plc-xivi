# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Hosts served without a tenant: dev tooling (profiler), health checks and
    # the container-internal name. Every other host must resolve to a tenant or
    # the request is rejected (docs/architecture.md §4).
    # What a tenant's database and role are named after the prefix, so that
    # parallel test workers cannot claim each other's cluster objects (XIV-9).
    # Production never overrides this.
    app.tenant_object_prefix: 'tenant_'

    app.system_hosts:
        - 'localhost'
        - '127.0.0.1'
        - '[::1]'
        - 'php'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        # Demo data is a development tool. Excluded here and registered again
        # under when@dev/when@test below, so the commands do not exist at all in
        # a production image — a stronger guarantee than a flag somebody could
        # pass by accident against a customer's database.
        exclude:
            - '../src/Command/GenerateDemoDataCommand.php'
            - '../src/Command/ClearDemoDataCommand.php'
            # Faker is a dev dependency; this class would not even load in a
            # production build.
            - '../src/Demo/FakerSampleValues.php'

    # The engine operates on the tenant's database. Core deliberately has no idea
    # which one that is (it would have to know about tenancy to decide), so the
    # application says so here. Without these, autowiring would hand it the
    # control-plane connection and customer records would land in the registry.
    Xivi\Core\Metadata\MetadataRepository:
        arguments:
            $entityManager: '@doctrine.orm.tenant_entity_manager'

    Xivi\Core\Metadata\MetadataEditor:
        arguments:
            $entityManager: '@doctrine.orm.tenant_entity_manager'

    Xivi\Core\Module\ModuleInstaller:
        arguments:
            $entityManager: '@doctrine.orm.tenant_entity_manager'
            $connection: '@doctrine.dbal.tenant_connection'

    Xivi\Core\Record\RecordRepository:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    Xivi\Core\Export\RecordExporter: ~

    # The importer opens the transaction it either keeps or throws away, so it
    # needs the same connection the records are written on. Autowired, it would
    # get the control plane, and a rolled-back check would roll back nothing.
    Xivi\Core\Import\RecordImporter:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    Xivi\Core\Query\QueryCompiler:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    Xivi\Core\Record\RecordWriter:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    Xivi\Core\History\HistoryRepository:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    # Both write to the customer's database, so both need its connection rather
    # than the control plane's.
    Xivi\Core\Demo\DemoDataGenerator:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    Xivi\Core\Demo\DemoLedger:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    # Which currency prices are in. Core asks (Xivi\Core\Money\InstanceCurrency)
    # and never learns what a tenant is; the answer comes from the customer's own
    # profile (§8.6). Same boundary as the connections above, one level up: there
    # the application says which database, here it says whose settings (XIV-11).
    Xivi\Core\Money\InstanceCurrency: '@App\Tenant\Settings\ProfileCurrency'

    # Documents (XIV-4). Core fills a .docx template and asks for a PDF through
    # Xivi\Core\Document\PdfConverter; the application answers with Gotenberg,
    # a service on the compose network. Same seam as the currency above.
    Xivi\Core\Document\PdfConverter: '@App\Tenant\Document\GotenbergPdfConverter'

    Xivi\Core\Document\DocumentTemplateRepository:
        arguments:
            $entityManager: '@doctrine.orm.tenant_entity_manager'

    # The words demo data is made of. Core's own lists by default, so generation
    # works with no dependency; dev and test replace this with Faker below,
    # which has hundreds of names where these have thirty.
    Xivi\Core\Demo\SampleValues: '@Xivi\Core\Demo\BuiltInSampleValues'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

# The demo commands, excluded from the production build above.
when@dev:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Command\GenerateDemoDataCommand: ~
        App\Command\ClearDemoDataCommand: ~

        App\Demo\FakerSampleValues: ~
        Xivi\Core\Demo\SampleValues: '@App\Demo\FakerSampleValues'

when@test:
    parameters:
        # One namespace per parallel worker. TEST_TOKEN is paratest's own
        # variable and is empty on a serial run, which leaves the name exactly as
        # it was — so `composer test` still finds the databases it left behind.
        app.tenant_object_prefix: 'tenant%env(default::TEST_TOKEN)%_'

    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Command\GenerateDemoDataCommand: ~
        App\Command\ClearDemoDataCommand: ~

        App\Demo\FakerSampleValues: ~
        Xivi\Core\Demo\SampleValues: '@App\Demo\FakerSampleValues'

        # Between DAMA (100) and TenantConnectionMiddleware (0): middlewares
        # connect from the lowest priority up, so this sees the tenant's resolved
        # database name and DAMA sees the key derived from it.
        App\Tests\Support\Dbal\TenantConnectionKeyMiddleware:
            tags:
                - { name: 'doctrine.middleware', connection: 'tenant', priority: 50 }

        # Private services with no caller are removed when the container is
        # compiled, and nothing in the application validates a record yet — the
        # UI is the next thing to be built. Keeping it reachable so the engine can
        # be tested before something happens to use it.
        Xivi\Core\Validation\RecordValidator:
            public: true
