# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Hosts served without a tenant: dev tooling (profiler), health checks and
    # the container-internal name. Every other host must resolve to a tenant or
    # the request is rejected (docs/architecture.md §4).
    # What a tenant's database and role are named after the prefix, so that
    # parallel test workers cannot claim each other's cluster objects (XIV-9).
    # Production never overrides this.
    app.tenant_object_prefix: 'tenant_'

    app.system_hosts:
        - 'localhost'
        - '127.0.0.1'
        - '[::1]'
        - 'php'

    # Hosts a non-production environment may still build an SMTP transport to,
    # because they accept mail and deliver none (XIV-37, and see
    # config/packages/mailer.yaml). Empty here and empty in test: the default is
    # that nothing outside production reaches a mail server at all, and dev opts
    # its catcher back in below. Production never reads this — the guard stands
    # down there entirely.
    app.mail.catcher_hosts: []

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        # Demo data is a development tool. Excluded here and registered again
        # under when@dev/when@test below, so the commands do not exist at all in
        # a production image — a stronger guarantee than a flag somebody could
        # pass by accident against a customer's database.
        exclude:
            - '../src/Command/GenerateDemoDataCommand.php'
            - '../src/Command/ClearDemoDataCommand.php'
            # Rebuilding a tenant from nothing and filling it with fiction
            # (XIV-72). Excluded for the same reason and not for the dangerous
            # one: tenant:deprovision is the more destructive command of the two
            # and ships, because removing a customer is a real operation. This
            # one is simply meaningless where the records are real.
            - '../src/Command/ResetTenantCommand.php'
            # Not a service at all, and excluded for a different reason from
            # everything else in this list (XIV-74): it is the little object
            # tenant:reset builds per run to remember how far it got, so it takes
            # a slug and a module list as constructor arguments and the container
            # could not autowire it if it tried. Excluded rather than given
            # defaults, because the defaults would exist to satisfy a compiler
            # pass rather than to mean anything.
            - '../src/Command/ResetProgress.php'
            # Reading a customer's whole shape out loud (XIV-76). Excluded for a
            # third reason again: not dangerous and not meaningless, but it hands
            # out every field definition and every hostname an installation has in
            # one call, and it exists to serve development tooling — the MCP
            # extension in packages/xivi-mate, which is itself a dev dependency
            # and absent from a production build. A capability whose only callers
            # cannot exist in production has no reason to be compiled into it.
            - '../src/ControlPlane/Introspection/'
            - '../src/ControlPlane/Command/InspectTenantCommand.php'
            # Faker is a dev dependency; this class would not even load in a
            # production build.
            - '../src/Demo/FakerSampleValues.php'

    # The engine operates on the tenant's database. Core deliberately has no idea
    # which one that is (it would have to know about tenancy to decide), so the
    # application says so here. Without these, autowiring would hand it the
    # control-plane connection and customer records would land in the registry.
    Xivi\Core\Metadata\MetadataRepository:
        arguments:
            $entityManager: '@doctrine.orm.tenant_entity_manager'

    Xivi\Core\Metadata\MetadataEditor:
        arguments:
            $entityManager: '@doctrine.orm.tenant_entity_manager'

    Xivi\Core\Module\ModuleInstaller:
        arguments:
            $entityManager: '@doctrine.orm.tenant_entity_manager'
            $connection: '@doctrine.dbal.tenant_connection'

    Xivi\Core\Record\RecordRepository:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    # What a form starts with (XIV-30). Core's own, and autowired: it reads a
    # shape and a record and asks nothing about whose database it is in.
    Xivi\Core\Record\RecordFormData: ~

    Xivi\Core\Export\RecordExporter: ~

    # The importer opens the transaction it either keeps or throws away, so it
    # needs the same connection the records are written on. Autowired, it would
    # get the control plane, and a rolled-back check would roll back nothing.
    Xivi\Core\Import\RecordImporter:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    Xivi\Core\Query\QueryCompiler:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    # Which records of a module a link may reach (XIV-13). Core asks by module
    # key, because a filter following a reference cannot know in advance which
    # module it will land in; the application resolves it from the same grants
    # every other check uses.
    Xivi\Core\Permission\RecordAccessProvider: '@App\Tenant\Security\CurrentUserRecordAccess'

    Xivi\Core\Record\RecordWriter:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    Xivi\Core\History\HistoryRepository:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    # Document numbers come out of the customer's own counters (XIV-15). On the
    # control plane they would be one sequence shared by every customer, which is
    # both wrong and a leak: my invoice numbers would tell you how many invoices
    # everybody else sent.
    Xivi\Core\Numbering\NumberAllocator:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    # Both write to the customer's database, so both need its connection rather
    # than the control plane's.
    Xivi\Core\Demo\DemoDataGenerator:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    Xivi\Core\Demo\DemoLedger:
        arguments:
            $connection: '@doctrine.dbal.tenant_connection'

    # Which currency prices are in. Core asks (Xivi\Core\Money\InstanceCurrency)
    # and never learns what a tenant is; the answer comes from the customer's own
    # profile (§8.6). Same boundary as the connections above, one level up: there
    # the application says which database, here it says whose settings (XIV-11).
    Xivi\Core\Money\InstanceCurrency: '@App\Tenant\Settings\ProfileCurrency'

    # And how long a customer gets to pay, when nothing on the customer says
    # otherwise (XIV-67). The same seam one line up, for the same reason: the
    # deriver that writes a due date has no business knowing what a tenant is.
    Xivi\Core\Payment\DefaultPaymentTerms: '@App\Tenant\Settings\ProfilePaymentTerms'

    # Documents (XIV-4). Core fills a .docx template and asks for a PDF through
    # Xivi\Core\Document\PdfConverter; the application answers with Gotenberg,
    # a service on the compose network. Same seam as the currency above.
    Xivi\Core\Document\PdfConverter: '@App\Tenant\Document\GotenbergPdfConverter'

    # And what a document can say that is not about the record: who this
    # installation is, and who is generating it (XIV-4).
    Xivi\Core\Document\DocumentContext: '@App\Tenant\Document\InstanceContext'

    Xivi\Core\Document\DocumentTemplateRepository:
        arguments:
            $entityManager: '@doctrine.orm.tenant_entity_manager'

    # Email templates are the customer's too, so they live where their records
    # do (XIV-38). Text rather than a blob, and otherwise the same call.
    Xivi\Core\Mail\EmailTemplateRepository:
        arguments:
            $entityManager: '@doctrine.orm.tenant_entity_manager'

    # Which sanitizer policy an email's HTML goes through (XIV-38). The framework
    # registers one service per named sanitizer and autowiring cannot guess which
    # of them a class means, so the application says — the same shape as the
    # connections above, one level up: there it says which database, here which
    # policy. The policy itself is config/packages/html_sanitizer.yaml.
    Xivi\Core\Mail\EmailRenderer:
        arguments:
            $sanitizer: '@html_sanitizer.sanitizer.email'

    # **Dev and test cannot put mail on the wire** (XIV-37). Registered ahead of
    # every factory symfony/mailer ships — priority, on the tag they all share —
    # so it is the first thing asked about any DSN the application turns into a
    # transport, whether that is MAILER_DSN or a tenant's own SMTP credentials.
    # Read the class for why the guarantee belongs at construction rather than in
    # a configured DSN: §9.2 already recorded that a DSN is simply believed.
    #
    # Defined here rather than in config/packages/mailer.yaml because this file
    # is loaded last and its `App\` resource would otherwise overwrite the
    # definition with an untagged one.
    App\Mail\NonProductionMailGuard:
        arguments:
            $environment: '%kernel.environment%'
            $catcherHosts: '%app.mail.catcher_hosts%'
        tags:
            - { name: 'mailer.transport_factory', priority: 255 }

    # The words demo data is made of. Core's own lists by default, so generation
    # works with no dependency; dev and test replace this with Faker below,
    # which has hundreds of names where these have thirty.
    Xivi\Core\Demo\SampleValues: '@Xivi\Core\Demo\BuiltInSampleValues'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

# The demo commands, excluded from the production build above.
when@dev:
    parameters:
        # The catcher, and the loopback for anybody running one on the host
        # (XIV-41, XIV-37). `mailpit` is a compose service on a private network
        # that accepts everything and delivers nothing, which is the only reason
        # development is allowed to open a socket to it at all.
        #
        # The test environment is deliberately absent from this list: §9.2 refuses
        # to read from the catcher there — eight paratest workers against one
        # inbox is a shared mutable thing — so a transport reaching it would be a
        # transport nothing is allowed to assert on.
        app.mail.catcher_hosts: ['mailpit', 'localhost', '127.0.0.1', '::1']

    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Command\GenerateDemoDataCommand: ~
        App\Command\ClearDemoDataCommand: ~
        App\Command\ResetTenantCommand: ~

        # **Public, and that is the load-bearing word** (XIV-76). Mate's MCP
        # server is its own process with its own container; a tool reaches this
        # application by booting the kernel and asking its container for this
        # service by name, which a private service refuses. Public here rather
        # than everywhere for the usual reason — a public service is one the
        # container can never inline or remove — and the blast radius is exactly
        # the environments where the MCP extension can be installed at all.
        App\ControlPlane\Introspection\TenantInspector:
            public: true

        App\ControlPlane\Command\InspectTenantCommand: ~

        App\Demo\FakerSampleValues: ~
        Xivi\Core\Demo\SampleValues: '@App\Demo\FakerSampleValues'

when@test:
    parameters:
        # One namespace per parallel worker, and one per *checkout* above it
        # (XIV-9, then XIV-51).
        #
        # TEST_TOKEN is paratest's own variable, numbered from one and empty on a
        # serial run — which leaves the name exactly as it was, so `composer test`
        # still finds the databases it left behind.
        #
        # **The token alone is not enough once two checkouts run at the same
        # time**, because both are handed the same eight numbers: worker 3 here
        # and worker 3 over there would claim one `tenant3_test_locale` between
        # them, and the second would connect with a password only the first's
        # registry knows. That is XIV-9's original failure — 245 of them —
        # arriving one layer up. TEST_RUN names the checkout and is empty for
        # anybody who never runs two.
        app.tenant_object_prefix: 'tenant%env(default::TEST_RUN)%%env(default::TEST_TOKEN)%_'

    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Command\GenerateDemoDataCommand: ~
        App\Command\ClearDemoDataCommand: ~
        App\Command\ResetTenantCommand: ~

        # Registered here too so the suite can cover it. Public is redundant in
        # this environment — `test.service_container` reaches private services
        # anyway — and is kept identical to dev so the two cannot drift.
        App\ControlPlane\Introspection\TenantInspector:
            public: true

        App\ControlPlane\Command\InspectTenantCommand: ~

        App\Demo\FakerSampleValues: ~
        Xivi\Core\Demo\SampleValues: '@App\Demo\FakerSampleValues'

        # Between DAMA (100) and TenantConnectionMiddleware (0): middlewares
        # connect from the lowest priority up, so this sees the tenant's resolved
        # database name and DAMA sees the key derived from it.
        App\Tests\Support\Dbal\TenantConnectionKeyMiddleware:
            tags:
                - { name: 'doctrine.middleware', connection: 'tenant', priority: 50 }

        # A module that exists only here, so the lifecycle machinery has
        # something to be tested against without inventing product behaviour in
        # a module customers actually have (XIV-14).
        App\Tests\Support\Module\JobModule: ~

        # Private services with no caller are removed when the container is
        # compiled, and nothing in the application validates a record yet — the
        # UI is the next thing to be built. Keeping it reachable so the engine can
        # be tested before something happens to use it.
        Xivi\Core\Validation\RecordValidator:
            public: true

        # The same situation one ticket later (XIV-80): the follow-up write path
        # is the engine half, and its callers are the record page (XIV-82) and the
        # dashboard widget (XIV-81), neither of which exists yet. The rules it
        # enforces are exactly the ones worth having under test *before* a screen
        # relies on them, so it stays reachable until something calls it.
        App\Tenant\FollowUp\FollowUpManager:
            public: true

        # XIV-37 and XIV-38 each had to be reachable from a test before anything
        # in the application called them. XIV-39 is that caller — the send screen
        # renders through EmailRenderer and sends through TenantMailer — so both
        # are ordinary private services again and the tests reach them through
        # the controller, which is the thing worth proving anyway.
