twig:
    file_name_pattern: '*.twig'
    # Symfony ships the Bootstrap 5 markup for forms, so a field rendered from a
    # definition gets the same structure a hand-written form would — including
    # the input group a price is drawn in, which its own money_widget block
    # already knows how to build (XIV-11).
    # The second one is core's, and it defines exactly one block: how a field
    # holding formatted text is drawn (XIV-131). It comes after Bootstrap's so
    # that the `textarea_widget` it calls into is the themed one — a formatted
    # field is a textarea in every respect that reaches the browser, plus a
    # preview underneath.
    # The third is core's as well ([XIV-115]): how a field holding a file is
    # drawn. After Bootstrap's for the same reason the second one is, since the
    # block it defines calls into the themed `form_widget` for the controls
    # inside it.
    form_themes:
        - 'bootstrap_5_layout.html.twig'
        - '@XiviCore/form/markdown.html.twig'
        - '@XiviCore/form/file.html.twig'
    globals:
        # Tenant name and module navigation, needed by every signed-in page.
        # Lazy: the login page renders without a tenant.
        chrome: '@App\Twig\AppChrome'
        # The constant itself, not a copy of the number: written down once in
        # src/Version.php, so configuration cannot drift away from code.
        app_version: !php/const App\Version::CURRENT

when@test:
    twig:
        strict_variables: true
