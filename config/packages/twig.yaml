twig:
    file_name_pattern: '*.twig'
    # Symfony ships the Bootstrap 5 markup for forms, so a field rendered from a
    # definition gets the same structure a hand-written form would — including
    # the input group a price is drawn in, which its own money_widget block
    # already knows how to build (XIV-11).
    form_themes: ['bootstrap_5_layout.html.twig']
    globals:
        # Tenant name and module navigation, needed by every signed-in page.
        # Lazy: the login page renders without a tenant.
        chrome: '@App\Twig\AppChrome'
        # The constant itself, not a copy of the number: written down once in
        # src/Version.php, so configuration cannot drift away from code.
        app_version: !php/const App\Version::CURRENT

when@test:
    twig:
        strict_variables: true
