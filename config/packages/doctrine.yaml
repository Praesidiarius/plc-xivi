doctrine:
    dbal:
        default_connection: control
        connections:
            # Control plane: the tenant registry. Fixed DSN, known at deploy time.
            control:
                url: '%env(resolve:DATABASE_URL)%'
                profiling_collect_backtrace: '%kernel.debug%'

            # Tenant: the customer database of the request being served.
            #
            # These parameters are a placeholder. App\Tenancy\Dbal\TenantDriver
            # replaces everything that identifies a database (host, port, dbname,
            # user, password) at connect time with the resolved tenant's DSN, and
            # throws when there is no resolved tenant — so this URL is never
            # actually connected to. It is configured at all because DBAL needs a
            # structurally valid set of parameters, including a server version, to
            # build the platform without opening a connection.
            tenant:
                url: '%env(resolve:DATABASE_URL)%'
                profiling_collect_backtrace: '%kernel.debug%'

    orm:
        default_entity_manager: control
        entity_managers:
            control:
                connection: control
                naming_strategy: doctrine.orm.naming_strategy.underscore
                validate_xml_mapping: true
                identity_generation_preferences:
                    Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
                mappings:
                    # **Two mappings, one database, and the split between them is
                    # XIV-60's** (§3, §4). Both land in the control-plane database
                    # and neither table moved, so the schema and every migration
                    # in migrations/control are untouched by this — what changed is
                    # which half of the codebase owns the class.
                    #
                    # The registry is what a *tenant's* request reads: which
                    # customer owns this hostname, what their database is called,
                    # what the credential is, which modules exist. An instance
                    # serving customers cannot boot without it, so it stays in the
                    # application.
                    Registry:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Registry/Entity'
                        prefix: 'App\Registry\Entity'
                        alias: Registry

                    # **The administration surface's own rows are mapped by the
                    # administration surface** (XIV-96, §4.4). An operator, a
                    # signup request and what a tenant was measured to be using
                    # all still land in this database and in these tables —
                    # nothing about the schema changed — but the mapping that
                    # declares them is `packages/control-plane/config/doctrine.php`,
                    # prepended by that package's bundle.
                    #
                    # It moved for the same reason the control-plane firewall
                    # did, and this was the less obvious of the two because it
                    # reads as data rather than as code: DoctrineBundle checks
                    # that a mapping's `dir` exists while the container is being
                    # built, so an application naming
                    # `packages/control-plane/src/Entity` here **cannot compile**
                    # in a build that does not have the package. The failure was
                    # identical to the security configuration's and considerably
                    # less legible, because the message names a directory rather
                    # than a class.

            tenant:
                connection: tenant
                naming_strategy: doctrine.orm.naming_strategy.underscore
                validate_xml_mapping: true
                identity_generation_preferences:
                    Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
                mappings:
                    Tenant:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Tenant/Entity'
                        prefix: 'App\Tenant\Entity'
                        alias: Tenant
                    # The engine's metadata tables live in each customer's own
                    # database, next to the records they describe.
                    XiviCore:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/packages/core/src/Entity'
                        prefix: 'Xivi\Core\Entity'
                        alias: XiviCore

when@test:
    doctrine:
        dbal:
            connections:
                # Tenant databases are named by the control-plane row, so only the
                # control database needs the test suffix.
                control:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            entity_managers:
                control:
                    query_cache_driver:
                        type: pool
                        pool: doctrine.system_cache_pool
                    result_cache_driver:
                        type: pool
                        pool: doctrine.result_cache_pool
                tenant:
                    # Query cache only: it maps DQL to SQL, which is identical for
                    # every tenant. The result cache is deliberately NOT enabled
                    # here — its keys are derived from the query, not from the
                    # database, so one pool shared by all tenants would serve
                    # customer A's rows to customer B (docs/architecture.md §7.4). Enabling it
                    # needs a pool namespaced by tenant first.
                    query_cache_driver:
                        type: pool
                        pool: doctrine.system_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
