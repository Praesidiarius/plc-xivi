# How often anybody may ask for an installation (XIV-64, docs/architecture.md §8.12).
#
# Confirmation and one-signup-per-confirmed-address are what make *squatting* a
# name expensive; neither of them makes *volume* expensive, and volume is its own
# harm — a script posting a thousand addresses a minute has used this
# installation to send a thousand people mail they did not ask for.
#
# `symfony/rate-limiter` rather than something hand-rolled, and the reason is the
# policy rather than the bookkeeping: a fixed window lets everything through
# again on the hour, and a sliding window written by hand is a subtle thing to
# get right. MIT, first-party, and it brings nothing with it that was not already
# installed (see THIRD-PARTY-NOTICES.md).
#
# The three buckets and what each is for are documented on
# Xivi\ControlPlane\Signup\SignupRateLimits, next to the code that spends them.
# The numbers are here because they are a deployment's to change.
framework:
    cache:
        pools:
            # Its own pool rather than the component's default `cache.rate_limiter`,
            # so that the test environment can swap the adapter below without
            # touching a pool anything else might come to use.
            #
            # **A filesystem adapter is a real shared store on this runtime and
            # only on this runtime.** FrankenPHP in classic mode is one instance
            # with one filesystem (§9.2), so every request sees the same counters.
            # A deployment that ever runs two instances needs a pool both of them
            # can see — Redis, or anything else shared — or each instance quietly
            # enforces its own copy of every limit below.
            cache.signup_rate_limiter:
                adapter: cache.adapter.filesystem

    rate_limiter:
        # By email address. The narrow bucket: it bounds how many confirmation
        # mails one mailbox can be made to receive, which is the harm a stranger
        # can aim at a *person* through this endpoint. Five, because the only
        # legitimate reason to submit one address repeatedly is "that mail did not
        # arrive", and nobody needs six goes at that in an hour.
        signup_address:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
            cache_pool: cache.signup_rate_limiter

        # By the visitor's address as the calling site reports it. Deliberately
        # loose: [XIV-65]'s recommended integration is a server-side post, so an
        # office of forty people behind one NAT shares one address, and a limit
        # tuned for one person would lock out a real customer on the day they
        # decide to sign up together.
        signup_client:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
            cache_pool: cache.signup_rate_limiter

        # Availability checks, which write nothing and send nothing. Its own
        # bucket and a much larger one, because a form that checks a name as
        # somebody types makes a request per pause in their typing — and sharing
        # the bucket above would mean a visitor who thought about their company
        # name for a while could not then sign up.
        signup_slug_check:
            policy: sliding_window
            limit: 300
            interval: '1 hour'
            cache_pool: cache.signup_rate_limiter

when@test:
    framework:
        cache:
            pools:
                # **In memory, per kernel.** Eight paratest workers against one
                # filesystem pool is a shared mutable thing — the same objection
                # §9.2 makes to reading the mail catcher in tests — and it would
                # make one class's requests count against another's limits, on a
                # different worker, on a rerun. An array adapter gives each test's
                # kernel an empty set of counters, which is also what lets a test
                # prove the limit by actually reaching it.
                cache.signup_rate_limiter:
                    adapter: cache.adapter.array
