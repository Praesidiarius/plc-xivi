# Where mail goes, which is one variable and deliberately nothing else.
#
# The component is installed for a reason narrower than it looks: `framework.mailer`
# is refused outright when symfony/mailer is absent — "Mailer support cannot be
# enabled as the component is not installed" — so a mail catcher cannot be pointed
# at with configuration alone. Nothing in the application sends mail yet (XIV-41);
# this is the socket the tickets that do will plug into.
#
# The DSN is per environment and lives in the .env files beside the database ones:
# `null://null` by default and in the test suite, the catcher in dev. Each is
# commented where it is set, which is where somebody changing it will be looking.
#
# What is *not* here is any restriction on where mail may be addressed — a DSN
# is believed, whatever it names, and this file has no opinion about that.
#
# **The restriction exists, and it is not configuration** (XIV-37).
# `App\Mail\NonProductionMailGuard` is registered ahead of every transport
# factory symfony/mailer ships, so outside production nothing that could deliver
# is ever *built* — not from this DSN and not from the per-tenant SMTP
# credentials `App\Tenant\Mail\TenantMailer` turns into one at request time. Its
# one concession is `app.mail.catcher_hosts`, which is the compose catcher in dev
# and empty everywhere else. Both are in config/services.yaml, next to the tag
# that does the work.
framework:
    mailer:
        dsn: '%env(MAILER_DSN)%'
