# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

# **The signup surface's import is not here** (XIV-96). It is
# `config/routes/signup.php`, which is a PHP file because it has to ask whether
# the control-plane package is in this build at all before naming its route
# loader, and a separate file because `MicroKernelTrait` imports
# `config/routes/*` *before* this file — which is the ordering that feature
# needs, and having the framework guarantee it beats having a comment ask for
# it. The argument for all of that is in that file.

controllers:
    resource: routing.controllers
